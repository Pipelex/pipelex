[meta]
version = "1.0.0"
description = "Pipelex kit configuration for agent documentation and cursor rules"

[agents]
demote = 1
default_set = "pipelex_language"

[agents.sets]
coding_standards = [
    "python_standards.md",
    "pytest_standards.md",
    "docs.md",
    "tdd.md",
]
pipelex_language = ["write_pipelex.md", "run_pipelex.md", "llms.md"]
all = [
    "python_standards.md",
    "pytest_standards.md",
    "docs.md",
    "tdd.md",
    "write_pipelex.md",
    "run_pipelex.md",
    "llms.md",
]

[cursor.front_matter]
alwaysApply = false

[cursor.files.python_standards.front_matter]
description = "Python coding standards and best practices"
globs = ["**/*.py"]

[cursor.files.pytest_standards.front_matter]
description = "Guidelines for writing unit tests"
globs = ["tests/**/*.py"]

[cursor.files.docs.front_matter]
description = "Guidelines for writing documentation"
globs = ["docs/**/*.md"]

[cursor.files.tdd.front_matter]
description = "Guidelines for writing test-driven development code"
globs = []

[cursor.files.write_pipelex.front_matter]
description = "Guidelines for writing Pipelex pipelines"
globs = ["**/*.plx", "**/pipelines/**/*.py"]

[cursor.files.run_pipelex.front_matter]
description = "Guidelines for running Pipelex pipelines"
globs = ["examples/**/*.py"]

[cursor.files.llms.front_matter]
description = "LLM configuration and usage guidelines"
globs = ["*.plx", "*.toml"]

[[targets]]
id = "agents_md"
path = "AGENTS.md"
strategy = "merge"
marker_begin = "<!-- BEGIN_PIPELEX_KIT_RULES -->"
marker_end = "<!-- END_PIPELEX_KIT_RULES -->"
parent = "# Coding Standards & Best Practices"

[[targets]]
id = "claude_md"
path = "CLAUDE.md"
strategy = "merge"
marker_begin = "<!-- BEGIN_PIPELEX_KIT_RULES -->"
marker_end = "<!-- END_PIPELEX_KIT_RULES -->"
parent = "# Coding Standards & Best Practices"
