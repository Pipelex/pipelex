####################################################################################################
# Pipelex Model Deck - Base Configuration
####################################################################################################
#
# This file defines model aliases and presets for Document extraction models, including
# extraction of text and images from documents and OCR and text extraction from images.
#
# Managed by `pipelex update`. To customize without conflict, edit
# x_custom_extract_deck.toml in this directory — pipelex never tracks or
# overwrites x_custom_* files. Local edits to this file are backed up
# to <file>.bak.<timestamp> on update but will not survive future runs.
#
# Model Reference Syntax:
# - Preset:    $preset_name or preset:preset_name
# - Alias:     @alias_name or alias:alias_name
#
# Documentation: https://docs.pipelex.com
# Support: https://go.pipelex.com/discord
#
####################################################################################################

####################################################################################################
# Document Extraction Default Choices
####################################################################################################

[extract]
choice_default = "@default-extract-document"

####################################################################################################
# Aliases
####################################################################################################

[extract.aliases]
default-premium = "~ocr-extractor"
default-extract-document = "~document-extractor"
default-extract-image = "~ocr-extractor"
default-text-from-pdf = "pypdfium2-extract-pdf"
default-no-inference = "pypdfium2-extract-pdf"
default-extract-web-page = "linkup-fetch"

####################################################################################################
# Waterfalls
####################################################################################################
#
# Each default resolves to the first entry an enabled backend serves: Mistral OCR with your own
# Mistral key. Documents fall back to reading a PDF's text layer locally, which needs no key but
# recovers no text from a scanned page.

[extract.waterfalls]
document-extractor = ["mistral-ocr", "pypdfium2-extract-pdf"]
ocr-extractor = ["mistral-ocr"]

####################################################################################################
# Extract Presets
####################################################################################################

[extract.presets]

# Testing
extract-testing = { model = "@default-extract-document", max_nb_images = 5, image_min_size = 50, description = "Testing preset for document extraction" }
