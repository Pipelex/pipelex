####################################################################################################
# Pipelex Model Deck - Document Generation Configuration
####################################################################################################
#
# This file defines the default engine a PipeDocGen step prints with, for each format and source,
# when the step names none with `model`. A source is where the document comes from: "layout" is the
# auto-layout of the step's inputs, "html" an HTML template, "template_file" an office template file.
# reportlab-pdf is built into Pipelex; the other engines come with the Pipelex document generation
# plugin, pipelex-doc-gen.
#
# Managed by `pipelex update`. To customize without conflict, create an
# x_custom_*.toml file in this directory — pipelex never tracks or
# overwrites x_custom_* files. Local edits to this file are backed up
# to <file>.bak.<timestamp> on update but will not survive future runs.
#
# Model Reference Syntax:
# - Preset:    $preset_name or preset:preset_name
# - Alias:     @alias_name or alias:alias_name
#
# Documentation: https://docs.pipelex.com
# Support: https://go.pipelex.com/discord
#
####################################################################################################

####################################################################################################
# Document Generation Default Choices, keyed "<format>.<source>"
####################################################################################################

[doc_gen.choice_defaults]
"pdf.layout" = "@default-pdf"
"pdf.html" = "@default-pdf-from-template"
"xlsx.layout" = "@default-xlsx"
"xlsx.template_file" = "@default-xlsx"
"docx.layout" = "@default-docx"
"docx.template_file" = "@default-docx"
"pptx.template_file" = "@default-pptx"

####################################################################################################
# Aliases
####################################################################################################

[doc_gen.aliases]
default-pdf = "reportlab-pdf"
default-pdf-from-template = "weasyprint-pdf"
default-xlsx = "openpyxl-xlsx"
default-docx = "docxtpl-docx"
default-pptx = "python-pptx"
