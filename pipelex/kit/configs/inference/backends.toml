####################################################################################################
# Pipelex Inference Backends Configuration
####################################################################################################
#
# This file configures the inference backends available to Pipelex.
# Each backend connects to a different AI service provider (OpenAI, Anthropic, Google, etc.).
#
# Documentation: https://docs.pipelex.com
# Support: https://go.pipelex.com/discord
#
####################################################################################################

[pipelex_gateway]
display_name = "⭐ Pipelex Gateway"
enabled = true                         # Enable after accepting terms via `pipelex init config`
api_key = "${PIPELEX_GATEWAY_API_KEY}"

# The Pipelex-operated inference service, currently in private beta. Shipped declared and OFF: it is
# the one backend whose `enabled` is read before any variable is resolved — the boot asks which
# managed backends are live in order to know which sections of the published configuration to slice
# — so an enabled-by-default manifold backend would warn about a missing section on every boot of
# every installation that has not joined the beta. Turn it on when you have the two variables.
#
# `endpoint` is the service ORIGIN — scheme, host and port, with no `/v1` and no trailing path. Each
# SDK appends what it expects beneath it, so a `/v1` written here would be sent twice. Never a
# literal URL: the service moves, and the environment is where that is recorded.
#
# `auth_header` names where the service reads the key from. It matters for the models this backend
# serves over Anthropic's own protocol: the Anthropic SDK puts its key on `x-api-key`, which the
# service never looks at, so without this line every Claude call reaches it anonymous and comes back
# 401. The OpenAI-substrate SDKs get the same header from the manifold factories directly.
[pipelex_manifold]
display_name = "Pipelex Manifold (private beta)"
enabled = false
endpoint = "${PIPELEX_MANIFOLD_ENDPOINT}"
api_key = "${PIPELEX_MANIFOLD_API_KEY}"
model_specs_section = "manifold_model_specs"
auth_header = "x-portkey-api-key"

[anthropic]
enabled = true
api_key = "${ANTHROPIC_API_KEY}"

[azure_openai]
display_name = "Azure OpenAI"
enabled = true
endpoint = "${AZURE_API_BASE}"
api_key = "${AZURE_API_KEY}"
api_version = "${AZURE_API_VERSION}"

[bedrock]
display_name = "Amazon Bedrock"
enabled = true
aws_region = "${AWS_REGION}"

[blackboxai]
display_name = "BlackBox AI"
enabled = true
endpoint = "https://api.blackbox.ai/v1"
api_key = "${BLACKBOX_API_KEY}"

[fal]
display_name = "FAL"
enabled = true
api_key = "${FAL_API_KEY}"

[google]
display_name = "Google AI"
enabled = true
api_key = "${GOOGLE_API_KEY}"

[groq]
display_name = "Groq"
enabled = true
endpoint = "https://api.groq.com/openai/v1"
api_key = "${GROQ_API_KEY}"

[huggingface]
display_name = "Hugging Face"
enabled = true
api_key = "${HF_TOKEN}"

[linkup]
display_name = "Linkup"
enabled = true
api_key = "${LINKUP_API_KEY}"

[minimax]
display_name = "MiniMax"
enabled = true
endpoint = "https://api.minimax.io/anthropic"
api_key = "${MINIMAX_API_KEY}"

[mistral]
display_name = "Mistral AI"
enabled = true
api_key = "${MISTRAL_API_KEY}"

[ollama]
enabled = true
endpoint = "http://localhost:11434/v1"

[openai]
display_name = "OpenAI"
enabled = true
api_key = "${OPENAI_API_KEY}"

[openrouter]
display_name = "OpenRouter"
enabled = true
endpoint = "https://openrouter.ai/api/v1"
api_key = "${OPENROUTER_API_KEY}"

[portkey]
display_name = "Portkey"
enabled = true
endpoint = "https://api.portkey.ai/v1"
api_key = "${PORTKEY_API_KEY}"

[scaleway]
display_name = "Scaleway"
enabled = true
endpoint = "${SCALEWAY_ENDPOINT}"
api_key = "${SCALEWAY_API_KEY}"

[vertexai]
display_name = "Google Vertex AI"
enabled = false                                            # This is the only one we disable because setting it up requires internet access just to get credentials so it fails in CI sandboxes
gcp_project_id = "${GCP_PROJECT_ID}"
gcp_location = "${GCP_LOCATION}"
gcp_credentials_file_path = "${GCP_CREDENTIALS_FILE_PATH}"

[xai]
display_name = "xAI"
enabled = true
endpoint = "https://api.x.ai/v1"
api_key = "${XAI_API_KEY}"

[internal] # software-only backend, runs internally, without AI
enabled = true
