################################################################################
# Mistral Backend Configuration
################################################################################
#
# This file defines the model specifications for Mistral AI models.
# It contains model definitions for various Mistral language models and specialized models
# accessible through the Mistral API.
#
# Configuration structure:
# - Each model is defined in its own section with the model name as the header
# - Headers with dots must be quoted (e.g., ["mistral-small-4"])
# - Model costs are in USD per million tokens (input/output)
#
# Documentation: https://docs.pipelex.com
# Support: https://go.pipelex.com/discord
#
################################################################################

################################################################################
# MODEL DEFAULTS
################################################################################

[defaults]
model_type = "llm"
sdk = "mistral"
structure_method = "instructor/mistral_tools"
thinking_mode = "none"

################################################################################
# LANGUAGE MODELS
################################################################################

# --- Ministral 3 Series -------------------------------------------------------
[ministral-3b]
model_id = "ministral-3b-latest"
max_tokens = 131072
inputs = ["text", "images", "pdf"]
outputs = ["text", "structured"]
costs = { input = 0.1, output = 0.1 }

[ministral-8b]
model_id = "ministral-8b-latest"
max_tokens = 262144
inputs = ["text", "images", "pdf"]
outputs = ["text", "structured"]
costs = { input = 0.15, output = 0.15 }

[ministral-14b]
model_id = "ministral-14b-latest"
max_tokens = 262144
inputs = ["text", "images", "pdf"]
outputs = ["text", "structured"]
costs = { input = 0.2, output = 0.2 }

# --- Mistral Codestral Series -------------------------------------------------
[mistral-codestral-2508]
model_id = "codestral-2508"
max_tokens = 256000
inputs = ["text"]
outputs = ["text", "structured"]
costs = { input = 0.3, output = 0.9 }

# --- Mistral Small Series -----------------------------------------------------
[mistral-small-2603]
model_id = "mistral-small-2603"
max_tokens = 262144
inputs = ["text", "images", "pdf"]
outputs = ["text", "structured"]
costs = { input = 0.15, output = 0.60 }
thinking_mode = "manual"

["mistral-small-4"]
model_id = "mistral-small-2603"
max_tokens = 262144
inputs = ["text", "images", "pdf"]
outputs = ["text", "structured"]
costs = { input = 0.15, output = 0.60 }
thinking_mode = "manual"

[mistral-small]
model_id = "mistral-small-latest"
max_tokens = 262144
inputs = ["text", "images", "pdf"]
outputs = ["text", "structured"]
costs = { input = 0.15, output = 0.60 }
thinking_mode = "manual"

# --- Mistral Medium Series ----------------------------------------------------
# mistral-medium-latest resolves to Mistral Medium 3.5, which Mistral has deprecated in favour of Mistral Large 4
[mistral-medium]
model_id = "mistral-medium-latest"
max_tokens = 262144
inputs = ["text", "images", "pdf"]
outputs = ["text", "structured"]
costs = { input = 1.5, output = 7.5 }
thinking_mode = "manual"

# --- Mistral Large Series -----------------------------------------------------
# Mistral Large 3 is deprecated in favour of Mistral Large 4
[mistral-large-2512]
model_id = "mistral-large-2512"
max_tokens = 262144
inputs = ["text", "images", "pdf"]
outputs = ["text", "structured"]
costs = { input = 0.5, output = 1.5 }

[mistral-large-3]
model_id = "mistral-large-2512"
max_tokens = 262144
inputs = ["text", "images", "pdf"]
outputs = ["text", "structured"]
costs = { input = 0.5, output = 1.5 }

[mistral-large-4]
model_id = "mistral-large-4"
max_tokens = 262144
inputs = ["text", "images", "pdf"]
outputs = ["text", "structured"]
costs = { input = 0.7, output = 2.1 }
thinking_mode = "manual"

[mistral-large]
model_id = "mistral-large-latest"
max_tokens = 262144
inputs = ["text", "images", "pdf"]
outputs = ["text", "structured"]
costs = { input = 0.7, output = 2.1 }
thinking_mode = "manual"

################################################################################
# EXTRACTION MODELS
################################################################################

# TODO: add support to pricing per page

[mistral-ocr-2512]
model_type = "text_extractor"
model_id = "mistral-ocr-2512"
max_tokens = 16384
inputs = ["pdf", "image"]
outputs = ["pages"]

["mistral-ocr-4.1"]
model_type = "text_extractor"
model_id = "mistral-ocr-4-1"
max_tokens = 16384
inputs = ["pdf", "image"]
outputs = ["pages"]

[mistral-ocr]
model_type = "text_extractor"
model_id = "mistral-ocr-latest"
max_tokens = 16384
inputs = ["pdf", "image"]
outputs = ["pages"]
