# The migration ledger for the inference backend definitions.
#
# One file per backend under `inference/backends/`, each a `[defaults]` table plus one root table per
# model name. The root keys of such a file are the model names *that machine* chose, so every
# operation here addresses `["*"]` — every root table, `[defaults]` included — and none may name one.
#
# See docs/migration-ledger.md for the contract this file obeys.

[surface]
id = "inference-backend"
title = "Inference backend model definitions"
subdirectory = "inference/backends"
tier_glob = "*.toml"
current_schema_version = 3
min_supported_schema_version = 0

[[migration]]
id = "inference-backend@2"
to_schema_version = 2
introduced_in = "0.46.0"
breaking = true
safety = "safe"
pre_history = true
title = "Drop prompting_target from every backend definition"
description = """
`prompting_target` used to name the prompt dialect a model wanted — `anthropic`, `gemini` — and a \
backend file set it in `[defaults]` for the whole file and overrode it on the models that differed. \
Prompt templating is now authored on the pipe (`templating_style` on a `PipeLLM`) rather than \
inferred from the model, so the field was removed from the model-spec blueprint and from every \
backend file we ship. A file written before that removal is not merely out of date: the blueprint \
is strict, and `pipelex init` never overwrites a file you already have, so the key stays behind and \
breaks the boot. This entry deletes it wherever it sits.
"""
guidance = """
The key is deleted rather than moved, because nothing today holds a per-model prompt dialect: choose
the style on the pipe that needs it, with `templating_style` on the `PipeLLM`.

One occurrence in `[defaults]` is enough to break the whole file — that table is copied into every
model of it before validation — which is why the operation below addresses every root table and not
only the models that spelled the key out.

This entry accounts for what *we* removed, and for nothing else. A per-model key of your own that
the loader refuses is still yours to fix: it is named, with the reason, in the message that refuses
it.
"""

# Declared rather than derived: this change predates the first fingerprint, so no snapshot shows the
# path going away and there is no diff to account the entry against. The hand-authored document the
# operation below is verified against is goldens/inference-backend/before@2.toml.
declared_removed_paths = ["*.prompting_target"]

[[migration.ops]] # `["*"]` is every root table of the file: `[defaults]` and each model alike
kind = "delete_key"
table_path = ["*"]
key = "prompting_target"

# Unsafe because `sdk` is a free string, an open token each plugin registers, so the schema cannot prove
# a spelling stale and the remap legality rule forbids a `safe` entry. Being unsafe costs nothing at boot:
# the old handle still validates, so the boot never reaches the ledger. What the entry buys is that
# `pipelex migrate` names each file still carrying the old handle, where it would otherwise report nothing
# to do while every Bedrock call from that file fails on an unregistered SDK.
[[migration]]
id = "inference-backend@3"
to_schema_version = 3
introduced_in = "0.69.0"
breaking = true
safety = "unsafe"
title = "Rename the bedrock_aioboto3 SDK handle to bedrock_aioboto, by hand"
description = """
Bedrock's async client now runs on `aiobotocore` directly rather than through `aioboto3`, which pinned \
`boto3` to an old release, so the SDK handle that selects it is renamed from `bedrock_aioboto3` to \
`bedrock_aioboto`, a name for the async client that no longer names the library it is built on. A backend \
file that still names the old handle keeps loading, but every call to a model it defines fails, because no \
plugin registers that SDK any more.
"""
guidance = """
Replace `sdk = "bedrock_aioboto3"` with `sdk = "bedrock_aioboto"` wherever the file sets it: in \
`[defaults]`, which is where the Bedrock file we ship sets it, and in any model table that overrides it. \
Nothing else changes, and the synchronous `bedrock_boto3` handle keeps its name.
"""

[[migration.ops]] # `["*"]` is every root table of the file: `[defaults]` and each model alike
kind = "remap_value"
table_path = ["*"]
key = "sdk"
mapping = { bedrock_aioboto3 = "bedrock_aioboto" }
