[[migration]]
id = "pipelex-config@4"
to_schema_version = 4
introduced_in = "0.59.0"
breaking = true
safety = "safe"
title = "Retire the text and HTML renderings of traced data"
description = """
`stuff_text_content` and `stuff_html_content` under `[interpreter.pipeline_execution.graph.data_inclusion]` \
are gone: the tracer no longer renders each traced input and output to Rich text and to HTML on the \
execution path, and a graph's data carries its JSON content only. The two keys are deleted from files \
that still set them.
"""
guidance = """
Nothing to decide. The renderings fed only the Mermaid graph page's Pretty and HTML tabs; that page now \
shows a data node's JSON, with a preview for image and PDF content.
"""

[[migration.ops]]
kind = "delete_key"
table_path = ["interpreter", "pipeline_execution", "graph", "data_inclusion"]
key = "stuff_text_content"

[[migration.ops]]
kind = "delete_key"
table_path = ["interpreter", "pipeline_execution", "graph", "data_inclusion"]
key = "stuff_html_content"

# Safe, with one thing it cannot do, said in the title because the title is what a person sees. Two of
# the retired keys chose a behaviour their deletion undoes: `log_mode = "poor"` chose plain output for a
# process with no terminal, whose replacement is `sink = "json"`, and `is_console_logging_enabled = false`
# chose silence, whose replacement is `default_log_level = "OFF"`. No operation in this vocabulary writes
# a value, and a `remap_value` onto `sink` is refused as `safe` because `sink` is an open token rather
# than an enumeration. An `unsafe` entry would block every file that still carries the keys at their
# old defaults, which is every full copy of an older base file, for the sake of the two that chose
# otherwise; so the keys are deleted, and the file that chose otherwise sets its replacement by hand.
[[migration]]
id = "pipelex-config@5"
to_schema_version = 5
introduced_in = "0.60.0"
breaking = true
safety = "safe"
title = "Log sinks replace the rich-or-poor log mode: by hand, a poor-mode file then selects sink = \"json\" and a silenced one sets pipelex = \"OFF\" under package_log_levels"
description = """
Where log records go is now a sink selected by `[runtime.log] sink`, a registered token such as \
`console`, `json` or `otlp`, in place of the `rich` / `poor` log mode. `log_mode`, the poor-logger \
settings `poor_loggers` and `generic_poor_logger`, and `is_console_logging_enabled` are deleted from \
files that still set them, and the defaults layer supplies `sink = "console"`, the Rich rendering. A \
file that had set `log_mode = "poor"` or `is_console_logging_enabled = false` chose a behaviour that \
this deletion undoes, and no migration may write the replacement: such a file sets `sink = "json"` or \
`pipelex = "OFF"` under `[runtime.log.package_log_levels]` by hand.
"""
guidance = """
A file that set `log_mode = "poor"` chose a plain handler for a process with no terminal; that process \
now sets `sink = "json"` in `[runtime.log]`, one JSON object per line, which is what a log agent ingests \
without a parser. A file that set `log_mode = "rich"` chose what the default, `console`, renders, and \
needs nothing.

`is_console_logging_enabled = false` silenced every handler on the root logger. To silence Pipelex's \
own records set `pipelex = "OFF"` under `[runtime.log.package_log_levels]` in the project override: \
that section pins the `pipelex` logger at `INFO` in the base configuration, the override deep-merges \
over it and leaves the third-party levels alone, and `default_log_level` governs only the loggers the \
section does not pin, so on its own it silences none of Pipelex's records. Silence for everything, \
which is what the old flag did, takes `default_log_level = "OFF"` and every entry of that section at \
`OFF`. To send the records somewhere else instead, select the sink that goes there.

`poor_loggers` and `generic_poor_logger` routed some records to a plain stream handler beside the \
console; every record now goes to the one selected sink, so there is nothing to carry over.
"""

[[migration.ops]]
kind = "delete_key"
table_path = ["runtime", "log"]
key = "log_mode"

[[migration.ops]]
kind = "delete_key"
table_path = ["runtime", "log"]
key = "poor_loggers"

[[migration.ops]]
kind = "delete_key"
table_path = ["runtime", "log"]
key = "generic_poor_logger"

[[migration.ops]]
kind = "delete_key"
table_path = ["runtime", "log"]
key = "is_console_logging_enabled"
