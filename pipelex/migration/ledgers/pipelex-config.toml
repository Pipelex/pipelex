# The migration ledger for the main Pipelex configuration.
#
# Every shape change this surface undergoes is recorded here as data, in order, and replayed in
# full over every one of the surface's files on every run. See docs/migration-ledger.md — it is
# normative, and it explains why there are no `set_key`-style operations in this vocabulary and
# why no version record ever causes work to be skipped.
#
# Entries are appended by `make umig` through the add-migration skill, never hand-invented.

[surface]
id = "pipelex-config"
title = "The main Pipelex configuration"
base_file = "pipelex.toml"
tier_glob = "pipelex_*.toml"
current_schema_version = 8
min_supported_schema_version = 0

# This entry is inserted *below* the reshape rather than appended above it, and the order is what
# makes it work: it addresses `pipelex.prompting_config`, the spelling that exists only while the
# root table is still called `[pipelex]`. After the reshape it would find nothing, and the file
# would come out of the run carrying `[interpreter.prompting_config]` — a table nothing reads.
[[migration]]
id = "pipelex-config@2"
to_schema_version = 2
introduced_in = "0.46.0"
breaking = true
safety = "safe"
pre_history = true
title = "Prompting styles become a templating default"
description = """
A prompting style used to be chosen for you, per *target*: the configuration held a map from a \
model family — `openai`, `anthropic`, `mistral`, `gemini` — to the tag style prompts for it should \
use, and a `default_prompting_style` for everything else. Styling is now a property of the prompt \
rather than of the model that receives it, so the map went away and what remains is one default, \
under the name the templating section gives it. This entry carries a file written before that \
change onto the shape the reshape then moves.
"""
guidance = """
`default_prompting_style` travels: it becomes `default_templating_style`, and the reshape entry \
after this one carries it on to `[inference.templating]` with the rest of that section.

A tuned `[pipelex.prompting_config.prompting_styles]` map is **dropped**, and nothing restores it \
from somewhere else — per-target styling is not a concept any more. Where a particular pipe needs \
a particular style, say so on the pipe: `templating_style` on a `PipeLLM`.
"""

# Declared rather than derived: this change predates the first fingerprint, so no snapshot shows
# these paths going away and there is no diff to account the entry against. The hand-authored
# document the operations below are verified against is goldens/pipelex-config/before@2.toml.
declared_removed_paths = [
  "pipelex.prompting_config",
  "pipelex.prompting_config.default_prompting_style",
  "pipelex.prompting_config.prompting_styles",
]

[[migration.ops]] # the destination table does not exist before this: the move creates it
kind = "move_key"
table_path = ["pipelex", "prompting_config"]
key = "default_prompting_style"
new_table_path = ["pipelex", "templating_config"]
new_key = "default_templating_style"

[[migration.ops]] # the map goes first, so what is left of the section is empty when it goes
kind = "delete_table"
table_path = ["pipelex", "prompting_config", "prompting_styles"]

[[migration.ops]]
kind = "delete_table"
table_path = ["pipelex", "prompting_config"]

[[migration]]
id = "pipelex-config@3"
to_schema_version = 3
introduced_in = "0.46.0"
breaking = true
safety = "safe"
title = "The configuration reshape: one scheme for the root"
description = """
The root gets the layers the code already has, instead of a grab-bag (`[pipelex]`), a codename \
(`[cogt]`), a plugin-system table (`[plugins]`), a rename-hint table (`[migration]`) and a stray \
`session_id`. Kernel-layer infrastructure moves under `[runtime]`, the model-calling seam becomes \
`[inference]`, library-scoped method machinery becomes `[interpreter]`, and the dev-tooling section \
becomes `[kit]`. The redundant `_config` suffix is dropped from every key, at every depth. Every \
setting keeps its value; only its address changes.
"""
guidance = """
Values are unchanged — only addresses. Three things do go away, and none of them is recoverable by \
moving it somewhere else:

- Custom `[migration.migration_maps.*]` entries have no equivalent and are dropped. They only ever \
  annotated validation-error messages with old-to-new name hints, and renames are recorded as \
  ledger entries now. The `.mthds` renaming hints go with them until the language surface restores them.
- `session_id`, if you ever pinned it, is dropped: it was process state living on the config object, \
  and nothing in `pipelex` reads it.
- `boot_orchestrator`, if anyone ever wrote it into a file, is dropped because it is a boot \
  argument (`--orchestrator`, or `Pipelex.setup(boot_orchestrator=...)`), not a setting.

A moved section may appear at the end of the migrated file rather than where it was, and it takes \
the comment banner that introduced it along. That is expected; the file is otherwise untouched.
"""

# --- Kernel-layer infrastructure out of [pipelex], into [runtime] ------------------------------
# Children move out of [pipelex] before [pipelex] itself is renamed, so the rename that follows
# carries only what belongs to the interpreter.

[[migration.ops]]
kind = "move_key"
table_path = ["pipelex"]
key = "storage_config"
new_table_path = ["runtime"]
new_key = "storage"

[[migration.ops]]
kind = "move_key"
table_path = ["pipelex"]
key = "secrets_config"
new_table_path = ["runtime"]
new_key = "secrets"

[[migration.ops]]
kind = "move_key"
table_path = ["pipelex"]
key = "log_config"
new_table_path = ["runtime"]
new_key = "log"

# A rename inside a parent that has already moved: the source path is intermediate by construction,
# which is why op legality is evaluated over the entry's own sequential path state.
[[migration.ops]]
kind = "rename_table_key"
table_path = ["runtime", "log"]
key = "rich_log_config"
new_key = "rich_log"

[[migration.ops]]
kind = "move_key"
table_path = ["pipelex"]
key = "aws_config"
new_table_path = ["runtime"]
new_key = "aws"

[[migration.ops]]
kind = "move_key"
table_path = ["pipelex"]
key = "reporting_config"
new_table_path = ["runtime"]
new_key = "reporting"

[[migration.ops]]
kind = "move_key"
table_path = ["pipelex"]
key = "tracing_config"
new_table_path = ["runtime"]
new_key = "tracing"

[[migration.ops]]
kind = "move_key"
table_path = ["pipelex"]
key = "observer_config"
new_table_path = ["runtime"]
new_key = "observer"

# Before [plugins] moves, so the deleted key's source is a schema-1 path rather than an
# intermediate one. It was never settable in practice, so this skips on every real file.
[[migration.ops]]
kind = "delete_key"
table_path = ["plugins"]
key = "boot_orchestrator"

[[migration.ops]]
kind = "move_key"
table_path = []
key = "plugins"
new_table_path = ["runtime"]
new_key = "plugins"

# --- [cogt] becomes [inference] ----------------------------------------------------------------
# The root rename comes before anything moves *into* [inference]: renaming the root table rewrites
# every `[cogt.*]` header in place, keeping each child where the user put it.

[[migration.ops]]
kind = "rename_table_key"
table_path = []
key = "cogt"
new_key = "inference"

[[migration.ops]]
kind = "rename_table_key"
table_path = ["inference"]
key = "model_deck_config"
new_key = "model_deck"

[[migration.ops]]
kind = "rename_table_key"
table_path = ["inference"]
key = "llm_config"
new_key = "llm"

[[migration.ops]]
kind = "rename_table_key"
table_path = ["inference", "llm"]
key = "instructor_config"
new_key = "instructor"

[[migration.ops]]
kind = "rename_table_key"
table_path = ["inference", "llm"]
key = "openai_config"
new_key = "openai"

[[migration.ops]]
kind = "rename_table_key"
table_path = ["inference", "llm"]
key = "anthropic_config"
new_key = "anthropic"

[[migration.ops]]
kind = "rename_table_key"
table_path = ["inference", "llm"]
key = "google_config"
new_key = "google"

[[migration.ops]]
kind = "rename_table_key"
table_path = ["inference", "llm"]
key = "mistral_config"
new_key = "mistral"

[[migration.ops]]
kind = "rename_table_key"
table_path = ["inference"]
key = "img_gen_config"
new_key = "img_gen"

[[migration.ops]]
kind = "rename_table_key"
table_path = ["inference", "img_gen"]
key = "img_gen_job_config"
new_key = "img_gen_job"

[[migration.ops]]
kind = "rename_table_key"
table_path = ["inference"]
key = "extract_config"
new_key = "extract"

[[migration.ops]]
kind = "rename_table_key"
table_path = ["inference"]
key = "gateway_test_config"
new_key = "gateway_test"

# The two sections whose readers are the kernel's inference seam (ruling R3).

[[migration.ops]]
kind = "move_key"
table_path = ["pipelex"]
key = "templating_config"
new_table_path = ["inference"]
new_key = "templating"

[[migration.ops]]
kind = "move_key"
table_path = ["pipelex"]
key = "dry_run_config"
new_table_path = ["inference"]
new_key = "dry_run"

# --- Dev tooling to the root -------------------------------------------------------------------

[[migration.ops]]
kind = "move_key"
table_path = ["pipelex"]
key = "kit_config"
new_table_path = []
new_key = "kit"

# --- What remains of [pipelex] is the interpreter -----------------------------------------------

[[migration.ops]]
kind = "rename_table_key"
table_path = []
key = "pipelex"
new_key = "interpreter"

[[migration.ops]]
kind = "rename_table_key"
table_path = ["interpreter"]
key = "mthds_config"
new_key = "mthds"

[[migration.ops]]
kind = "rename_table_key"
table_path = ["interpreter"]
key = "pipe_run_config"
new_key = "pipe_run"

[[migration.ops]]
kind = "rename_table_key"
table_path = ["interpreter"]
key = "pipe_func_config"
new_key = "pipe_func"

[[migration.ops]]
kind = "rename_table_key"
table_path = ["interpreter"]
key = "pipeline_execution_config"
new_key = "pipeline_execution"

[[migration.ops]]
kind = "rename_table_key"
table_path = ["interpreter", "pipeline_execution"]
key = "graph_config"
new_key = "graph"

[[migration.ops]]
kind = "rename_table_key"
table_path = ["interpreter", "pipeline_execution", "graph"]
key = "mermaid_config"
new_key = "mermaid"

[[migration.ops]]
kind = "rename_table_key"
table_path = ["interpreter", "pipeline_execution", "graph"]
key = "reactflow_config"
new_key = "reactflow"

[[migration.ops]]
kind = "rename_table_key"
table_path = ["interpreter"]
key = "scan_config"
new_key = "scan"

[[migration.ops]]
kind = "rename_table_key"
table_path = ["interpreter"]
key = "builder_config"
new_key = "builder"

# --- Deletions last ------------------------------------------------------------------------------

[[migration.ops]]
kind = "delete_table"
table_path = ["migration"]

[[migration.ops]]
kind = "delete_key"
table_path = []
key = "session_id"

[[migration]]
id = "pipelex-config@4"
to_schema_version = 4
introduced_in = "0.59.0"
breaking = true
safety = "safe"
title = "Retire the text and HTML renderings of traced data"
description = """
`stuff_text_content` and `stuff_html_content` under `[interpreter.pipeline_execution.graph.data_inclusion]` \
are gone: the tracer no longer renders each traced input and output to Rich text and to HTML on the \
execution path, and a graph's data carries its JSON content only. The two keys are deleted from files \
that still set them.
"""
guidance = """
Nothing to decide. The renderings fed only the Mermaid graph page's Pretty and HTML tabs; that page now \
shows a data node's JSON, with a preview for image and PDF content.
"""

[[migration.ops]]
kind = "delete_key"
table_path = ["interpreter", "pipeline_execution", "graph", "data_inclusion"]
key = "stuff_text_content"

[[migration.ops]]
kind = "delete_key"
table_path = ["interpreter", "pipeline_execution", "graph", "data_inclusion"]
key = "stuff_html_content"

# Safe, with one thing it cannot do, said in the title because the title is what a person sees. Two of
# the retired keys chose a behaviour their deletion undoes: `log_mode = "poor"` chose plain output for a
# process with no terminal, whose replacement is `sink = "json"`, and `is_console_logging_enabled = false`
# chose silence, whose replacement is `pipelex = "OFF"` under `[runtime.log.package_log_levels]`. Neither
# replacement can be translated by a migration: no operation in this vocabulary writes a value at all, a
# `remap_value` reaches a string alone where that key holds a bool and is refused as `safe` onto `sink`,
# an open token rather than an enumeration, and the package level is a concrete key beneath an open node,
# which no operation may address. So the only lever left is `unsafe`, and `unsafe` is the wrong one here:
# safety is a property of an entry and this version's link owns all four removals, so it cannot be
# narrowed to the case that matters, and it would stop the boot of every file still carrying any of these
# keys at their old defaults — every full copy of an older base file — for the sake of the few that chose
# otherwise. Nothing chose otherwise. That is the decision, recorded here rather than argued again having
# been raised and settled on each review round of the branch that retired these keys: no deployment set
# these keys, nothing depends on the flag outliving its removal, and this project keeps no backward
# compatibility. So the keys are deleted, and a file that did choose otherwise sets its replacement by
# hand, which is what the title and the guidance are for.
[[migration]]
id = "pipelex-config@5"
to_schema_version = 5
introduced_in = "0.66.0"
breaking = true
safety = "safe"
title = "Log sinks replace the rich-or-poor log mode: by hand, a poor-mode file then selects sink = \"json\" and a silenced one sets pipelex = \"OFF\" under package_log_levels"
description = """
Where log records go is now a sink selected by `[runtime.log] sink`, a registered token such as \
`console`, `json` or `otlp`, in place of the `rich` / `poor` log mode. `log_mode`, the poor-logger \
settings `poor_loggers` and `generic_poor_logger`, and `is_console_logging_enabled` are deleted from \
files that still set them, and the defaults layer supplies `sink = "console"`, the Rich rendering. A \
file that had set `log_mode = "poor"` or `is_console_logging_enabled = false` chose a behaviour that \
this deletion undoes, and no migration may write the replacement: such a file sets `sink = "json"` or \
`pipelex = "OFF"` under `[runtime.log.package_log_levels]` by hand.
"""
guidance = """
A file that set `log_mode = "poor"` chose a plain handler for a process with no terminal; that process \
now sets `sink = "json"` in `[runtime.log]`, one JSON object per line, which is what a log agent ingests \
without a parser. A file that set `log_mode = "rich"` chose what the default, `console`, renders, and \
needs nothing.

`is_console_logging_enabled = false` suppressed every record Pipelex's own log calls emitted, third-party \
loggers still reaching the handlers. To suppress them now set `pipelex = "OFF"` under \
`[runtime.log.package_log_levels]` in the project override: that section pins the `pipelex` logger at \
`INFO` in the base configuration, the override deep-merges over it and leaves the third-party levels \
alone, and `default_log_level` governs only the loggers the section does not pin, so on its own it \
silences none of Pipelex's records. Silence for everything, third-party loggers included, takes \
`default_log_level = "OFF"` and every entry of that section at `OFF`. To send the records somewhere \
else instead, select the sink that goes there. `is_console_logging_enabled = true` was the default and \
asks for nothing beyond the deletion the migration performs.

`poor_loggers` and `generic_poor_logger` routed some records to a plain stream handler beside the \
console; every record now goes to the one selected sink, so there is nothing to carry over.
"""

[[migration.ops]]
kind = "delete_key"
table_path = ["runtime", "log"]
key = "log_mode"

[[migration.ops]]
kind = "delete_key"
table_path = ["runtime", "log"]
key = "poor_loggers"

[[migration.ops]]
kind = "delete_key"
table_path = ["runtime", "log"]
key = "generic_poor_logger"

[[migration.ops]]
kind = "delete_key"
table_path = ["runtime", "log"]
key = "is_console_logging_enabled"

# Safe, because the remap legality rule holds: both paths are enum-typed at this version and `DEV` is no
# longer a member, so a current-valid file cannot carry it and a replay over one skips. `INFO` rather than
# `DEBUG` because it is the faithful threshold: a level of `DEV` (15) passed `INFO` and above plus the `DEV`
# records, and nothing logs at 15 any more, so `INFO` passes exactly the same records. `DEBUG` would lower
# the threshold, and under `package_log_levels` that would turn on a third-party library's debug output,
# an SDK's request dumps with prompt content among them, which the file had chosen to suppress.
[[migration]]
id = "pipelex-config@6"
to_schema_version = 6
introduced_in = "0.81.0"
breaking = true
safety = "safe"
title = "Retire the DEV log level: a file naming it logs at INFO"
description = """
The `DEV` log level, which sat between `DEBUG` and `INFO`, is gone, along with `log.dev()`. A file that \
names it as `default_log_level` or as a level under `[runtime.log.package_log_levels]` has it rewritten to \
`INFO`, which lets through exactly the records `DEV` did now that nothing logs at the `DEV` level.
"""
guidance = """
Nothing to decide: the rewritten file logs what it logged before. Set `DEBUG` where you want the lines a \
diagnosis needs, which `DEV` never showed.
"""

[[migration.ops]]
kind = "remap_value"
table_path = ["runtime", "log"]
key = "default_log_level"
mapping = { DEV = "INFO" }

[[migration.ops]] # the package names are the user's own keys, so `*` reaches each of them
kind = "remap_value"
table_path = ["runtime", "log", "package_log_levels"]
key = "*"
mapping = { DEV = "INFO" }

[[migration]]
id = "pipelex-config@7"
to_schema_version = 7
introduced_in = "0.81.0"
breaking = true
safety = "safe"
title = "The console reads no log message as markup"
description = """
`is_markup_enabled` under `[runtime.log.rich_log]` is gone: the `console` sink prints every log message as \
written and reads none of it as Rich markup, the colour coming from the fields and the layouts instead. The \
key is deleted from files that still set it.
"""
guidance = """
Nothing to decide. No Pipelex log message carries markup any more, and a message read as markup lost \
whatever in it was shaped like a tag, a `list[int]` or a lowercase logger's `[name]: ` prefix. Text you \
log through Pipelex now prints exactly as written, so a message that relied on markup for its colour shows \
its tags: put the values in `fields`, which the console colours by name.
"""

[[migration.ops]]
kind = "delete_key"
table_path = ["runtime", "log", "rich_log"]
key = "is_markup_enabled"

[[migration]]
id = "pipelex-config@8"
to_schema_version = 8
introduced_in = "0.82.0"
breaking = true
safety = "safe"
title = "Drop the maintainer-only [inference.gateway_test] section"
description = """
`[inference.gateway_test]` held the `config_id_substitutions` map that let Pipelex staff swap the \
Pipelex Gateway's model configurations while testing, and it went unread when the Gateway backend left \
the runtime in 0.73.0. The section is gone from the configuration, and a file still carrying it loses it.
"""
guidance = """
Nothing to decide: the map was empty unless a maintainer filled it, and nothing has read it since \
0.73.0, so dropping it changes no behaviour.
"""

[[migration.ops]]
kind = "delete_table"
table_path = ["inference", "gateway_test"]
