domain = "concept"
definition = "Build and process concepts for Pipelex bundles from signatures and drafts."

[concept]
UserBrief = "A short, natural-language description of what the user wants."
ConceptSpec = "A specification for a concept including its code, description, and a structure draft as plain text."
ConceptStructureBlueprint = "A concept blueprint with structure but without full implementation."
ConceptBlueprint = "A structured blueprint for a concept."

[pipe.build_concept_blueprint]
type = "PipeSequence"
description = "Create a ConceptBlueprint from a brief, one PipeSignature, existing concepts, and concept rules."
inputs = { brief = "concept.UserBrief", signature = "PipeSignature", existing_concepts = "ConceptsSpec", concept_rules = "Text" }
output = "ConceptBlueprint"
steps = [
    { pipe = "to_concept_spec", result = "concept_spec" },
    { pipe = "spec_to_structure", result = "concept_structure" },
    { pipe = "to_concept_blueprint", result = "concept_blueprint" }
]

[pipe.to_concept_spec]
type = "PipeLLM"
description = "From the brief and one signature, propose a ConceptSpec (with a structure draft in plain text)."
inputs = { brief = "concept.UserBrief", signature = "PipeSignature", existing_concepts = "ConceptsSpec", concept_rules = "Text" }
output = "ConceptSpec"
structuring_method = "preliminary_text"
prompt_template = """
Return a ConceptSpec for the concept implied by the signature.
Use existing_concepts to avoid duplicates or to refine an existing concept.

Brief:
@brief

Signature:
@signature

Existing concepts:
@existing_concepts

Rules:
@concept_rules
"""

[pipe.spec_to_structure]
type = "PipeLLM"
description = "Convert the ConceptSpec (with its structure draft) into a proper ConceptStructureBlueprint."
inputs = { concept_spec = "ConceptSpec", concept_rules = "Text" }
output = "ConceptStructureBlueprint"
structuring_method = "preliminary_text"
prompt_template = """
Create a ConceptStructureBlueprint from the ConceptSpec.

ConceptSpec:
@concept_spec

Rules:
@concept_rules
"""

[pipe.to_concept_blueprint]
type = "PipeLLM"
description = "Generate the final ConceptBlueprint using the spec, structure, rules, and existing concept context."
inputs = { concept_spec = "ConceptSpec", concept_structure = "ConceptStructureBlueprint", existing_concepts = "ConceptsSpec", concept_rules = "Text" }
output = "ConceptBlueprint"
structuring_method = "preliminary_text"
prompt_template = """
Create a ConceptBlueprint using the ConceptSpec and ConceptStructureBlueprint.
Align with existing_concepts (reuse or refine if a matching code exists).

ConceptSpec:
@concept_spec

Structure:
@concept_structure

Existing concepts:
@existing_concepts

Rules:
@concept_rules
"""

