[error.optional_force_redundant]
code = "optional_force_redundant"
excluded = "Advisory-only: it rides the validation report's `warnings` array and never makes a verdict invalid. An entry contract that models one `expected_error` on an invalid entry has nowhere to put a warning on a valid one, so there is no shape a focused entry could take. Revisit if the manifest ever grows a warnings axis."

