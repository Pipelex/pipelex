code = "PipeFunc"
excluded = "A PipeFunc names a Python function that is resolved against the runtime's function registry at validation time, so an entry declaring one fails with \"Function '<name>' not found in registry\" in every consumer that has not registered that exact function. A corpus entry has to validate everywhere, and the cross-language consumers cannot register a Python function at all, so no portable focused entry exists. Exercise PipeFunc in a consumer's own fixtures."

