code = "unknown_validation_error"
excluded = "The generic fallback for a validation failure that matched no specific code. Reaching it on purpose would mean authoring a bundle that breaks in a way the categorizer does not recognize — which is a state to fix in the runtime, not to pin in a corpus entry that would then have to be rewritten the moment the fault gets a code of its own."

[error.unknown_concept]
code = "unknown_concept"
excluded = "Shadowed: it fires in the pipe factory when a pipe's output names a concept that is neither native, nor declared in the pipe's own domain, nor domain-qualified — exactly the condition the earlier concept-reference resolution already rejects, and it reports the same fault as `unresolved_concept`. Measured across unqualified, cross-domain and qualified-but-missing output refs: every one of them comes back as `unresolved_concept`, so the factory's own check is unreachable from a `.mthds` file."

[error.unknown_factory_error]
code = "unknown_factory_error"
excluded = "The generic fallback for a pipe-construction failure that matched no specific code, and excluded for the same reason as its validation counterpart: an entry pinning it would be pinning the absence of a diagnosis rather than a language fault."

