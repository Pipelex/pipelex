[feature.binding_step]
description = "A PipeSequence step `{ from = \"invoice.total\", result = \"total_amount\" }` that binds the value at a path in working memory to a new name: its concept is derived from the declared structures the path walks, its value is a deep copy taken when the step runs, a path crossing a list binds a flat list, and a path reaching nothing records an absence."

[feature.intent_hints]
description = "An `intent` hint authored in a `hints` table — on a concept, a structure field, or an expanded input slot — carrying non-normative presentation intent (`prose`, `label`, `rating`, `quantity`) that renderers may honor and every other consumer safely ignores."

[feature.markdown_filter]
description = "The `markdown` filter of an HTML template, `{{ order.notes | markdown }}`, which turns Markdown held in a plain text field into HTML: raw HTML in the source is shown as text, and only a URL with a scheme becomes a link."

[feature.multi_file_library]
description = "A method split across several `.mthds` files in one directory and merged additively behind a `bundle.mthds` entry point, so a pipe can be forward-declared as a signature in one file and satisfied by a concrete definition in another."

[feature.optionals]
description = "An input declared optional with the `?` suffix, so a run that has no value for it proceeds instead of failing and the absence is recorded in the working memory. How a method copes with the absence is the method's business — guarding the reference in a prompt, in a condition expression, or letting it lift through a chain."

[feature.smart_inputs]
description = "Bare caller values — a string, a number, a dict, a list — interpreted top-down against the entry pipe's declared signature, so a caller need not wrap each one in its concept envelope."

[feature.structured_output]
description = "A concept declaring a `structure` table of typed fields, and a pipe producing that shape rather than free text, so the runtime validates the output against the declared fields."
