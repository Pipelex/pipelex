# The MTHDS standard's files that Pipelex's error registry is checked against, copied verbatim from the
# standard's repository and never edited here.
#
# - `mthds-error-registry.schema.json` is the JSON Schema of the registry format, which an extension
#   owner's registry follows as the core registry does.
# - `mthds-error-registry.json` is the snapshot of the core registry. The checks read it to confirm that
#   the `pipelex` prefix is registered with the base URL Pipelex's pages are served under, and that every
#   core code an entry's documentation names exists. Nothing at run time reads this copy: it is an
#   input of the checks alone.
#
# To refresh them, copy both files from the standard release they belong to, at the tag `v<version>` or
# from its release assets, then update the commit, the version and each file's digest below. A test
# fails when a file no longer has the digest recorded here.

[source]
repository = "https://github.com/mthds-ai/mthds"
# The standard's release the files were copied from.
ref = "v8.0.1"
commit = "fdfedc5356ea88a9647a262711dd477c4b1c7a71"
standard_version = "8.0.1"

