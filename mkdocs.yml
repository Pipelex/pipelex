  - meta
  - sane_lists
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: .
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  
extra_css:
  - stylesheets/mermaid.css
  - stylesheets/general.css

# Pages intentionally excluded from the user-facing nav.
#
# - `CLAUDE.md` is a docs-authoring guide for contributors, not a published page.
# - `errors/pipelex/` holds one generated page per code of the Pipelex error registry, reached
#   through the code's type URI and from the index `errors/index.md`, which the nav lists.
#   `pipelex-dev generate-error-registry` writes them all; see docs/contribute/error-registry.md.
# - `agents/*.md` are AI-agent-facing playbooks (debugging workflows, environment
#   gotchas) referenced from the root `CLAUDE.md`. They are built and searchable but
#   intentionally kept out of the user-facing nav so they don't clutter the reading
#   flow for human readers of the docs site.
not_in_nav: |
  CLAUDE.md
  errors/pipelex/
  agents/*.md

