reviewed_at = "2026-07-27T02:26:00Z"
rationale = "Single trigger change: pipelex/cli/commands/plugins_cmd.py now imports the composed built-in plugin list from pipelex.interpreter_plugins.builtins and passes it (plus core_unconditional_plugin_names) to build_registrar, which stopped importing them so the runtime-layer plugins package stays importable without the interpreter. Import-and-call-shape only — no argument, flag, output column, or command behavior moved. Verified against the live CLI rather than by reading: 'pipelex plugins --help' still shows only the 'list' subcommand with no options, and 'pipelex plugins list' still prints the same Name/Origin/Status/API/Contributions table, with all 19 built-ins in the same order as before the split (direct, pipe_func, storage, secrets, openai, gateway, portkey, anthropic, mistral, bedrock, google, fal, huggingface, blackboxai, openrouter, azure_rest, docling, pypdfium2, linkup) and the same core-unconditional set. Opened both review targets: docs/tools/cli/ has zero references to the plugins command or to any Python import path, and pipelex/cli/agent_cli/CLAUDE.md's only 'plugins' hits are mthds-plugins skill paths. Nothing stale. Noted but out of scope: 'pipelex plugins list' is undocumented in docs/tools/cli/ — a pre-existing gap, not created by this change."

