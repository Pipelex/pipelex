rationale = "real-catch: the retry command of a labelled login quotes the label for the machine's shell (double quotes on Windows, none offered when no quoting carries it), and control characters the hosted API sends are printed as U+FFFD; docs/tools/cli/login.md says both. pipelex/cli/agent_cli/CLAUDE.md does not describe the login."

