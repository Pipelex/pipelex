rationale = "Trigger is plugins_cmd.py gaining a Group column and passing the new entry_point_groups argument to build_registrar. Reviewed both targets: docs/tools/cli/ documents init/run/validate/show/fix/update/pkg/build and the agent CLI — it has no page for 'pipelex plugins list' at all, and grep for 'plugin' across docs/tools/cli/ returns zero hits; pipelex/cli/agent_cli/CLAUDE.md's only 'plugin' hits are mthds-plugins skill paths, unrelated to plugin discovery. No option, default, exit code or output contract of any documented command changed. Neither target is stale, so no doc change needed. The docs that ARE now wrong are the SPI pages under docs/under-the-hood/ (they still say to publish under the retired pipelex.plugins entry-point group); those are not this contract's targets and are scheduled with the rest of the Part-A doc sweep."

