rationale = "All 10 triggers changed by exactly one import line each — the Phase 4 renderer regroup, core.pipes.inputs.input_renderer / core.pipes.output.output_renderer -> core.pipes.rendering.* — verified by diffing each file against its acked blob. The renderers moved verbatim apart from input_renderer resolving concept_provider=get_concept_library() internally, so InputsTemplateFormat's values and every render entry point are unchanged. Checked the behavior-adjacent half of Phase 4 too: no CLI doc cites a Python import path or calls a factory that gained a required concept_provider, and the runner codegen emits none. Verified the documented surface against the live CLI (pipelex build inputs pipe, pipelex build output pipe, pipelex-agent inputs pipe): arguments, flags, format values and defaults all match docs/tools/cli/. agent_cli/CLAUDE.md's layout map lists only agent_cli's own modules, none of which moved. Nothing to update."

