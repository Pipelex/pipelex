rationale = "real-catch: init now pre-selects the recommended backend while backends.toml still enables exactly the template's set (it compared against every option, which the disabled manifold made unreachable), so init.md's backend-selection step now says what the prompt pre-selects; the priming change only drops a re-validation that could no longer fail, and the offline cache-priming note in init.md and pipelex/cli/agent_cli/CLAUDE.md stay accurate."

