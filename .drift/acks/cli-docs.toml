digest = "sha256:b458a7ca61833ab0388111b5cb37c08589c865d438fde40adb931087049f74ed"
reviewed_by = "Louis Choquel"
reviewed_at = "2026-08-25T07:40:01Z"
rationale = "Both validate cores switched from the optionality-only warning assembly to the shared advisory composition point, which is a real change to what those commands emit: the intent-hint lints now ride the agent-CLI warnings array and the bare CLI yellow echo for the first time, and a new family (input_presence_vacuous) joins them. Reviewed and updated every target - the agent-CLI advisory note in docs/tools/cli/agent-cli.md now lists all three families in their fixed order and drops the sentence saying the hint lints were not wired into this CLI, docs/tools/cli/validate.md gained an Advisory Warnings section for the bare CLI yellow echo it never described, and the agent-CLI contract doc now names the composition point as the place a new family is added. No command, option, argument, exit code or error type moved."

