rationale = "Initial review: verified every documented command/option/default in docs/tools/cli/ and pipelex/cli/agent_cli/CLAUDE.md against the pipelex and pipelex-agent Typer apps. Fixed staleness: removed the phantom --log-level global option, rescoped pending_signatures/is_runnable (bundle/method/pipe --all carry them and gate without --allow-signatures; bare validate pipe omits them), removed the dead telemetry_mode --config field from init.md (telemetry is template-seeded), collapsed the nonexistent commands/_agent_cli.py layout entry, repointed the companion-skills path to mthds-plugins/mthds/skills/. Human-CLI pages (run, validate, show, update, build/*) verified accurate as-is."

