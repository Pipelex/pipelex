rationale = "Merge of origin/dev into feature/Two-gateways-2, re-reviewed on the merged tree. The triggers dev brought are doctor_cmd.py and run/_run_core.py. Doctor: check_backend_files now loads leniently and both it and check_models attribute a failure through _is_error_about_backend, which reads the backend_name the loader stamps on the error rather than matching a name in the message prose. Re-read docs/tools/cli/ and pipelex/cli/agent_cli/CLAUDE.md: the doctor is documented at the row level, with detail only on the telemetry and pending_migrations findings, and neither page states how the backend-files row loads or which backend a failure is charged to, so nothing there is stale. Run: the --save-csv empty-result branch now recovers the row model by reloading the bundle into a throwaway library, and the guard widened from CsvError to PipelexError. Re-derived the three --save-csv claims in docs/tools/cli/run.md from the code rather than from the diff: the flag still writes to the literal path, it still requires a flat list, and the recorded-absence sentence still holds, since the AbsenceRecord and non-list arms are both untouched and still exit 1 with their own message. The reload sits inside the same try whose handler frames every failure as a save-csv failure with exit 1, so no exit code or message shape moved either. This branch's own half of the merge was reviewed under the previous ack and its resolution here changed no CLI surface: backend_library.py gained the backend_name stamp on the one raise both branches touched, and the load docstring merged dev's lenient clause onto the managed_gateway_configs parameter."

