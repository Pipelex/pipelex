rationale = "clean-pass: Re-read docs/configuration against the four changed models. ScanConfig.excluded_dirs is now a lax frozenset[str] with no before-validator, so a string or a number is refused: library-config.md listed the shipped defaults (re-derived from pipelex/pipelex.toml [interpreter.scan], they match) without naming the key, so one sentence now names it and the refusal. LogConfig.package_log_levels is dict[str, LaxEnum[LogLevel]]: logging-config.md's claims about the section (OFF pins, deep-merge over INFO) are about its entries and still hold. DryRunConfig.validate_image_urls keeps its name and its non-empty rule as an after-validator raising ValueError: dry-run-config.md's 'must be non-empty' holds. ConfigModel lost its transform helpers and gained LaxEnum, documented in the kit standards rule. Ledgers: check-migration-schemas passes on all three surfaces, the fingerprints unchanged; the validator narrowings (a string excluded_dirs once read as its letters, a nan or infinite price, a constraints table read as its keys) refuse only values that never meant what they said, and an unsafe entry would report every file setting costs or excluded_dirs, so none is owed."

