rationale = "The only trigger change is the extra_patterns validator, which now also refuses a regular expression matching the empty string: x* where x+ was meant matches at every position and replaces the whole of every log line the process writes, for the life of the process, so it is named where the pattern is still in front of whoever typed it. It narrows the accepted domain and no fingerprint can see it, which is what this contract asks about, and it takes no migration ledger entry: the shipped default is an empty list, a file already holding such a pattern was already having every line destroyed by it, and no migration can guess what pattern was meant. No field was added, renamed or removed and no other validator moved; check-migration-schemas reports the surfaces accounted for. The review targets were read: docs/configuration/config-practical/logging-config.md now says the refusal beside the one for a pattern re refuses, and names what each shipped family actually reads, since the families were rewritten in the same change; configs.py and config_cogt.py are untouched by it."

