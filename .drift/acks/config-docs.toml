rationale = "The trigger is telemetry_config.py, and the change behind it is the one that matters to a user: a telemetry.toml that will not load now says whether it is out of date or wrong, and the out-of-date answer is pipelex migrate rather than pipelex init telemetry. That distinction was missing from docs/configuration/config-practical/telemetry-config.md entirely, and the page's only advice for a file in trouble was a Resetting Configuration section that deletes it. Added a When telemetry.toml will not load section naming the two situations and what each costs, and reframed the reset section as what it is - a way to start over that discards every setting. Swept the rest of docs/configuration/: index.md and inference-backend-config.md mention telemetry only as a file that exists and as the Gateway's separate telemetry, neither of which moved. The module split itself - models staying in telemetry_config.py, the loader moving to telemetry_loader.py - is invisible to these pages, which name files and keys and never modules."

