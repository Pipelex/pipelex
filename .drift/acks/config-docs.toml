rationale = "Trigger is a docstring-only correction in config_loader.load_config: the config_dir Args entry still said 'project/global layering is bypassed and only this directory is read', which contradicts the same docstring's own summary six lines above and the body at line 313, where list_of_configs is seeded unconditionally with the package pipelex.toml. It is the exact wording this branch already corrected one file over in RuntimeHub.setup_config, and the sibling was missed. No config field, default, validator, TOML key, section name or loading behaviour changed — only prose. Reviewed docs/configuration/ against it: grepped every page for config_dir, 'only this directory', layering and --global. config_dir is not a user-facing concept and appears nowhere; the one layering hit (config-practical/telemetry-config.md:39) is about global-vs-project TOML precedence and is unaffected and correct. configuration/index.md:64-71 documents the default loading sequence and its step 1 ('Base configuration from the installed Pipelex package') is precisely the package-defaults-always-apply fact the corrected docstring now states, so the page already agreed with the truth the docstring was contradicting. Nothing to update."

