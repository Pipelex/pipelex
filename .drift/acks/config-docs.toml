rationale = "M2 mechanism/adapter split. Trigger diff on config_cogt.py is import-path-only: exactly four lines, pipelex.plugins.<vendor>.<vendor>_config -> pipelex.providers.<vendor>.<vendor>_config, from moving the seventeen built-in vendor adapters out of pipelex/plugins/ into pipelex/providers/. Verified by reading the staged diff in full — no config field, default, validator, TOML key, or section name changed, and the four config classes themselves were moved intact, not edited. The structural sync between configs.py and the pipelex.toml files is therefore untouched, which make tb confirms. Reviewed docs/configuration/ against the change: grepped the whole tree for pipelex.plugins, pipelex.providers, pipelex/plugins, pipelex/providers and each of the four config class names — zero hits. Those pages document TOML sections and keys ([pipelex.cogt], [pipelex.aws_config], etc.) and cite no Python import path anywhere, so an import-path move is invisible to them by construction. Nothing to update."

