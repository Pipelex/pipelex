rationale = "Phase E of S7b, docs and changelog for the fourth surface. The trigger is config_surface.py's module docstring, which had become self-contradictory: it listed backend definitions among the readers that should keep rejecting the reserved [meta] table, while the same paragraph now names them as a configuration surface. Corrected, and the asymmetry behind it recorded honestly - the backend loader still reads through the generic TOML reader rather than through config_surface, so a backend file carrying [meta] would be refused as an unknown model table even though the migration engine reads the key there. Nothing writes that key on any surface, so it is latent rather than live. Reviewed all four targets. docs/configuration/**: inference-backend-config.md gained the section the Phase B ack promised - what the boot says when a backend file is behind, which files pipelex migrate reaches and which it does not, that a key you added yourself is reported rather than dropped, and the backup beside each rewritten file; index.md line 62 already carried the one-clause pointer added in Phase B and its link now resolves to a real section; telemetry-config.md is about a different surface and is unaffected. pipelex/migration/ledgers/: no ledger was edited this session, all four are legal and convergent, and no configuration model moved. configs.py and config_cogt.py are untouched - no key removed, renamed or narrowed, so no validator-level narrowing is owed an unsafe entry."

