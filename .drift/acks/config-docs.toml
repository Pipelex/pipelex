rationale = "Trigger was a one-line comment inside PipeFuncConfig that still called the storage seam storage_config.method; corrected to runtime.storage.method as part of sweeping the stale-config-path class this PR keeps producing. Reviewed docs/configuration/ end to end for the same class and found nothing stale: grepping the whole directory for any bare-root X_config.key form and for the retired top-level tables returns no hits, so the end-to-end rewrite recorded in the previous ack still holds. The trigger key itself, interpreter.pipe_func.execution_mode, stays undocumented here on purpose, for the reason the model's own comment gives: it is a hosted-deploy concern rather than a client preference, and is deliberately absent from the .pipelex/ override file. The pipe_func hits in these pages are all the pipe_func decorator, which is unrelated. No doc change needed."

