rationale = "real-catch: RichLogConfig gained package_prefix (PackagePrefix libraries|all|none, strict=False) with its default libraries and a prose comment in pipelex/pipelex.toml. Grepping docs/configuration for rich_log found logging-config.md the only page naming the console settings, both in its Display Options excerpt and its full example; both now carry package_prefix, with the three values and the root-logger exception documented under Display Options, and the section intro's claim that the fields and layouts have no setting still holds. configs.py and config_cogt.py are untouched since RichLogConfig lives in log_config.py. The key is additive, so the defaults layer supplies it and no ledger entry is owed: make umig regenerated the pipelex-config@8 golden and check-migration-schemas passes on all three surfaces."

