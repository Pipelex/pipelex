rationale = "Trigger fired on a lint-comment migration only. config_loader.py and config_surface.py changed by three lines between them, every one a '# noqa: CODE' suppression rewritten into the new '# ruff: ignore[rule-name]' spelling that ruff 0.16 prefers; filtering their diff for any changed line that is not such a comment returns nothing. No config key was added, removed, renamed or narrowed, and none of the four validator sites this contract names (KitConfig._validate_targets, DryRunConfig.validate_image_urls, ImgGenConfig.validate_quality_mapping, LLMConfig.validate_effort_to_budget_mapping) was touched, so no value domain moved. docs/configuration/**, configs.py and config_cogt.py need no edit, and no migration-ledger entry is owed: a comment carries no schema, so there is nothing a ledger could remap."

