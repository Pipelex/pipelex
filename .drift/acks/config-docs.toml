rationale = "LogConfig gains a redaction sub-model and pipelex.toml a [runtime.log.redaction] table with is_enabled and extra_patterns, both shipping their defaults, and the same table is added to the kit template and the project override file. docs/configuration/config-practical/logging-config.md gains a Redaction section naming the pattern families, the two keys and the limits, and the example configuration carries the table. The change is additive and the defaults layer supplies it, so the migration ledger takes no entry; the goldens were re-snapshotted with make umig and check-migration-schemas reports the surfaces accounted for. The narrowing validator on extra_patterns only refuses a regular expression the re module refuses, so it narrows no domain a fingerprint would have to see, and no existing validator moved."

