rationale = "config_check.py only defers its Rich Panel import into the warning branch that prints it, because Rich is now the cli extra. No config model, default or validator changed, so configs.py, config_cogt.py and the migration ledgers need nothing. docs/configuration/config-practical/logging-config.md now says the console sink and the rich pretty-print mode need the cli extra, that a boot without Rich refuses them naming the extra, and that a server without the extra sets poor or silent beside the json sink."

