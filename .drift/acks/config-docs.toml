rationale = "Phase B of S7b: inference/backends/*.toml is now a real migration surface. Reviewed the four targets. docs/configuration/**: the migrate tip in index.md line 62 was accurate only while every migratable file sat directly in a configuration directory, so it gained one clause saying backend definitions under inference/backends/ are migratable too and pointing at the inference backend page; the fuller section on that page (what the boot says, what a migration will and will not touch, backups beside the file) is Phase E of this plan and lands in the same PR. pipelex/migration/ledgers/: a fourth ledger, inference-backend.toml, was added at schema version 1 with zero entries - the schema-1 cut is post-1104, which is what makes the prompting_target deletion a pre-history entry rather than an ordinary one, and that entry lands in Phase C. The three existing ledgers needed no edit. configs.py and config_cogt.py are untouched: no configuration model moved, no key was removed, renamed or narrowed. The config model change that did happen is in cogt, not in configs.py - InferenceModelSpecFileNode, an all-optional projection of InferenceModelSpecBlueprint used only by the migration fingerprint, and the blueprint itself is unchanged. config_surface.py changed for two reasons: it gained the fourth surface id constant, and its module docstring now names four surfaces and four loaders rather than three."

