rationale = "real-catch: PipelexConfig gained a usage_stats section (UsageStatsConfig, enabled: bool) and pipelex/pipelex.toml ships [usage_stats] enabled = true with a prose comment. docs/configuration/index.md listed the top-level sections without it; it now names [usage_stats], says only false has an effect, read from the project's own .pipelex/pipelex.toml and the packaged file, never ~/.pipelex/, and links the new docs/setup/usage-statistics.md, which documents the switch and its fail-closed reading. telemetry-config.md no longer claims nothing reports to Pipelex without naming the statistics. The key is additive, so the defaults layer supplies it and no ledger entry is owed; the pipelex-config golden was regenerated and make tb passes."

