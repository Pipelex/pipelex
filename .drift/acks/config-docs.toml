rationale = "Re-ack after the review round on the first push. One trigger file moved, config_surface.py, and it carries a real fix rather than a wording change: _is_within resolved the whole path before taking its parent, so a pipelex.toml symlinked out to a dotfiles repository resolved to a parent outside the walk and was told pipelex migrate could not reach it, when the walk enumerates the link by iterdir and writes straight through. It now resolves the parent and not the file, which keeps the reason the resolve was there - a config_dir reaching the same directory by another spelling - and drops the question it was accidentally answering. Pinned by a new symlink test in test_boot_tolerance.py, mutation-tested by reverting the expression. Asked the contract's own question again and the answer is unchanged: no config model moved, configs.py and config_cogt.py are untouched, no ledger moved, so no unsafe entry carrying declared_narrowed_paths is owed, and make cl stays green. On the docs half, this is a correction to which files the warning names, not to what a migration may do, so the note added to docs/configuration/index.md at the previous ack is still accurate as written - it says the walk is the global and project directories and that a file loaded from elsewhere is yours to update, which is exactly what the fixed predicate now decides correctly."

