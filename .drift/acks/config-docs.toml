rationale = "real-catch: merge of origin/dev into this branch combines two reviewed acks. This branch adds runtime.error_tracking.trackers with its shipped default [posthog] in pipelex.toml and the ErrorTrackingConfig field on RuntimeConfig, whose validator refuses a token named twice; a new error-tracking-config.md page, the configuration overview and telemetry-config.md describe it, and the pipelex-config goldens defaults@9.toml and fingerprint@9.json were re-recorded additively. dev adds the top-level join_host_trace key to TelemetryConfig, default false, with PIPELEX_JOIN_HOST_TRACE and Pipelex.make(join_host_trace=...) overriding it and a boot refusal without a span destination; telemetry-config.md, setup/telemetry.md, logging.md, logging-config.md and log-sink-plugins.md describe it and the telemetry-config goldens defaults@3.toml and fingerprint@3.json were re-recorded additively. The merged docs keep both sides' sections"

