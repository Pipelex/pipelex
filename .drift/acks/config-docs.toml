rationale = "Review of the PR 1114 fixes to config_loader.py and config_surface.py: the main-configuration stale warning is now parked on the loader and emitted after logging is configured, and the in-memory retry declines a file declaring a schema version below the ledger floor. Both are boot-tolerance mechanics documented in docs/migration-ledger.md, which was updated in the same change; docs/configuration/ describes files and keys, and telemetry-config.md's out-of-date section still says exactly what a user sees - a boot that warns and names pipelex migrate. No configuration key, default or file moved, so no page under docs/configuration/ is stale."

