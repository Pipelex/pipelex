rationale = "Retiring the renaming-maps consumer is what the previous ack parked for this milestone, and index.md line 57 was the line it named: '[migration] - Migration helpers for renamed settings' described a mechanism that now has no reader at all. Rewrote it to say the section is retired and to point users at pipelex migrate, which is the remedy that replaced it, and to say why the table itself is still there - removing a table the model requires is a schema change of its own. Swept the rest of docs/configuration/ for the same mechanism and found nothing else: it was one line. The other trigger, config_loader.py, gained pydantic_error_behind, an internal helper that reaches through a translated refusal for the pydantic error underneath it - no key, no file, no layer and no precedence rule changed, so the override and merge-order pages are untouched and correct as written."

