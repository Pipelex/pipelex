rationale = "New pipe_func_config.execution_mode is a hosted-deploy concern, not a client preference — deliberately absent from the .pipelex/ override file, and its internal siblings (storage_config, secrets_config, scan_config, builder_config) likewise have no page under docs/configuration/, which documents user-facing preferences. The shipped default 'direct' is byte-identical to prior behavior, so library-config.md's @pipe_func registration description stays accurate for every documented configuration. The rest of the trigger diff is purely additive and changes no existing field or default. Reviewed, no doc change needed here — though the sandbox execution modes are undocumented workspace-wide, which belongs with the feature, not this contract."

