rationale = "config_loader.py gains the two inference override constants, backends_file_paths / routing_profiles_file_paths and the sequence builder; config_check.py only gains a comment. No config model field moved, none of the four validator sites was touched, so no ledger entry is owed. Documented the override files and their merge order in inference-backend-config.md (Personal overrides, the directory tree, the loading process), configuration/index.md and contribute/configuration-defaults-and-overrides.md; the other configuration pages describe pipelex.toml and telemetry and are unaffected."

