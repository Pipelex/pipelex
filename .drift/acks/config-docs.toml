rationale = "real-catch: pipelex/pipelex.toml gained two shipped defaults under [runtime.log.package_log_levels], httpx2 = WARNING and httpcore2 = INFO. Re-read docs/configuration: logging-config.md's Package-Specific Log Levels section now says the HTTP clients under the inference SDKs default to httpx WARNING and httpcore INFO with the same levels for their forks; its quantified claims (OFF silences only the loggers the section does not pin, silence for everything takes every entry of that section at OFF) are about the section as a set and still hold; the override example and the best-practice list name no default. No other configuration page names a package level. No model moved: configs.py and config_cogt.py are untouched, package_log_levels is an open dict[str, LogLevel] node, check-migration-schemas reported the fingerprint moved additively with no entry needed, and the head goldens defaults@7 and fingerprint@7 were regenerated with make umig; the ledgers need no entry."

