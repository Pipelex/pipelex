rationale = "Phase A of S7b: a migration surface now owns a directory, and a file is claimed by the pair (directory, name) rather than by its name alone. The trigger file config_surface.py changed for one reason: _is_within used to ask whether a file sits directly in a walked configuration directory, and it now asks whether it sits in the directory its own surface owns under one of them, reading that directory from the ledger rather than from the surface registry, because this module sits in the kernel layer's import closure and the registry imports every configuration model. Reviewed the four targets against that. docs/configuration/index.md line 62 is the user-facing sentence and it is still accurate as written: it says the command walks the global and the project directory and that a file loaded from elsewhere is yours to update, and what changed is which directories within those two a surface owns, not which configuration directories are walked. No surface owns a subdirectory yet, so the sentence is exactly as true today as at the last ack; the inference-backend note it will need lands with the fourth surface, in the same PR. pipelex/migration/ledgers/ needs no entry: no configuration model moved, no key was removed, renamed or narrowed, and the only schema change is to the ledger's own surface block, which is package data rather than a user file - it gained an optional subdirectory field defaulting to empty and base_file became optional, so the three shipped ledgers parse unchanged and make cl and make cmig are both green with zero ledger edits. configs.py and config_cogt.py are untouched and nothing in them is described differently by this change. The registry-versus-ledger cross-check gained the directory alongside id, base_file and tier_glob, so the two spellings cannot drift apart silently, and that is what makes reading the walk from the ledger a second reading of one derivation rather than a second derivation."

