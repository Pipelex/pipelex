rationale = "Boot tolerance changed how a configuration surface behaves when it FAILS to validate, and changed nothing the configuration pages describe: no key, no file, no layer, no precedence rule. Reviewed docs/configuration/ end to end against that. The override pages document the merge order, which boot tolerance reproduces exactly rather than alters -- the retry is handed the same ordered path list the loader merged, which is why config_file_paths was extracted instead of a second list being assembled. Nothing there documents what happens to an out-of-date file, and the right home for the user-visible half is the remedy's own page, so it went to docs/tools/cli/migrate.md and its specification stays in docs/migration-ledger.md. One line I deliberately left alone: index.md's '[migration] - Migration helpers for renamed settings' still describes the OLD renaming config, which is a different mechanism from the ledger; retiring its consumer is the next item on the phase and that line is its to fix, not this one's."

