rationale = "real-catch: the triggers add is_show_path to RichLogConfig and pipelex.toml (default false, a prose comment above the table), reword the stale-configuration warning to one message with its remedy in user_action, and reword two DEBUG lines of aws_config. logging-config.md, the only configuration page listing the rich_log keys, documents is_show_path in Display Options and in the full example. The stale-warning example in inference-backend-config.md was rendered through ConsoleLogSink to check it: the message, the quoted migration_steps JSON and the advice line under it match, but the path was written with a leading ellipsis the console never prints for a path that short, since it cuts only past 80 characters, so the example now gives the full path the console prints. The other mentions of the stale warning (telemetry-config.md, the DEV and is_markup_enabled paragraphs of logging-config.md) quote no message and still hold. configs.py, config_cogt.py and the ledgers need nothing: check-migration-schemas passes with the additive key, and no validator moved."

