rationale = "The contract definition itself changed: its review list now carries pipelex/migration/ledgers/ and the two modules holding the four validators that narrow a configuration value domain (KitConfig._validate_targets, DryRunConfig.validate_image_urls, ImgGenConfig.validate_quality_mapping, LLMConfig.validate_effort_to_budget_mapping), which R8 established the fingerprint projection cannot see. No trigger file moved, so this is the first read of the new targets rather than a review of a change: the three ledgers are legal and convergent and the three surfaces are accounted for (make cl, make cmig both green), and none of the four validators narrowed anything in this change, so no unsafe entry with declared_narrowed_paths is owed. docs/configuration/ is unaffected - no key, default or file moved."

