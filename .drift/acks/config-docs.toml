rationale = "LogConfig gains a gcp section (GcpLogSinkConfig: log_name, project_id, credentials_file_path) and pipelex.toml ships [runtime.log.gcp] with log_name = pipelex, for the new gcp log sink. docs/configuration/config-practical/logging-config.md gains a section per that sink -- which of json and gcp to pick on Google Cloud, the three settings, and what each entry carries -- and the sink key list and the example now name gcp; no other page under docs/configuration touches the log config, since the telemetry page's otlp array is a different surface. No migration ledger entry: the section is purely additive with a default in the base layer, which every existing file inherits, and the ledger records retired or renamed keys only; the fingerprint and defaults goldens were regenerated with up-migration-schemas. configs.py needs nothing, since gcp nests inside the LogConfig it already carries, and config_cogt.py is unrelated. No validator moved."

