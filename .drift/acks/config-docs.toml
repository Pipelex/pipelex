rationale = "uri_format now renders the FILENAME only: the prefix (storage_scope plus the new generated/ leaf) moved into GeneratedContentFactory, so {storage_scope} is retired from URI_FORMAT_SUPPORTED_FIELDS and the shipped default in pipelex/pipelex.toml, .pipelex/pipelex.toml and kit/configs/pipelex.toml becomes {hash}.{extension}; a leading / is refused too, since the value is appended after one. Reviewed all four targets. docs/configuration/**: still no page documents uri_format or the storage section (index.md line 54 names [runtime] storage only as a category), so nothing there went stale; the two docs outside this contract's targets that DO name it were updated anyway - storage-provider-plugins.md now says the format renders the filename and lists {hash}/{extension}, and pipelex-kernel.md now names four leaves instead of three, since generated/ joined assets/, results/ and payloads/. pipelex/migration/ledgers/: no entry, and that remains the considered answer - cmig reported the fingerprint move as additive ('nothing breaks and no entry is needed') and per docs/migration-ledger.md a free string's value domain can never be proven stale from the schema, so a remap_value on uri_format could only ever be unsafe (reported, never applied); the failure is loud at boot instead, where _collect_uri_format_error_msgs rejects a retired placeholder by name and lists the supported set. Goldens regenerated with umig; cmig and cl both pass. configs.py and config_cogt.py untouched - no key removed, renamed or narrowed, so no model-level narrowing is owed an entry."

