rationale = "uri_format's placeholder set changed: {primary_id} and {secondary_id} are both retired and replaced by one {storage_scope}, so the shipped default in pipelex/pipelex.toml, .pipelex/pipelex.toml and kit/configs/pipelex.toml becomes {storage_scope}/{hash}.{extension}. Reviewed all four targets. docs/configuration/**: no page documents uri_format or the storage section - index.md line 54 names [runtime] storage only as a category - so nothing there went stale; the one doc that does name the field, docs/under-the-hood/storage-provider-plugins.md, is outside this contract's targets and was updated anyway to list the new placeholders. pipelex/migration/ledgers/: no entry, and that is the considered answer rather than an omission - the coverage gate reports the change as additive ('the fingerprint moved additively - nothing breaks and no entry is needed') because URI_FORMAT_SUPPORTED_FIELDS is a ClassVar the fingerprint cannot see, and per docs/migration-ledger.md a free string's value domain can never be proven stale from the schema, so a remap_value on uri_format could only ever be unsafe (reported, never applied). The failure is instead loud at boot: _collect_uri_format_error_msgs rejects a retired placeholder by name and lists the supported set. Goldens regenerated with umig; cmig and cl both pass. configs.py and config_cogt.py are untouched - no key removed, renamed or narrowed, so no model-level narrowing is owed an entry."

