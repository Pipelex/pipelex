reviewed_at = "2026-08-15T16:01:41Z"
rationale = "This is the contract's central case: the config model and the shipped defaults were both reshaped, so every user-facing configuration page named a section that no longer exists. Rewrote docs/configuration/ end to end against the new tree. index.md's 'Configuration Structure' listed four sections as [pipelex] core settings, [cogt] cognitive tools, [plugins] and [migration]; it now lists [runtime], [inference], [interpreter] and [kit] with what each owns, and says what the address tells a reader about which layer owns a setting. Every page's section header and TOML sample moved with its keys, including the deeper suffix drops that a naive sweep would miss: [runtime.log.rich_log], [inference.llm.instructor] and the four vendor tables, [inference.img_gen.img_gen_job], [interpreter.pipeline_execution.graph] with .mermaid and .reactflow under it. Per ruling R7, config-technical/cogt-config.md is renamed to inference-config.md with its title, description and prose rewritten off the codename, both mkdocs nav entries repointed, a redirect added from the old page, and the two inbound links in error-model.md and retries-and-resilience.md updated. Grepped the whole directory afterwards for any surviving old address: the only remaining hits are file names and Python import paths, which the reshape deliberately does not touch since no module moved. The reserved [meta] schema_version key stays undocumented here for the reason the previous ack gave, unchanged by this work."

