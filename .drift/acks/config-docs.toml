rationale = "real-catch: InterpreterConfig gains method_tree_limits ([interpreter.method_tree_limits], max_files and max_total_bytes required with their defaults in pipelex/pipelex.toml and the kit and project copies, max_file_bytes optional). docs/configuration/index.md now names the tree limits among the interpreter sections and library-config.md documents which files a library directory loads, the limits, and that [interpreter.scan] excluded_dirs now only scopes the Python scan; the section is documented in full in docs/building-methods/method-trees.md. The change is additive with its bounds in annotations, so the regenerated head goldens account for it and no ledger entry is needed."

