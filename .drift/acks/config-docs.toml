rationale = "clean-pass: after merging origin/dev, the triggers changed since dev's ack are this branch's four files. ScanConfig.excluded_dirs is a lax frozenset[str] with no before-validator, so a string or a number is refused, and library-config.md names the key and the refusal; LogConfig.package_log_levels is dict[str, LaxEnum[LogLevel]], whose entries logging-config.md describes unchanged; DryRunConfig.validate_image_urls keeps its name and its non-empty rule as an after-validator raising ValueError, as dry-run-config.md says and as this contract's list of live sites names it, and dev's removal of gateway_test from config_cogt.py merged beside it untouched; ConfigModel lost its transform helpers and gained LaxEnum, documented in the kit standards rule. check-migration-schemas passes on all three surfaces after the merge, pipelex-config@8 included, so the annotation changes moved no fingerprint; the narrowings refuse only values that never meant what they said, so no ledger entry is owed."

