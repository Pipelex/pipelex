rationale = "Merging dev into the configuration-reshape branch, so the trigger diff is the reshape's own rename of the config root plus PR 1114's boot-tolerance work. Reviewed docs/configuration/ end to end against both halves, re-deriving the claims from the shipped defaults rather than from prose. Enumerated the top-level tables in pipelex/pipelex.toml and confirmed index.md's four-main-sections claim names exactly those four, runtime and inference and interpreter and kit, with no fifth table left over now that the retired migration one is gone. Extracted every TOML section header quoted anywhere under docs/configuration/ and checked each against pipelex.toml; the ones absent from it belong to other files, telemetry.toml and the backend files and the model deck and the routing profiles and the .mthds examples, not to the main configuration. Grepped the whole directory for every retired spelling the reshape produced, the old suffixed field names and the four retired root tables and migration_maps, and it returns nothing. Spot-checked the two renames the trigger files actually carry into a documented page: rich_log_config became rich_log and logging-config.md already addresses it as runtime.log.rich_log, while pipe_func execution_mode stays undocumented on purpose as a hosted-deploy concern, the reason its own model comment gives. The 1114 half moved no key, default or file, and its telemetry-config.md edit came through the merge untouched. No page is stale. The verify command earned its place here: make tb caught three boot-tolerance tests whose synthetic ledger still addressed the retired pipelex.log_config table, fixed in the same change."

