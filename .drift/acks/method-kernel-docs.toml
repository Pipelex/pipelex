rationale = "Reviewed the page against both trigger changes. The new module owed the entry-point table a row, and it got a paragraph besides: the two assemble_* functions exist because run_llm_text and run_img_gen both take a ready prompt, and until assemble_img_gen_prompt landed a runtime-only caller held one operator it could not actually reach. The pipelex_kernel change is llm_text widening to accept a concept and an output class, which the page now states with its reason — a text step is not always a native-Text step, and a façade that hardcoded the native one wrote a different concept into memory than the interpreter wrote from the same declaration. The review also checked the page's own standing rule, that every kernel entry point owes the boot-contract subprocess an arm: assemble_img_gen_prompt had none, and the arm was added in the PR that introduces it (#1082) rather than here, so the entry point and its only gate ship together."

