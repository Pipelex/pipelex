rationale = "M3 moved the pipe-kind registration manifest out of core/ into the new pipelex/pipe_machinery/ package, so the guard's RUNTIME_LAYER_PACKAGES note no longer enumerates registry_models as part of core's interpreter half. The declaration tuple itself is unchanged (12 entries, all still named under 'The rule' — re-verified mechanically), and neither hub module changed (33 + 32 public symbols, all still covered by the partition tables — also re-verified). Reviewed the doc for real and updated five places: 'Where core splits' drops registry_models from the Pipe-machinery list and gains a paragraph on where the manifest went and why the directory was the problem (a manifest listing every pipe class made core read as a dependant of the pipe packages it sits below); Known inversions drops it from core's Pipe-touching half; the 'runtime_hub must not name anything from' list at the top of 'Why the boundary exists' gains pipe_machinery, since a new interpreter top-level package is exactly what that list enumerates; the verification snippet's INTERPRETER set gains pipe_machinery, keeping it a matched pair with the closure test's INTERPRETER_PACKAGES (which gained the same token) and the design doc's classification snippet — the three must agree or a check passes vacuously; and the new page links out to docs/contribute/registration-surface.md, which documents every place a pipe kind has to be registered now that the manifest is no longer beside core's value model. The transitive-rule and enforcement paragraphs needed no change: pipe_machinery is an interpreter top-level package, which those paragraphs already cover generically."

