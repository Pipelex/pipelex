rationale = "Trigger is hub_layering_guard.py: RUNTIME_LAYER_PACKAGES gains pipelex.graph, pipelex.tracing, pipelex.observer and pipelex.errors, and the note above the tuple is extended to say why each is there. Reviewed the target for real and edited two places. (1) The layer-rule enumeration under Enforcement listed eight declared packages and now lists twelve — the same doc-enumeration rot M1 and M2 each hit, in a section the trigger diff does not otherwise touch — plus a new paragraph naming what each of the four packages is and why kit and language stay out. (2) Known inversions gained the fixed case this change found: graph/graph_rendering.py reached interpreter_hub through pipeline.dry_run_pipeline with every gate green, because rules 1 and 3 both filter candidates through is_runtime_layer and pipelex.graph was undeclared, so the module was outside the rules' domain entirely. It is the pipelex.plugins worked example one level up — not an overreaching declaration but no declaration at all — and it is recorded next to it with the generalized lesson this track produced: an undeclared package is not neutral, it is unpoliced. The remedy was placement, per the same playbook: the bundle-driven half is now pipelex.pipeline.bundle_graph_rendering, the pure renderer stayed. Ran the two prescribed mechanical checks by script: all twelve declared packages named under The rule, and all 32 runtime_hub / 31 interpreter_hub public accessors covered by the partition tables. Both passed while blind to finding (1), as in every prior entry. Negative control run and recorded in the plan: re-adding the evicted import makes the guard fail with interpreter-hub-transitive; before the declaration it produced no finding at all. Verified the rest rather than assuming: the 'Why the boundary exists' must-not-name list and the verification snippet enumerate the INTERPRETER packages, which this change does not touch, and the cogt-neutrality bullet's claim that both sides are runtime-layer is unaffected."

