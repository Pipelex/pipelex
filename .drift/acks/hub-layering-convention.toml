rationale = "Re-recorded: the prior rationale for this same change carried a false claim, caught by the checkpoint code review, and an ack that argues from a measurement nobody took is exactly what this system exists to prevent. Triggers are the guard's declaration rationale and runtime_hub's module docstring, both carrying the caveat that two interpreter-named packages could not be named in the layer predicate because leaf models of theirs landed in every runtime closure. The leaves moved this phase (SpecialPipelineId to system.job_metadata, PipeRunMode to system.pipe_run_mode, PipeRunParamKey to system.pipe_run_param_key, PipeRunError to core.pipes.exceptions), so the caveat is false in all six places it appeared. Four are on this target and all four were edited: the must-not-name list under Why the boundary exists now names pipeline and pipe_run; the deliberately-absent paragraph is gone; the core.pipes.pipe_output parenthetical under Where core splits is gone; and The property replaces 'what the predicate still cannot name' with the positive statement plus a per-leaf table. A seventh edit was forced by a test rather than by reading — test_the_interpreter_package_set_matches_the_documented_one machine-compares the page's runnable INTERPRETER snippet against INTERPRETER_PACKAGES, so it would have gone red regardless of review. That contrast is the generalizable finding: the one enumeration on this page that cannot rot is the one a test pins, and every prose enumeration here has now rotted at least twice. The correction. The table's last row explained PipeRunError's destination partly by claiming system/exceptions.py is imported by the config bootstrap, which would then load a run mode and graph.graphspec for nothing. Measured after the review flagged it: importing pipelex.config already loads both, via runtime_hub to content_generator_protocol to assignment_models to cogt_run_params to system.pipe_run_mode to graph.graphspec. The alternative's stated cost is zero, so the clause was removed from this page, from the CHANGELOG and from the plan. The placement is unchanged and needs no such argument: PipeRunError is the base of PipeRunInputsError and OptionalValueAbsentError, which live in core.pipes.inputs, and filing the base with them also puts it in the same error-reference section as its own subclasses instead of one section away. Ran the two prescribed mechanical checks: twelve declared packages named under The rule, 32 + 31 hub accessors covered — both passed and both were blind to all six caveat sites and to the false claim, since they check presence and every finding here is about content. Outcome verified: measurement across all nine runtime entry points returns zero pipeline and zero pipe_run modules; the closure test is green with both names added; make gep regenerated the three error pages the class move made stale."

