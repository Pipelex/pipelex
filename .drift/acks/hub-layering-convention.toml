rationale = "Real catch, and not the import-churn shape the previous ack flagged as a watch item. Both triggers changed semantically: the guard's RUNTIME_LAYER_PACKAGES gained 'pipelex.runtime_hub' (the module at the centre of the rule was exempt from its own rule, because no tuple entry was a prefix of it), and runtime_hub.py dropped its write-only class-registry state and corrected its forbidden-package docstring. Re-ran both mechanical checks the last ack prescribed: 33 + 32 public module-level hub symbols, all still present in the doc's partition tables (A3 deleted RuntimeHub *methods*, not module-level accessors, so the tables were unaffected), and all 12 declared runtime-layer entries — including the new module entry — now named under Enforcement. The read-through then caught four stale claims the mechanical checks cannot see, all fixed in this change: 'Every declared package is compliant' read as a claim about the property when it is only true of the direct-import rule, which the guard does not follow transitively; 'the one runtime-layer module the guard's declaration does not cover' was wrong on both halves, since runtime_hub was the other one and is now covered; the class-registry leaf-import rule stated a criterion ('only from inside runtime_hub's import closure') false for two of its three in-tree importers, and as written invited a fix that would silently re-couple core.concepts to the cogt/plugin stack; and Known inversions understated the plugins inversion, omitting both that it loads interpreter_hub plus 67 interpreter modules today and two of the four modules involved. Also corrected the PipeProviderAbstract section, since that abstract was deleted in the same change."

