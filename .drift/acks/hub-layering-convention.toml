rationale = "M1a hoisted core's parser half into the new top-level pipelex/mthds_parsing/ package, so the guard's RUNTIME_LAYER_PACKAGES note no longer enumerates bundles/ and interpreter/ as part of core's interpreter half. The declaration tuple itself is unchanged (12 entries) and neither hub module changed. Reviewed docs/contribute/hub-layering.md for real and updated five places, four of which are the load-bearing enumerations: the 'runtime_hub must not name anything from' list under 'Why the boundary exists' swaps core.bundles/core.interpreter for mthds_parsing; the page's own verification snippet gains mthds_parsing in its INTERPRETER set; 'Where core splits' drops both packages from the Pipe-machinery list and gains a paragraph on where the parser went; Known inversions drops them from core's Pipe-touching half; and the transitive-rule paragraph's 'what the predicate cannot name yet' list drops core.bundles.exceptions, because that straddler is now fixed. Verified the matched TRIPLE by script rather than by eye (the M3 lesson): extracted INTERPRETER_PACKAGES from the closure test's dedented script string, INTERPRETER from this page's snippet, and I from the design doc's classification snippet, and asserted set equality — all three now hold the same nine tokens. Recorded a new decision in the page: PipelexBundleBlueprintValidationErrorData did NOT move with the parser. pipeline/ and libraries/ carry it into every runtime-layer closure (measured: pipelex.core.memory.working_memory_factory reaches it), so filing it under mthds_parsing would have forced a permanent exclusion in the closure predicate; it moved to pipelex.core.exceptions instead, beside the two sibling error-data models it shares PipeValidationErrorType with. That is what let INTERPRETER_CORE_EXCLUDED be deleted outright — the predicate got strictly stricter, and the leaf probe confirms the new mthds_parsing token is live (probing pipelex.mthds_parsing.exceptions exits 1 and names its own package as an offender)."

