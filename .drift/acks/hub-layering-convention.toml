rationale = "Trigger is the kernel extraction adding pipelex.kernel to RUNTIME_LAYER_PACKAGES. Reviewed docs/contribute/hub-layering.md and made two changes. (1) Ran the page's prescribed mechanical check: all fifteen names in RUNTIME_LAYER_PACKAGES appear under 'The rule', including the new pipelex.kernel, whose enumeration entry and its why-declared-ahead-of-a-breach paragraph landed with the guard change. (2) Added a fourth gate to the Enforcement section: tests/unit/pipelex/kernel/test_kernel_boot_contract.py boots runtime-only, CALLS a kernel op, and sweeps sys.modules after the call rather than after the import. That order closes the function-local blind spot the page's own 'Known inversions' section describes — verified rather than asserted, by injecting a function-local pipe_operators import into a kernel op and observing check-hub-layering exit 0 and the import-closure module pass 15 while only the new test went red. The page previously described three gates and would have understated its own coverage."

