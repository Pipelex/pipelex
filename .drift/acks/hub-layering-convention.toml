rationale = "runtime_hub gains set_pretty_print_mode and a private field holding the mode the process had before boot, so reset_boot_state restores that instead of a hardcoded RICH. No new import: pipelex.tools.misc.pretty was already imported at module level by the change the previous ack covered, and tools is the bottom layer. The doc specifies the runtime_hub / interpreter_hub boundary and the guard that enforces it; it enumerates neither what reset_boot_state releases nor which modules runtime_hub may import, so there is nothing stale to update. The guard passes."

