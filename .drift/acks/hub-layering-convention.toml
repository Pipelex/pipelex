rationale = "Merging dev into the configuration-reshape branch, so the trigger diff on runtime_hub.py is two changes at once: the reshape's two new accessors (set_boot_orchestrator / get_boot_orchestrator) with the reset_config to reset_boot_state rename, and PR 1114's rerouting of setup_config through load_config_validated. Re-derived the runtime_hub partition table from the module instead of reading it: enumerated every public module-level function in pipelex/runtime_hub.py and checked each against the table, which is complete, boot-orchestrator row included. reset_boot_state is not an accessor and the page never named reset_config, so the rename reaches no sentence. Re-derived the 'every top-level package accounted for' claim the same way: enumerated every package under pipelex/ carrying an __init__.py and confirmed each is named either in the kernel-layer declaration and its follow-on paragraph, or in the 'Why the boundary exists' list of what runtime_hub may not name at module level. The pipelex.migration paragraph came through the merge intact and still describes the deferred engine import in system/configuration/config_surface.py, which the merge kept deferred. No doc change needed."

