rationale = "Trigger is the kernel-layer rename: the layer formerly called the runtime layer is now the kernel layer, so hub_layering_guard.py renamed RUNTIME_LAYER_PACKAGES to KERNEL_LAYER_PACKAGES and is_runtime_layer to is_kernel_layer, and interpreter_hub.py / runtime_hub.py carry the same vocabulary in prose. docs/contribute/hub-layering.md is the canonical statement of this boundary, so it was swept in the same change rather than left contradicting its own guard. Reviewed it end to end and ran both prescribed mechanical checks: all 15 entries of KERNEL_LAYER_PACKAGES appear on the page (checked by importing the constant and testing membership, not by re-reading the table), and the page no longer contains the strings 'runtime layer' or 'runtime-layer' anywhere. Two substantive edits beyond the mechanical rename: a new paragraph under the two-layer definition recording that runtime_hub and runtime_boot still carry the layer's former name, that this is staged rather than drift (both are pinned in pipelex-transport's ALLOWED_SURFACE and move anyway when the kernel package moves), and that runtime_bridge means the orchestration venue and keeps the word for good; and one sentence under 'Where core splits' that read 'no amount of dependency injection makes those runtime', which the rename would otherwise have left meaningless — now 'makes those kernel-layer'. Also verified by hand that every remaining 'runtime' on the page is the venue sense, a module name, or 'at runtime'."

