rationale = "Re-recorded after the final review round found a live counter-example to this page's central claim. Trigger is the guard's tuple and note again: pipelex.test_extras is added to RUNTIME_LAYER_PACKAGES, and the exclusion sentence is rewritten. Reviewed the target and edited three places. (1) The layer-rule enumeration under Enforcement gains pipelex.test_extras — sixth consecutive opening where an enumeration on this page was the rot, and it is the same enumeration as last time. (2) The exclusion sentence said only that kit is data files and language has interpreter edges, which reads exhaustive and was not: enumerating every top-level package and running measurement command 3 over each shows test_extras measures zero, ships, and is imported by pipelex.py at boot, while runtime_bridge and cli measure dirty and were simply never mentioned. The sentence now accounts for every top-level package rather than naming two. Considered and rejected declaring config, base_exceptions and urls, which are also clean and undeclared: the transitive rule already covers them through their 30, 32 and 5 declared runtime-layer importers, so declaring them buys nothing. test_extras had no such cover. (3) Known inversions gains the finding this round produced, which is a genuinely new shape for this page. Five built-in vendor adapters imported MissingDependencyError from pipelex.exceptions, the public all-errors aggregate, instead of from its definition site pipelex.system.exceptions. That aggregate re-exports every interpreter package's errors, so each of those five declared runtime-layer modules loaded 15 interpreter modules — inside pipelex.providers, a package this very tuple already declared clean. Both gates were structurally blind: the guard only chases interpreter_hub and the aggregate never reaches it, and the closure test's providers.builtins entry point does not cover them because the vendor plugins import the list modules inside a function, hiding them from the static graph and from the aggregator's closure at once. Fixed at the import site per the repo's direct-full-path-imports rule; providers.anthropic.anthropic_list added to RUNTIME_LAYER_ENTRY_POINTS, with a negative control run — reverting one import fails that entry point. The lesson recorded on the page is that a module re-exporting across layers is a layer boundary with the sign filed off. Ran the two prescribed mechanical checks: all thirteen declared packages named under The rule, 32 + 31 hub accessors covered. Both passed and both were blind to all three findings, eleventh consecutive time."

