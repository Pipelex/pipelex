rationale = "Boot tolerance put a kernel-layer module (system/configuration/config_surface.py) one deferred import away from pipelex.migration, whose engine imports pipeline.fixes.applier on purpose. Reviewing the page against that turned up a real staleness the change did not cause: pipelex.migration is a top-level package in NEITHER column of the accounting sentence, so it read as checked while being unpoliced -- the exact failure the same paragraph warns about. Added it, and explained rather than asserted its side, because it is the interesting case: it never reaches interpreter_hub, so declaring it kernel-layer would PASS the guard and be this page's own first known inversion all over again. Measured the rest instead of eyeballing it: a module-level engine import in config_surface keeps check-hub-layering green and turns nine closure-test entry points red, which is this page's lint-vs-property claim reproduced, so that claim needed no edit. The two hub partition tables are untouched by this milestone -- runtime_hub gained no symbol, only a rerouted call inside setup_config."

