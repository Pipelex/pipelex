rationale = "M2: pipelex/plugins/ split into the plugin mechanism (stays) and the seventeen built-in vendor adapters (now pipelex/providers/). Trigger diff on hub_layering_guard.py is the new 'pipelex.providers' entry plus a rewritten note above the tuple. Reviewed the target for real and edited five places. (1) The layer-rule enumeration under Enforcement listed seven declared packages; it now lists eight. This is the doc-enumeration rot M1 flagged, and it was in a section the diff did not otherwise touch. (2) 'Where the built-in plugins split' claimed pipelex/plugins/ is where the runtime-port adapters live — the exact sentence M2 falsifies. Rewritten to name the two splits separately, because they are routinely conflated: mechanism-vs-adapters does NOT cross a layer (both packages are runtime-layer, the split makes the one-way dependency legible), while runtime-vs-interpreter does. Added the sentence third-party plugin authors need: pipelex.plugins.contract and pipelex.plugins.registrar did not move, and the 'pipelex.plugins' entry-point group is a group identifier, not a module path. (3) The import-closure section named plugins.builtins as the entry point and justified it by history; the module is now providers.builtins, so the paragraph was rewritten to keep the history true under the old name and to state why one entry point still covers both packages. (4) Known inversions gained two bullets recording the cogt -> vendor edges as deliberate: the four config imports are accepted permanently (making vendor config sections plugin-contributed would trade the statically-typed configs.py/pipelex.toml sync for a dynamic registry), while the two img-gen factory imports are slated to move inward to a neutral cogt/img_gen/ mapping module — no registry, because dispatch is keyed on the cogt-owned AspectRatioTaxonomy and the gateway worker is one SDK spanning both taxonomies, so no provider key exists to dispatch on. (5) The fixed worked example still pointed at plugins/builtins.py; annotated with its current path. Verified the remaining claims rather than assuming: 'plugins -> runtime_bridge' still names only mechanism modules (bundle_validator_registry, orchestrator_registry, registrar — all three stayed), and the 'Why the boundary exists' must-not-name list plus the verification snippet enumerate the INTERPRETER packages, which M2 does not touch, so both are correct unchanged. Ran the three prescribed mechanical checks by script: all 8 declared packages named under Enforcement, all 27 runtime_hub and 22 interpreter_hub get_* accessors covered by the partition tables, and the matched triple (guard tuple / closure INTERPRETER_PACKAGES / doc INTERPRETER snippet) agrees. As in every prior entry the mechanical checks passed while blind to all five findings above. One defect they were also blind to, found only by reading the generated output: _SUBSYSTEM_SECTIONS in error_pages_generator.py keys on the module's SECOND segment, so every vendor error class silently reclassified from 'Inference & providers' to the fallback 'Platform & tooling' macro — the identical shape to M1's mthds_parsing regression, three weeks later, caught this time because M1's lesson was to read the gep diff rather than its exit code."

