rationale = "Trigger is the MethodKernel->PipelexKernel rename, which changed exactly one word in runtime_hub.py: the class named in resolve_run_mode_for_boot's docstring. Reviewed docs/contribute/hub-layering.md and it is already current — the rename commit updated the page atomically, so the paragraph under 'Which hub does a new symbol belong to?' already reads PipelexKernel.make; only the ack digest was stale. Ran both prescribed mechanical checks rather than re-reading the tables, per the standing note in the dogfood log: all 15 packages in RUNTIME_LAYER_PACKAGES are named under Enforcement (the enumeration that rotted seven rounds running is clean — it now includes pipelex.kernel and pipelex.runtime_boot), and all 34 + 32 public module-level hub symbols appear in the partition tables. Also verified the page's concrete references still resolve: resolve_run_mode_for_boot sits beside is_dry_run_forced under 'run mode', and tests/unit/pipelex/kernel/test_kernel_boot_contract.py exists at the path the Enforcement section cites. No doc change needed. The review also turned up six stale MethodKernel references outside this contract's targets, in wip/parity/README.md and wip/parity/parity-gaps-plan.md, which arrived via the dev merge; those were renamed in the same change, so the old class name now survives only where a record describes the rename itself."

