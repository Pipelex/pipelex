rationale = "M1 review round. The trigger diff is both hub_layering_guard.py and runtime_hub.py, and that second one is the point: this is the first opening in the track where the module whose docstring states the rule is itself in the diff. Three of the four checkpoint reviewers independently found that runtime_hub.py:8-14 still forbade naming core.bundles and core.interpreter (deleted in M1a) and 'the Pipe-touching modules of core.pipes' (emptied in M1b), while omitting interpreter_plugins, pipe_machinery, pipe_signature and mthds_parsing. Its twin sentence in the review target had been rewritten under the immediately preceding ack; the source-side copy had not, because runtime_hub.py was not in THAT trigger diff and a trigger file is never itself a review target. Rewrote the docstring to the current package list and stated the pipeline/pipe_run qualification in it. Second and more serious: the preceding ack's own edit to the guard note introduced an overclaim — 'measured: every pipelex.core.* module loads zero interpreter modules' — which is false. Measured directly: core.pipes.pipe_output loads pipeline + pipeline_models, and runtime_hub also loads pipe_run.pipe_run_mode. The claim holds only under the closure predicate's deliberate pipeline/pipe_run carve-out, which line 228 of the review target states plainly, and the pre-M1 note had said the honest opposite. Qualified in all four places the property is now stated (guard note, runtime_hub docstring, 'Why the boundary exists', 'Where core splits') and recorded in wip/refactoring/deferred-placement-follow-ups.md that a caveat repeated four times is the argument for moving the two leaves. Also fixed in the target: two present-tense placements of the renderers in core/pipes/rendering/ (they are pipe_machinery/rendering/), the paragraph whose whole argument was that regrouping them inside core/ made the boundary fall on package lines (half true — it still left six core sub-entries; moving them out is what collapsed it), and two adjacent paragraphs that opened on the same textwrap.dedent premise and reached opposite conclusions about whether the negative control closes the vacuity gap. The import-closure section was rewritten because the code under it changed: INTERPRETER_PACKAGES is no longer inside the dedent string but a module-level constant passed to the subprocess as argv, which deletes the regex scraper the previous ack introduced and makes the names lint-visible. Re-ran the two prescribed mechanical checks by script — every plain get_* accessor on both hubs is covered by the partition tables, and all 7 declared packages are named under Enforcement — and they passed unchanged for the seventh consecutive time while being blind to every one of the above, consistent with every entry since the baseline. The matched triple was re-verified by script and agrees."

