rationale = "Trigger is a one-word rename leftover in hub_layering_guard.py's module-entry comment: it called pipelex.runtime_boot 'the runtime layer's composition root' while the same sentence went on to say what 'boot the kernel layer' costs — two names for one boundary in one sentence, in the file that defines the boundary. It survived the A0 sweep because the phrase spans a line break, so a line-oriented grep for 'runtime layer' could not see it. Reviewed docs/contribute/hub-layering.md end to end against the guard. The page carries no stale layer vocabulary (verified: zero hits for 'runtime layer' / 'runtime-layer'), and its declared-package list still matches KERNEL_LAYER_PACKAGES. One substantive edit, and it was a genuine contradiction rather than vocabulary: the paragraph on external plugins stated they are 'discovered through the pipelex.plugins entry-point group — a group identifier, not a module path, and unchanged', which is now false twice over (that group is retired and fails startup, and plugins declare their layer by choosing between two successors). The A3 doc sweep had deliberately left pipelex.plugins alone on this page because it is also the kernel-layer package name, and that carve-out over-applied to the one sentence that was explicitly about the group. Rewrote it to name both successor groups and added a parenthetical warning the reader that every OTHER mention of pipelex.plugins on the page is the package sense, since the collision is exactly the trap the carve-out was protecting against."

