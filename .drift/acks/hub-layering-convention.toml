rationale = "Re-ack after a code review hardened rule 3 (the transitive rule) in three ways, each of which changed what the doc must say. (1) The import graph now models the ancestor __init__.py files an import executes on the way to its target: reaching pkg.sub.mod runs pkg/__init__.py and pkg/sub/__init__.py first, so those are edges, and a breach in a package init is reached by every importer of anything beneath it — previously invisible to the walk, which is exactly the silent-breach class rule 3 exists to close. Verified on a synthetic tree (a clean leaf whose package init imports the hub now flags its runtime-layer importer) and on the real tree, where the stronger graph still reports 0 (8565 edges over 956 modules). (2) The escape hatch now applies to rule 3's graph too: a '# hub-layering: ignore'd import is not an edge, matching the TYPE_CHECKING carve-out. Before, a suppressed direct import left its edge in place, so the shortest chain came out one hop long and the len(chain) < 3 skip silently exempted the whole module from rule 3 while flagging its innocent importers instead — the opposite of what both the guard docstring and this page promised. The honest statement, now written in both places: the marker suppresses one reviewed *import*, never a module's transitive reach. (3) The rule refuses to pass vacuously — it raises HubLayeringGuardError if no pipelex.interpreter_hub is among the modules it parsed. Reverse reachability from an absent node is empty by construction, so a renamed hub (this repo just renamed pipelex/hub.py) or a non-repo-relative scan root turned the whole rule into a no-op that still printed PASSED; verified both failure modes now raise. Same negative-control reasoning the closure test already carries. Doc updated to match in the Enforcement section (rule 3's carve-out list gained the marker and the ancestor-init modelling, plus a new paragraph on the vacuity check) and in the second carve-out bullet. Also corrected two doc errors the review found: the built-in-plugins section claimed Pipelex.setup installs *every* derived registry on the RuntimeHub, but PipeFuncExecutorRegistry goes on the InterpreterHub — which the same page states two sections earlier and TODOS records as settled decision D3; the section is now explicit about the split. And that new H2 had been inserted between '## Where core splits' and its '### Injected providers, not ambient lookups' subsection, reparenting core's provider-injection convention under the plugins heading; the H2 moved below so the subsection sits under its own parent again. Re-ran both mechanical checks this contract prescribes: 33 + 32 public module-level hub symbols, all present in the partition tables (neither hub module changed), and all 12 declared runtime-layer entries still named under Enforcement. Re-read the rest of the page: the class-registry exception, 'Where core splits', 'Placement, not coupling' and the consumer section are unaffected."

