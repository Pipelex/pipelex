rationale = "Follow-up ack: a PR-review bot (Greptile, P2 on #1064) found one more way rule 3 could go green while the boundary was broken, and it is the same class as the three the code review closed. The transitive graph recorded only static import statements, so a module-level importlib.import_module(\"pipelex.interpreter_hub\") in an *intermediary* created no edge and its runtime-layer importer passed. Rule 1 already catches that string inside a runtime-layer module (it matches string literals, which is the load-bearing half of rules 1 and 2 — both hub references that ever occurred in this repo were strings, not imports), but an intermediary sits in no declared layer, so for it rule 1 only guards the dead hub. Fixed: _ImportGraphCollector gained a visit_Constant that records a module-level string naming the interpreter hub as an edge. Deliberately narrow — matched against INTERPRETER_HUB_MODULE alone, never against any pipelex.* string, because an arbitrary dotted string is as likely a plugin name or a config value as an import target, and rules 1 and 2 already set the precedent of matching only the forbidden targets in strings. Function bodies stay excluded, so a deferred dynamic import is still not an edge (new test pins both directions). Scanned pipelex/ for strings that reference the hub: exactly one, the guard's own INTERPRETER_HUB_MODULE declaration, which now carries a '# hub-layering: ignore' marker for the same reason DELETED_HUB_MODULE already did — it declares the path rather than importing it — and that marker works because the escape hatch now suppresses graph edges too, so this change dogfoods the previous one. Real tree still reports 0. Doc updated in three places: rule 3's paragraph in Enforcement gains the string-edge sentence and why an intermediary is the gap; the two 'Rules 1 and 2 match imports and bare string literals' sentences (guard docstring and page) now say all three rules, with the narrower target rule 3 uses spelled out; the escape-hatch bullet now says there are two markers in the tree, not one. Re-ran both mechanical checks: 33 + 32 public hub symbols still covered by the partition tables (neither hub module changed), all 12 declared runtime-layer entries still named under Enforcement. Declined the other bot comment on the same PR (Codex P1, move HubLayeringGuardError into an exceptions module): the error-location convention test scopes itself to PipelexError subclasses, this is a plain Exception, pipelex/cli/dev_cli is excluded from wheel and sdist, and the sibling keyword_only_guard holds SubjectGrantRegistryError the same way — a new hub_layering_exceptions.py would create a second convention for the same situation in adjacent modules."

