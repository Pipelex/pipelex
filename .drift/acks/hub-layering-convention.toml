contract = "hub-layering-convention"
digest = "sha256:228d581e16f5e2d499d65f196527fa6364e8942677fe3ff295a02a8a95ce55e9"
reviewed_by = "Louis Choquel"
reviewed_at = "2026-08-11T13:38:27Z"
rationale = "Trigger is two new public module-level accessors on interpreter_hub: get_required_entry_pipe / get_optional_entry_pipe, the entry-shaped counterpart to the now-strict get_required_pipe / get_optional_pipe. The doc WAS stale in the way this contract exists to catch: the 'library lookups' partition table enumerates every public hub symbol and did not list the two new ones, so the enumeration the previous ack verified (34 + 32 symbols) no longer matched the module. Added both to the table. Also added a paragraph under the 'no pipe counterpart' section stating which pair to reach for, because the choice between them is a correctness bug rather than a style preference — a CLI on the strict pair is needlessly strict, a controller on the entry pair reopens the cross-domain hole that makes [exports] unenforceable, and neither mistake is visible to the layering guard, which only polices runtime-vs-interpreter direction. No layer boundary moved: both new symbols are interpreter-layer, live beside their siblings, and add no runtime-layer import."

