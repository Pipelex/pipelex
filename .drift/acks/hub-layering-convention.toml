rationale = "Trigger is the forced-DRY fix adding resolve_run_mode_for_boot to runtime_hub.py. Reviewed docs/contribute/hub-layering.md and made two changes. (1) Added the new symbol to the runtime_hub accessor table under 'run mode', beside is_dry_run_forced. (2) The substantive one: the page opens by defining a hub as a container plus module-level ACCESSOR functions, and resolve_run_mode_for_boot is not an accessor — it applies a boot-scoped flag rather than reading it, so the page's own framing did not accommodate the symbol it now lists. Added a paragraph to 'Which hub does a new symbol belong to?' stating the case: the lifecycle rule still decides placement (a boot-set flag identical for every method makes the rule that interprets it runtime-layer by kind), and what makes the hub module the right home over either caller is that a boot-scoped invariant with two callers drifts if copied. Left the guard and RUNTIME_LAYER_PACKAGES sections alone — this change touched neither."

