rationale = "Trigger is the guard's RUNTIME_LAYER_PACKAGES tuple and its note again: pipelex.runtime_boot is added as a second module entry beside pipelex.runtime_hub, because pipelex.py was split into a runtime-layer composition root (RuntimeBoot) and an interpreter-layer boot (Pipelex subclasses it). Reviewed docs/contribute/hub-layering.md and edited eight places. (1) A new section, 'Where the boot splits', beside 'Where the built-in plugins split' — the two are the same move, and this one is what finally gives RUNTIME_BUILTIN_PLUGINS a caller after the plugin split created it with no importer. It records why inheritance over composition, the subclass-resolved singleton, the explicit teardown phases, and that pipelex.pipelex is deliberately left undeclared because it is interpreter-side by construction like pipelex.cli. (2) Ran the prescribed mechanical check that every declared package is named under 'The rule' — it FAILED on pipelex.runtime_boot, the seventh consecutive time an enumeration on this page was the rot, and the same enumeration as the last two rounds. Fixed, and the sentence now says why each of the two module entries is needed rather than only the hub. (3) The 'Pipelex.setup puts the registries on their hubs' sentence was describing a method that no longer does all of that; split across the two halves, which is now visible in the code rather than only in prose. (4) Who passes the composed plugin manifests to build_registrar. (5) Who calls class_registry_scoping.reset() — now the runtime teardown phase, not Pipelex.teardown. (6) The 'a process that only ever builds a RuntimeHub' note under 'Library scoping crosses downward' described only the doctor path and unit tests; that degradation now has a first-class entry point and a test pinning it. (7) Who imports test_extras at boot. (8) Enforcement gains the booted-runtime test, with the reason a subprocess is required rather than preferred: both hubs are sticky class-attribute singletons teardown never clears, so an in-process check would answer with a stale hub and pass vacuously — and booting rather than importing is what catches a boot step resolving out of an interpreter-contributed registry that is empty on a runtime-only boot. Second mechanical check (hub accessor coverage: 33 runtime, 32 interpreter module-level functions) passed and was blind to the enumeration gap, as it has been every round."

