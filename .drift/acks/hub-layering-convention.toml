rationale = "M1b/M1c: the trigger diff is the substantive one this contract exists for — RUNTIME_LAYER_PACKAGES itself changed, dropping six pipelex.core.* entries for the single pipelex.core, with the long note above the tuple rewritten because it existed to justify the package-by-package listing that no longer exists. Reviewed docs/contribute/hub-layering.md for real and found five stale places, TWO of which were load-bearing enumerations the trigger diff does not point at: 'The layer rule' under Enforcement still listed all six core entries and closed with 'Why core/ is listed package by package rather than wholesale is below', both false; and the 'runtime_hub must not name anything from …' list still trailed 'or the Pipe-touching modules of core.pipes', which is now an empty set. Rewrote 'Where core splits' around the resolution rather than the split (the section had described a two-layer core/ in the present tense), the transitive-rule predicate paragraph (it justified naming core's Pipe-machinery modules one by one and singled out pipe_blueprint — both gone, and the core.bundles.exceptions exclusion with them), and the Known-inversions bullet, which now records this as an inversion that was FIXED by placement rather than one that is tolerated. Re-verified the mechanical checks: 33 + 32 hub symbols still covered by the partition tables, and all 7 declared packages named under Enforcement. Beyond the doc, M1c closed the gap this contract's own review round flagged at the M3 checkpoint — that nothing bound the matched triple. Two new tests in tests/unit/pipelex/test_runtime_layer_import_closure.py now parse INTERPRETER_PACKAGES back out of the dedented script string and assert (a) every token is a real package directory under pipelex/, and (b) the set equals the INTERPRETER set in this page's own verification snippet. Both mutation-checked red: typo a token and both fail; drop a token from the doc snippet only and the second fails. That is the DIRTY_ENTRY_POINT gap closed for good — the negative control only ever proved that SOME token matched. The design doc's third copy is deliberately not asserted, since wip/ is archived at track end; noted in the tracker as a manual concern until then."

