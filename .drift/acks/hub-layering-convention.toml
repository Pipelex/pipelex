rationale = "The configuration reshape gives runtime_hub boot-scoped state for the boot orchestrator: a private _boot_orchestrator field, the set_boot_orchestrator/get_boot_orchestrator pair on RuntimeHub, and a public module-level get_boot_orchestrator() accessor beside is_dry_run_forced. That last one is a new row the page owed, so the accessor table gained a boot orchestrator group naming it. Verified mechanically rather than by eye, the way this contract's staleness actually shows up: parsed both hub modules with ast for public module-level functions and checked each against the page, 34 on runtime_hub and 33 on interpreter_hub, zero untabulated after the edit. No layer boundary moved. The state is kernel-layer by the page's own lifecycle rule, being set once at boot and identical for every method the process runs, and it replaces a read of the config object, so this is a hub gaining what was already boot-scoped rather than a new concern crossing the line. check-hub-layering passes."

