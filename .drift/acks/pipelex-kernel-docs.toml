rationale = "PipelexKernel.make gained an optional analytics_groups parameter, the opaque host-supplied group mapping, carried onto RunMetadata beside user_id and storage_scope. The kernel doc's run-scoped-state bullet already listed analytics_groups among what run_metadata holds and now also says the host supplies it at make time, which is the seam a multi-tenant embedder needs. The parameter is optional and defaults to an empty mapping, so the doc's two make examples stay correct unchanged."

