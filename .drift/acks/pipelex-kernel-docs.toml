rationale = "Phase 2 of the templating-style plan changed a kernel contract, so the page needed a real addition rather than a wording fix: every prompt-rendering entry point (run_llm_text, run_llm_object, derive_structure_prompt, assemble_llm_prompt, assemble_img_gen_prompt, run_search, run_compose_template) now takes a required templating_style instead of a nullable one, because the Jinja2 tag and format filters lost their silent fallbacks. Added a paragraph in the programmatic-caller section stating that contract and pointing at resolve_templating_style. The rest of the page was reviewed and is still accurate: the entry-point table is unchanged in names, the assemble-star paragraph and the no-caching note both still hold."

