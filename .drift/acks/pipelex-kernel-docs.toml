rationale = "real-catch: run_judgment now assembles the step's evidence prompt through assemble_user_prompt into a JudgmentPrompt, renders the question as a BASIC template, raises JudgmentRefusedError on a refusal and labels a Rating from the declared scale, while build_judgment_material and material_value were deleted and JudgmentResult gained the prompt sent. pipelex-kernel.md still listed the two deleted functions and described the by-name material; the module row drops them and the judgment paragraph now describes the evidence prompt, the BASIC question, the refusal policy, absence as the template's business and the rating label. The boot-contract test change only follows the new run_judgment signature."

