rationale = "The three kernel modules changed only where they read the config tree: img_gen_ops reads inference.img_gen.img_gen_param_defaults and inference.img_gen.img_gen_job, llm_ops reads inference.llm, templating_style_ops reads inference.templating.default_templating_style. Four lines, all reads, no signature, no entry point, no gate, no new function. Reviewed pipelex-kernel.md against them: the page specifies the kernel's callable surface for programmatic callers, and it names config addresses nowhere, so nothing on it went stale. Checked the module table still lists every public function in pipelex/kernel/ and that the Gates row's deck-reading-helpers wording is untouched by this change. No doc change needed."

