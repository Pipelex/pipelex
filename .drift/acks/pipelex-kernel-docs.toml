rationale = "Trigger is Phase 1 of the templating-style plan: the new kernel module templating_style_ops holds the total resolver, llm_ops lost derive_templating_style (its config source was deleted in the same change), and both PipelexKernel facade calls gained an optional templating_style resolved through that resolver. Reviewed docs/under-the-hood/pipelex-kernel.md and updated it in this change: the entry-point table now lists templating_style_ops and no longer names derive_templating_style, the opening flow prose says resolve the templating style instead of derive a prompting style, and the per-call-derivation note uses the templating vocabulary. The llm_object docstring paragraph the page did not cover was deleted with the question it adjudicated."

