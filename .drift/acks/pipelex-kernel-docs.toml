rationale = "ConceptProviderAbstract gained list_concept_keys_for_ref, so the boot-contract test's NativeOnlyConceptProvider implements it, returning an empty list — a provider that builds native concepts on demand stores none under a key. docs/under-the-hood/pipelex-kernel.md describes that smallest provider under shape_inputs and now names the enumeration beside the three capabilities it already listed; nothing else in the doc touches the provider surface."

