rationale = "Trigger is the kernel-layer rename reaching four kernel modules and the boot-contract test: prose only, no signature, no entry point, no behavior. Reviewed docs/under-the-hood/pipelex-kernel.md against the trigger and found two things genuinely stale, both fixed in the same change. First, the Enforcement table cited the two closure tests by path and both paths moved with the rename (test_runtime_layer_import_closure.py and test_runtime_layer_exceptions_aggregate_gate.py became test_kernel_layer_*); verified all three cited test paths now resolve on disk. Second, the page described the kernel's audience as anyone 'embedding the runtime' and RuntimeBoot.make() as the 'runtime-only' composition root — the exact overloaded word the rename exists to remove — now 'embedding the kernel' and 'kernel-only'. The kernel surface itself is unchanged by this trigger, so the completeness claim the previous ack verified module by module still holds: no function was added, renamed or moved, and the module table needs no new row."

