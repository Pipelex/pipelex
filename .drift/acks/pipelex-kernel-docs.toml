rationale = "real-catch: docs/under-the-hood/pipelex-kernel.md said a keyless boot uses no credentials, which the code contradicted (it substituted every backend's credentials and dropped the backends missing one); it now says the boot loads every enabled backend and model and resolves no credential. The trigger, judgment_ops.resolve_judgment_setting, changed only its docstring example; re-read its body: on a dry run a model no backend serves still keeps the deck's handle, which the page's judgment paragraph states as is."

