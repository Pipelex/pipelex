rationale = "Two failures, one cause. The contract had no ack and a stray ack file sat under its pre-rename id: the class rename swept drift.toml and the ack file's own 'contract' field but not the FILE's name, and the tool keys acks by filename. Renamed the file with git mv rather than hand-editing it, which restored the recorded 2026-08-03 review and reduced the failure to the honest one — triggers changed since that ack. Those changes are rename-only: kernel/__init__.py, pipelex_kernel.py and the boot-contract test each carry the class and module rename and nothing else, and the review target was already swept in the same commit. Reviewed docs/under-the-hood/pipelex-kernel.md against the page's own standing rule (every kernel entry point owes the boot-contract subprocess an arm) by enumerating the package rather than reading the table: all 29 public module-level functions across 18 modules are accounted for, and the boot-contract subprocess imports every operator entry point (run_*, build_*, assemble_*) plus the facade, with the remaining names being internal helpers those ops call transitively. One real gap found and fixed: the table under 'What a programmatic caller imports' had a row for every module except prompt_references, while assemble_llm_prompt and assemble_img_gen_prompt both require the caller to construct ImageReference / DocumentReference values — so the page omitted a module its own entry points oblige a caller to import. Added the row. Pre-existing rather than trigger-induced; fixed because the table states a completeness claim."

