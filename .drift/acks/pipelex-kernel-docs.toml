rationale = "PipelexKernel.make's signature is unchanged: user_id, storage_scope and trace_context are still flat keyword arguments, so both code examples on the page (lines 28 and 148) remain correct as written, and the paragraph at line 33 describing the two fields and why neither defaults is untouched by this change. What did change is internal to make(): it now builds JobMetadata(run_metadata=RunMetadata(...)) because JobMetadata split its run-constant half (user_id, pipeline_run_id, storage_scope, request_id) into a nested RunMetadata. That is invisible at the call site but NOT to a programmatic caller reading a field off kernel.job_metadata, and this page is the kernel's specification for exactly those callers - so the job_metadata bullet now states which half a field lives in, that the path is job_metadata.run_metadata.pipeline_run_id rather than job_metadata.pipeline_run_id, and that there is no read-through accessor. The split also formalises the run-level-vs-per-step distinction that bullet already drew informally, which is noted. Checked the rest: make_step_metadata still mints a per-step copy with a fresh pipe_run_id (pipe_run_id stays on JobMetadata, not RunMetadata), so that half of the bullet is unchanged; the trace_context paragraph at line 155 still holds because graph_id is still adopted as the run's pipeline_run_id, only nested; and the module table's public surface (make / llm_text / llm_object / make_step_metadata) is unchanged in both name and signature."

