rationale = "real-catch: the kernel gained pipelex/kernel/prompt_assembly.py, the user-prompt assembly PipeLLM, PipeImgGen and PipeJudge share, and assemble_llm_prompt and assemble_img_gen_prompt became thin over it, dropping their private copies of the image and document extraction and placeholder substitution. pipelex-kernel.md listed neither the module nor its entry points and said the two assemble functions owned the numbering themselves; the module table now lists prompt_assembly with UserPromptContent, AssembledUserPrompt, assemble_user_prompt and PromptFiles, the paragraph after it says the numbering is shared and that the caller's extra_params are copied rather than written to, and assemble_user_prompt joins the list of entry points taking a required templating_style."

