rationale = "Trigger is a docstring-only edit to test_kernel_boot_contract.py: its 'On the deferred orchestrator question' paragraph claimed the remedy for the external-interpreter-orchestrator hole 'remains unbuilt on purpose' and named a proposed HubSlot.is_interpreter_slot property. That became stale when the plugin entry-point group split landed — a kernel-only boot now scopes discovery to KERNEL_ENTRY_POINT_GROUPS, so an interpreter-group orchestrator is never registered and the existing gate rejects its name loudly. Rewrote the paragraph to say the hole is closed and by what, and closed out the wip analysis it cites. Reviewed docs/under-the-hood/pipelex-kernel.md against the trigger: nothing is stale. The trigger changed no kernel entry point, no signature and no behavior, so the module table and the completeness claim the previous ack verified module by module both still hold. The page cites test_kernel_boot_contract.py once, in the Enforcement table, for what the test covers ('every kernel entry point runs on a keyless boot, swept afterwards') — that citation describes the test's coverage, which this edit did not touch, and the cited path still resolves. The page says nothing about orchestrators, boot_orchestrator, plugin groups or entry points, so it has no surface that could contradict the trigger. Reviewed, no doc change needed."

