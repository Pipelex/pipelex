rationale = "Trigger fired on a lint-comment migration only. The ruff 0.16 upgrade rewrote two suppressions in tests/unit/pipelex/kernel/test_kernel_boot_contract.py from '# noqa: S404/S603' to the new '# ruff: ignore[suspicious-subprocess-import]' / '# ruff: ignore[subprocess-without-shell-equals-true]' spelling; the diff on that file is those two comments and nothing else. No kernel surface moved: PipelexKernel.make, llm_text, llm_object and make_step_metadata are untouched in name and signature, and the boot contract the test asserts is unchanged. docs/under-the-hood/pipelex-kernel.md therefore cannot have gone stale from this change and needs no edit. The page was touched in the same sweep, but only by ruff 0.16's new formatting of Python code blocks inside Markdown (blank lines and trailing-comment spacing) - no prose or code semantics changed."

