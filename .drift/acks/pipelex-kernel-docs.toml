rationale = "PipelexKernel.make gained a required storage_scope beside a user_id that is now also required (both had a fallback path before: user_id coalesced to the tracing placeholder 'anonymous' deep in pipeline_run_setup, and the storage prefix was derived from it). Both code examples on the page called make(user_id=...) and would now be a TypeError, so both are corrected. Added a paragraph on the two fields to the boot section: what storage_scope is (an opaque prefix the caller composes from its own tenancy model, which the kernel composes leaves onto and never parses), that it is validated at construction because it becomes a storage key prefix, and why neither field defaults. Checked the module table at line 69 still lists the kernel's public surface - make/.llm_text/.llm_object/.make_step_metadata are unchanged in name and the only signature that moved is make's. The step_id_source paragraph is untouched by this change."

