rationale = "clean-pass: the contract now also triggers on check_log_calls_cmd.py, whose options and output the page's Running it section states, and that section was re-derived from the command module. --quiet trims only a pass, to one line giving the baselined calls left and, when a comparison ran, that none were added since the trusted revision, while a failure still prints every call and entry; --prune rewrites the baseline without its stale signatures and then checks, never adding one; --report prints the baseline by package area, largest first, and returns before any gating; --against needs a ref that resolves, load_trusted_baseline raising otherwise; --against-merge-base skips the comparison with a notice when resolve_merge_base finds no merge base, and giving both options is an error; a failure lists each unlisted call with its file, line, qualified name and breaches, then the remedies of the rules seen, then the stale signatures under their keys, then the growth with both counts. The make wiring (--quiet with --against-merge-base origin/dev, or --against LOG_CALL_BASELINE_REF), the agent-check and check aggregates, the Lint (log calls) job under Lint (all), and the pre-main fresh check's base fetch and manual-run message match the Makefile and the workflows. The flag spellings and the -q alias are declared in pipelex/cli/dev_cli/_dev_cli.py, which is not a trigger. log_call_guard.py is unchanged since the last ack. The page needed no change."

