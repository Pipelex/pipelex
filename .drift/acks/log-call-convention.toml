rationale = "real-catch: initial review of docs/contribute/log-calls.md against log_call_guard.py, each claim re-derived from the code rather than from its docstring. Checked the scan roots and the excluded facade package, the facade paths and star-import modules, the methods each rule binds (info, warning, error and critical for the literal rule, those plus verbose and debug for markup, which are every emitting method of the facade in pipelex/tools/log/log.py), the message, title and inline parts with the ** expansion handling, the rule names and the forms each refuses, the opaque binding kinds and their placeholders, the flow events (branches, loops, try and with, match, jumps, module entry points, global and nonlocal moves), the markup tag reading through Rich's pattern, the baseline key, the signature, the exact two-way comparison, the trusted-revision rules, and the committed baseline, which lists no call. Two claims were wrong and are fixed: the page said a receiver is read as a message's names are, but receiver_bindings follows a receiver captured from an enclosing function through every binding that function makes, so a log imported in an enclosing function is the facade, as the guard's tests pin; and it said a + of known operands is always folded before the markup scan, while _folded scans the two sides apart past _MAX_FOLDED_SHAPES combinations. The Running it section describes check_log_calls_cmd.py, which is not a trigger of this contract; it was read and matches."

