rationale = "real-catch: log_call_guard.py adds the wording rules lowercase-start, trailing-period and backtick at every level, identifier and length (MAX_MESSAGE_LENGTH 80) at INFO and above, and spliced-exception at every level, each with a remedy, reads a captured name through every binding of its function for the exception rule and the receiver, keeps the two sides of a concatenation past the fold bound apart, and puts the exception route in the signature with the handler binding written as except target. Checked log-calls.md against the code and the guard tests: the rule table, the vocabulary words that pass, the start and end that a value keeps open, the length counted on literal runs with its at-least detail, the values the exception rule reads (placeholders, the right operand of a percent, format arguments, any non-literal part), the exception method call, captured names in a callback, a rebound handler name, the signature format and the remedies in the failure output all hold. Probing find_offending_calls_in_source showed one overstatement: lowercase-start refuses a first character that is a lowercase letter, so a message opening with a quote or a digit passes, where the table said its first letter and the DEBUG paragraph said a message starts with a capital. Both now say what the guard checks."

