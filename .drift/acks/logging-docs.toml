rationale = "real-catch: error_fields.py now delegates the input-free rendering of a ValidationError to pipelex.tools.typing.pydantic_utils and adds ERROR_CODE_FIELD, which the pipe failure line carries in place of error.message. logging.md was stale on three points and now says them: the field table gains error.code, the Exceptions section gains the rule that a pipe's failure line carries its code and class and never its text, and the ValidationError bullet names InputFreeValueError, whose sentence the rendering keeps. The 'two error keys' wording became 'the error keys'. log-sink-plugins.md states nothing error_fields.py decides, so it needed no change."

