rationale = "real-catch: console_fields.py adds advice_segments, which prints a user_action field whole on a line of its own after the arrow mark in cyan, a string as itself and anything else as compact JSON with terminal characters escaped, and leaves user_action out of the suffix; FIELD_STYLES, the cut lengths, the left-cut sets, SCHEMA_CONTEXT_KEYS and error_fields.py did not move. Checked the page against the code and test_log_console_sink.py: the new advice section holds (whole, one line, before a text traceback, a field on every other sink). Three sentences quantifying over what the console shows were stale: the What is shown bullet listed the run identifiers and data as the only fields left out of the suffix, and the layout bullet said every field not presented follows as the suffix, both now naming the advice line; Logger names and levels said the console links to the calling line, which it now shows only with is_show_path on. Another library's lines said a Pipelex plugin's line has no prefix, while console_prefix.py exempts only a top-level package named pipelex or starting with pipelex_, so a plugin named otherwise gets one: the page now states the rule by package name, as do the module's docstrings."

