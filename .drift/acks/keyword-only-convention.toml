rationale = "FU-3 adds an unsorted-grant violation kind: subject_grants.toml's sorted-by-key order is now enforced rather than only asserted in the doc's prose (line 37), which is the invariant the modularity track broke three times unnoticed. Reviewed docs/contribute/keyword-only-arguments.md in full and updated five places — the violation-kinds table under Enforcement, the registry-order paragraph under 'Staleness is symmetric' (order is read from the raw text, since TOML declares table order insignificant, and the text scan is cross-checked against the parsed keys so an unreadable entry shape fails loudly instead of narrowing the scan), the PostToolUse hook bullet (registry order is a whole-file property the per-file path cannot see, same as dead grants), the auto-fix paragraph (which listed only grant-param-mismatch as never-rewritten and silently omitted dead-grant — pre-existing gap, closed here), and a pointer line after the top-of-page rule list, because that list is scoped to signatures and registry order is not a signature property. No new Make target: the check rides check-keyword-only into agent-check and CI. Negative-tested both failure modes against the real registry (a swapped adjacent entry, and a multi-line rationale carrying a phantom table header)."

