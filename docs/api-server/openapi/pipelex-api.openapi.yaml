components:
  schemas:
    AbsenceKind:
      type: string
      enum:
      - declared_absent
      - skipped
      - not_provided
      title: AbsenceKind
      description: "How a slot came to hold no value.\n\n- DECLARED_ABSENT: a producer with an optional (`?`) output declared\
        \ it produced nothing\n  (e.g. a PipeCondition `continue` outcome, or — phase 2 — an LLM maybe-wrapper), or a binding\n\
        \  step's path reached a field holding nothing.\n- SKIPPED: the producing pipe was lifted (skipped) because one of\
        \ its plain inputs was absent,\n  or a binding step was, because its root was.\n- NOT_PROVIDED: the caller omitted\
        \ an optional method input from the pipeline inputs."
