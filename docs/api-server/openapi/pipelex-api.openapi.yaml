        async-capable backend. A deployment configures the backend (`orchestration_mode`) once; `/start`

        sets `FIRE_AND_FORGET` delivery and checks the resolved orchestrator can honor it. A Temporal

        deployment (`orchestration_mode = "temporal"`) enqueues the run and returns immediately with a

        `workflow_id`. On the orchestrator-agnostic base (`orchestration_mode = "direct"`, the default)

        the in-process orchestrator is blocking-only, so `/start` is HONEST: it refuses with a `501`

        (`runtime.unsupported`) — use `/execute` — rather than silently blocking and acking.

        The run''s delivery (its results stored, the deployment''s completion target, the caller''s `callback_urls`) runs
        on the

        async path when the run ends.'
      operationId: start_v1_start_post
      requestBody:
        content:
          application/json:
            schema:
              $defs:
                Base64FileEntry:
                  properties:
                    base64:
                      type: string
                      title: Base64
                      description: The file's bytes in canonical padded standard Base64.
                  additionalProperties: false
                  type: object
                  required:
                  - base64
                  title: Base64FileEntry
                  description: A file entry carrying the file's bytes in canonical padded standard Base64.
                HashFileEntry:
                  properties:
                    sha256:
                      type: string
                      pattern: ^[0-9a-f]{64}$
                      title: Sha256
                      description: The SHA-256 of the file's bytes, in lowercase hexadecimal.
                    size:
                      type: integer
                      minimum: 0.0
                      title: Size
                      description: The file's size in bytes, an integer written with no fraction or exponent.
                  additionalProperties: false
                  type: object
                  required:
                  - sha256
                  - size
                  title: HashFileEntry
                  description: A file entry naming, by their SHA-256 and their size, bytes the receiver already holds in its
                    blob store.
                StuffContentAbstract:
                  properties: {}
                  type: object
                  title: StuffContentAbstract
              properties:
                pipe_code:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Pipe Code
                mthds_contents:
                  anyOf:
                  - items:
                      type: string
                    type: array
                  - type: 'null'
                  title: Mthds Contents
                  description: 'Being retired, and refused by a later release: send the method in `files`. The method''s `.mthds`
                    files as raw strings, always an array, even for a single file; with no `pipe_code`, a file must declare
                    `main_pipe`. Mutually exclusive with `files`, `bundle_b64` and `method_ref`.'
                inputs:
                  anyOf:
                  - additionalProperties:
                      anyOf:
                      - type: string
                      - items:
                          type: string
                        type: array
                      - $ref: '#/$defs/StuffContentAbstract'
                      - items:
                          $ref: '#/$defs/StuffContentAbstract'
                        type: array
                      - additionalProperties: true
                        type: object
                    type: object
                  - type: 'null'
                  title: Inputs
                output_name:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Output Name
                output_multiplicity:
                  anyOf:
                  - type: boolean
                  - type: integer
                  - type: 'null'
                  title: Output Multiplicity
                dynamic_output_concept_ref:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Dynamic Output Concept Ref
                bundle_b64:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Bundle B64
                  description: 'PIPELEX-API EXTENSION (not part of the MTHDS Protocol) — base64-encoded zip of the method''s
                    folder, read as a map of its entries, so the archive''s names are judged by the method tree''s rule as
                    the keys of `files` are. The method packages it calls by address may travel with it under `.mthds/methods/<name>/`,
                    each with its `METHODS.toml`; they are searched before the runner''s installed copies, for this run alone.
                    Mutually exclusive with `files`. Custom `.py` is only honored on a sandbox-hosted deployment. Being retired
                    with `mthds_contents`, and refused by a later release: send the method in `files`.'
                files:
                  anyOf:
                  - additionalProperties:
                      anyOf:
                      - type: string
                      - $ref: '#/$defs/Base64FileEntry'
                      - $ref: '#/$defs/HashFileEntry'
                    type: object
                  - type: 'null'
                  title: Files
                  description: 'The method as a map of file entries, the MTHDS standard''s form of a method tree that travels:
                    each key is a tree path (relative, forward slashes, in Unicode NFC, no `.` or `..` segment, no segment
                    starting with a dot), and each value is the file''s UTF-8 text, `{"base64": ...}` holding its bytes, or
                    `{"sha256": ..., "size": ...}` naming bytes this runner already holds (uploaded with `POST /v1/blobs/missing`
                    then `PUT /v1/blobs/{sha256}`). The map is read from the request''s JSON text: a key given twice, a key
                    the membership rule keeps out of every tree (`.mthds/` included) and colliding keys are a 422 `method.package_invalid`
                    whose `reason` is the refusal''s code and whose `path` names the first path, a key leaving the tree is
                    a 422 `security.input_path_refused`, a malformed entry is a 422 `request.invalid`, and hash entries the
                    runner does not hold are one 422 `request.blobs_missing` whose `missing_blobs` parameter lists every such
                    hash. Its `.mthds` files are the method''s bundles and every other file is one a step may read, such as
                    a `PipeDocGen` template or a `PipeFunc` module. With no `pipe_code`, the run starts at the `main_pipe`
                    of the `METHODS.toml` at the tree''s root, or else at the one `main_pipe` its bundles declare. Custom
                    `.py` is only honored on a sandbox-hosted deployment.'
                dependencies:
                  anyOf:
                  - additionalProperties:
                      additionalProperties:
                        anyOf:
                        - type: string
                        - $ref: '#/$defs/Base64FileEntry'
                        - $ref: '#/$defs/HashFileEntry'
                      type: object
                    type: object
                  - type: 'null'
                  title: Dependencies
                  description: 'PIPELEX-API EXTENSION (not part of the MTHDS Protocol) — the method packages the method calls
                    by address that this runner cannot fetch, such as one an author has not published, as `{"<address>": <map
                    of file entries>}`: each value is a tree of its own, read as `files` is, with a `METHODS.toml` at its
                    root declaring the address it is keyed by. They are searched before the runner''s installed copies, for
                    this request alone. Accompanies `files`.'
                method_ref:
                  anyOf:
                  - type: string
                    maxLength: 512
                    minLength: 1
                  - type: 'null'
                  title: Method Ref
                  description: 'PIPELEX-API EXTENSION (not part of the MTHDS Protocol) — run a published method by reference
                    instead of inline source. Address form: `github.com/<owner>/<repo>[/<selector>][@<tag>]` (e.g. `github.com/Pipelex/methods/documents@v0.1.0`)
                    — resolved by THIS runner: the repository is fetched at the tag (a bare address means the default branch
                    at HEAD), the package is located by manifest identity, and the resolved commit SHA is recorded as `method_provenance`
                    on the response. Mutually exclusive with `mthds_contents` and with a method bundle (`bundle_b64` / `files`);
                    `pipe_code` may accompany it to override the manifest''s `main_pipe`. A package shipping custom Python
                    is only honored on a sandbox-hosted deployment, and a package declaring Python structure classes is always
                    refused — hosted execution accepts MTHDS concepts and sandboxed PipeFuncs, not in-process Python.'
                resources:
                  anyOf:
                  - additionalProperties:
                      type: string
                    type: object
                  - type: 'null'
                  title: Resources
                  description: 'The files submitted with the bundle that its steps read, such as a PipeDocGen step''s `template_file`
                    (an `.xlsx`, `.docx`, `.pptx` or `.html` template): a JSON object mapping each file''s bundle-relative
                    path, exactly as the step names it, to the file''s bytes in standard base64. A path must be relative and
                    written with forward slashes, with no `..` segment, backslash or colon. Beside inline `mthds_contents`,
                    every bundle of the request is read as sitting in one directory, and every file must be named by a step,
                    or the request is refused with a 422 `BundleResourceNotNamedError`. Beside a method tree, `files` or `bundle_b64`,
                    each file joins the tree at its path from the tree''s root, where a file the tree already holds must have
                    the same bytes. By default at most 32 files, 5120 KiB each and 10240 KiB in all, decoded; a deployment
                    sets its own with `MAX_RESOURCES_PER_REQUEST`, `MAX_RESOURCE_FILE_KIB` and `MAX_RESOURCES_TOTAL_KIB`.
                    The files make one method tree with the bundles, which the run names by its digest: no file''s bytes travel
                    with the run, each being read where a step uses it. Being retired with `mthds_contents`, and refused by
                    a later release: send these files in the method''s tree, in `files`.'
                pipeline_run_id:
                  anyOf:
                  - type: string
                    maxLength: 128
                  - type: 'null'
                  title: Pipeline Run Id
                callback_urls:
                  anyOf:
                  - items:
                      type: string
                    type: array
                  - type: 'null'
                  title: Callback Urls
                  description: 'PIPELEX-API EXTENSION (not part of the MTHDS Protocol) — the caller''s webhooks. When the
                    run ends, the runner POSTs the run.finished event to each URL, signed in the Standard Webhooks format
                    under the secret its operator configures (webhook-id, webhook-timestamp and webhook-signature headers):
                    `type`, `timestamp` (when the run ended), `attempt`, and `data`, the run as the protocol''s status read
                    serves it (`pipeline_run_id`, `status` `completed` or `failed`, and a failed run''s `error`, a problem
                    without `status`). It does not carry the run''s output. Each URL is delivered on its own, with a short
                    retry and no redirect followed, and its failure never changes the run. A runner whose operator configured
                    no signing secret refuses a request carrying any with a 422 `pipelex.webhook.secret_not_configured`. http/https
                    only; private, loopback, link-local and cloud-metadata hosts are rejected.'
                orchestration_mode:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Orchestration Mode
                  description: 'PIPELEX-API EXTENSION (not part of the MTHDS Protocol) — request the orchestration mode (the
                    backend) for this run. An OPEN string token: `direct` (in-process, the base default), `temporal`, and
                    any other plugin-provided token are accepted; an unregistered token is refused at dispatch. The delivery
                    axis (blocking vs fire-and-forget) is endpoint-set, never requestable. Honored ONLY when the deployment
                    sets `allow_request_orchestration_mode_override = true` in its `api.toml`; otherwise a token that differs
                    from the deployment default is refused with a 422 `pipelex.deployment.orchestration_override_forbidden`.
                    Omit it to use the deployment default.'
                storage_scope:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Storage Scope
                  description: PIPELEX-API EXTENSION (not part of the MTHDS Protocol) — the host-supplied prefix every object
                    this run writes lands under. One to three path-safe segments (e.g. `tenant/run` or `org/method/run`);
                    the runtime composes its own leaves (`assets/`, `generated/`, `results/`, `payloads/`) onto it and never
                    interprets the value. Omit it and the run is scoped to the caller's own id, which is correct for a single-tenant
                    deployment and wrong for a multi-tenant one — a host serving many tenants MUST send this.
                read_scope:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Read Scope
                  description: PIPELEX-API EXTENSION (not part of the MTHDS Protocol) — the host-supplied prefix every stored
                    object this run reads must lie under, and on a scoped run no local path is read at all. One to three path-safe
                    segments, which must be the `storage_scope` or one of its leading segments, since a run reads back what
                    it writes. Omit it and the run is scoped to the caller's own id when the deployment identifies callers,
                    and unscoped when it is single-tenant — a host serving many tenants MUST send this.
                analytics_groups:
                  anyOf:
                  - additionalProperties:
                      type: string
                    type: object
                  - type: 'null'
                  title: Analytics Groups
                  description: 'PIPELEX-API EXTENSION (not part of the MTHDS Protocol) — the host-supplied groups this run''s
                    telemetry belongs to, as a mapping of group type to group key (e.g. `{"organization": "org_acme"}`). The
                    runtime never reads a key by name: it carries the mapping on the run as its `extras` and stamps it on
                    every span as `pipelex.run.extras`, so every OpenTelemetry exporter receives it, and the deployment''s
                    own PostHog stream, in `identified` mode, forwards it as the capture''s groups. Group types are lowercase
                    snake_case starting with a letter, at most 32 characters; group keys are 1 to 128 characters from `[A-Za-z0-9_-]`;
                    at most five entries. Omit it and the run belongs to no group, which is right for a single-tenant deployment.'
              additionalProperties: true
              type: object
              title: PipelexApiStartRequest
              description: 'Documented body of `POST /start` — the protocol''s `StartRequest` plus THIS server''s extensions.


                Used only to publish the OpenAPI request schema: the protocol model no

                longer advertises implementation extensions, so this server documents the

                ones it implements itself. Wire validation happens in `PipelineApiExtras`.'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelexApiStartResponse'
        '401':
          description: '`auth.missing_credential`, `auth.invalid_credential` or `auth.credential_expired` — a missing, refused
            or expired bearer token. Only reachable when the deployment enables auth (`AUTH_MODE=api_key` or `AUTH_MODE=jwt`),
            or trusts a proxy''s forwarded identity and the proxy forwarded none.'
          headers:
            WWW-Authenticate:
              description: Authentication challenge, `Bearer`, where the deployment reads a bearer token (`AUTH_MODE=api_key`
                or `AUTH_MODE=jwt`). Absent behind a trusted proxy, which reads no credential of the request.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDocument'
        '413':
          description: '`request.too_large` — the request, or a part of it such as a file it sends, exceeds one of the deployment''s
            byte limits (`MAX_REQUEST_BODY_MIB`, 100 MiB by default, for the body). `params.limit` and `params.size` give
            both in bytes.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDocument'
        '422':
          description: 'The request could not be processed: a body that does not parse (`request.malformed`), fields the route
            refuses (`request.invalid`, one item in `errors` per refused field), a security rule''s refusal (such as `pipelex.security.reserved_key`
            or `security.input_url_refused`), a method tree the runner cannot read (`method.package_invalid`), or a pipelex
            error whose code the caller fixes (a `.mthds` bundle that does not validate, a missing input). Note that on the
            diagnostic routes an *invalid bundle* is a **200** verdict, not a 422 — see each route''s response contract.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDocument'
        '500':
          description: 'A failure the caller cannot fix: the runner''s own configuration (`runtime.misconfigured`, such as
            a missing env var), a bad TOML override, a backend fault, or an unexpected error answered as `runtime.unexpected`.
            Report the `request_id`. Or `pipelex.storage.damaged`, naming the kind of storage as `params.scheme`: bytes the
            blob store holds under a hash the request names do not hash to it, a damaged object a retry reads again, so its
            verdict is not to retry. The operator removes the object, for the blob to be uploaded again.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDocument'
        '403':
          description: '`auth.forbidden`, whose `params.requirement` is `read_scope_under_caller` — on a `jwt` deployment,
            the request sent a `read_scope` that does not lie under the caller''s own `user_id`, the only scope its token
            may read.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDocument'
        '404':
          description: '`method.not_found` — the `method_ref` repository was fetched, but no package in it matches the requested
            address by manifest identity.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDocument'
        '409':
          description: '`pipelex.run.already_exists` — the submitted `pipeline_run_id` is still registered for an in-flight
            run. Completed and failed runs free their id, so this only fires for genuinely concurrent duplicates.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDocument'
        '501':
          description: '`runtime.unsupported` — this deployment cannot honor fire-and-forget delivery: its orchestrator is
            blocking-only, or its async execution is not enabled. Permanent under the current deployment; use `POST /execute`
            instead. Or `pipelex.deployment.custom_code_requires_sandbox`, as on `POST /execute`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDocument'
      x-mthds-protocol: true
  /v1/validate:
    post:
      tags:
      - validate
      summary: Validate Mthds
      description: "Validate MTHDS content by parsing, loading, and dry-running pipes (MTHDS Protocol `POST /validate`).\n\
        \n`/validate` is a **diagnostic endpoint**: any verdict the validator can produce — valid,\ninvalid, or valid-but-not-runnable\
        \ — rides a **200** discriminated in the body on `is_valid`.\nNon-2xx is reserved for the cases where *no verdict\
        \ could be produced*.\n\nResponse contract:\n\n- **Valid verdict (200, `is_valid: true`):** the `ValidReport` arm\
        \ — the canonical report\n  (primary `bundle_blueprint`, `pipe_io_contracts` keyed by namespaced `pipe_ref`, per-pipe\n\
        \  `validated_pipes` sweep outcomes, `pending_signatures` + `is_runnable` runnability verdict,\n  best-effort `graph_spec`)\
        \ plus the wire extras (`mthds_contents` echo, `message`,\n  `default_pipe_ref`). The graph is drawn from the pipe\
        \ a selector-less run of this request\n  would execute: on a `method_ref` request whose manifest names a `main_pipe`,\
        \ that pipe;\n  otherwise the primary blueprint's `main_pipe`. A bundle that declares no `main_pipe`, with\n  no manifest\
        \ naming one, validates fine and carries `graph_spec=null`, and so does a\n  manifest `main_pipe` the closure does\
        \ not resolve. Pending signatures are reported as `pending_signatures` +\n  `is_runnable: false`, never as an error.\
        \ `default_pipe_ref` names the pipe a selector-less\n  run of this same request would execute — on a `method_ref`\
        \ request that is the fetched\n  manifest's `main_pipe`, which the canonical report cannot see, so the field is the\
        \ only\n  signal a consumer can project a by-address entry signature from.\n  The opt-in `views` tokens `input_form`\
        \ and `output_form` additionally attach the per-pipe\n  input-form and output-form descriptors as same-named top-level\
        \ fields, keyed like\n  `pipe_io_contracts`; without a token the matching field is absent and the body is\n  byte-identical\
        \ to a request that omits `views`. They are separate tokens because they answer\n  separate questions — a caller building\
        \ a fill-in form wants the inputs, a caller rendering a\n  result or registering a tool signature with a return type\
        \ wants the output.\n- **Invalid verdict (200, `is_valid: false`):** the `InvalidReport` arm — `errors[]`, one problem\
        \ item per\n  error with its own code (incl. one located item per pipe whose dry run failed, with the failure's code),\
        \ the\n  items of the verdict's problem — + `message`, with the structural artifacts absent. The runner\n  returns\
        \ this as a value (a `BundleValidationFailure` with validation items) regardless of backend — the\n  in-process arm\
        \ from the bundle's `ValidateBundleError`, the dispatched arm recovered from the\n  worker — so the route maps it\
        \ to a 200 by matching validation diagnostics, never by catching an\n  exception. A returned failure without validation\
        \ diagnostics is a backend, configuration or runtime\n  fault, and its problem is answered as every raised failure's\
        \ is.\n- **Either arm:** a member with no value is absent rather than `null`, at the arm's top level and in its\n\
        \  problem items; the structured artifacts of the valid arm keep their own serialization.\n- **No verdict (non-2xx):**\
        \ a malformed request body, an `mthds_sources` length mismatch, or\n  more or fewer than one of `files` / `method_ref`\
        \ / `mthds_contents` is a request-shape **422**, and so is a forbidden\n  `orchestration_mode` override; a host-wiring\
        \ programmer error or a genuine orchestrator fault is a\n  **5xx**; auth is **401/403**. A `method_ref` **resolution\
        \ failure** is also a no-verdict condition —\n  never an `is_valid: false`: each answers the status its code declares,\
        \ such as a **422** for a\n  malformed reference, a **502** for a failed fetch, a **404** for no matching package\
        \ in the\n  repository and a **422** for the method's Python structure classes, and the custom-code sandbox gate\n\
        \  a **501**. All are `application/problem+json` documents carrying a registry `code`, rendered by the\n  global handlers\
        \ in `pipelex_api.exception_handlers` — routes never shape them."
      operationId: validate_mthds_v1_validate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ValidReport'
                - $ref: '#/components/schemas/InvalidReport'
                title: Response Validate Mthds V1 Validate Post
                discriminator:
                  propertyName: is_valid
                  mapping:
                    'True': '#/components/schemas/ValidReport'
                    'False': '#/components/schemas/InvalidReport'
        '401':
          description: '`auth.missing_credential`, `auth.invalid_credential` or `auth.credential_expired` — a missing, refused
            or expired bearer token. Only reachable when the deployment enables auth (`AUTH_MODE=api_key` or `AUTH_MODE=jwt`),
            or trusts a proxy''s forwarded identity and the proxy forwarded none.'
          headers:
            WWW-Authenticate:
              description: Authentication challenge, `Bearer`, where the deployment reads a bearer token (`AUTH_MODE=api_key`
                or `AUTH_MODE=jwt`). Absent behind a trusted proxy, which reads no credential of the request.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDocument'
        '413':
          description: '`request.too_large` — the request, or a part of it such as a file it sends, exceeds one of the deployment''s
            byte limits (`MAX_REQUEST_BODY_MIB`, 100 MiB by default, for the body). `params.limit` and `params.size` give
            both in bytes.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDocument'
        '422':
          description: 'The request could not be processed: a body that does not parse (`request.malformed`), fields the route
            refuses (`request.invalid`, one item in `errors` per refused field), a security rule''s refusal (such as `pipelex.security.reserved_key`
            or `security.input_url_refused`), a method tree the runner cannot read (`method.package_invalid`), or a pipelex
            error whose code the caller fixes (a `.mthds` bundle that does not validate, a missing input). Note that on the
            diagnostic routes an *invalid bundle* is a **200** verdict, not a 422 — see each route''s response contract.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDocument'
        '500':
          description: 'A failure the caller cannot fix: the runner''s own configuration (`runtime.misconfigured`, such as
            a missing env var), a bad TOML override, a backend fault, or an unexpected error answered as `runtime.unexpected`.
            Report the `request_id`. Or `pipelex.storage.damaged`, naming the kind of storage as `params.scheme`: bytes the
            blob store holds under a hash the request names do not hash to it, a damaged object a retry reads again, so its
            verdict is not to retry. The operator removes the object, for the blob to be uploaded again.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDocument'
        '403':
          description: '`auth.forbidden`, whose `params.requirement` is `read_scope_under_caller` — on a `jwt` deployment,
            the request sent a `read_scope` that does not lie under the caller''s own `user_id`, the only scope its token
            may read.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDocument'
        '404':
          description: '`method.not_found` — the `method_ref` repository was fetched, but no package in it matches the requested
            address by manifest identity.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDocument'
        '501':
          description: '`pipelex.deployment.custom_code_requires_sandbox` — the method (a bundle, or a fetched `method_ref`
            package, as `params.origin` says) ships custom Python and this deployment is not sandbox-hosted. The refusal of
            a method whose Python declares structure classes, `pipelex.deployment.python_structures_refused`, is a 422 instead,
            since the method''s author changes it.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDocument'
      x-mthds-protocol: true
  /v1/resolve:
    post:
      tags:
      - resolve
      summary: Resolve Mthds
      description: "Resolve a method into its normalized crate (Pipelex API extension).\n\nResolution is a first-class language\
        \ operation alongside validation: read the method's tree\n(`files`, or the package a `method_ref` fetches) exactly\
        \ as `/validate` reads it, load + statically\nvalidate it as the caller's own library, and emit the **normalized library\
        \ crate** (fully\nqualified refs, refinement flattened, natives materialized, fingerprint set) — the artifact\nshape\
        \ the MTHDS standard specifies as the Library Crate Format. It runs no dry-run sweep —\nrunnability is `/validate`'s\
        \ vocabulary.\n\nResponse contract (the `/validate` discipline):\n\n- **Valid verdict (200, `is_valid: true`):** the\
        \ crate on the valid arm.\n- **Invalid verdict (200, `is_valid: false`):** the library could not be parsed, loaded,\
        \ or\n  validated — `errors[]`, one problem item per error.\n- **No verdict (non-2xx):** a malformed request body\
        \ (neither or both method selectors) is a\n  request-shape 422 `request.invalid`; a `files` map that is not a method\
