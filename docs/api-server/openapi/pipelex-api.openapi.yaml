                - $ref: '#/components/schemas/Base64FileEntry'
                - $ref: '#/components/schemas/HashFileEntry'
              type: object
            type: object
          - type: 'null'
          title: Dependencies
          description: 'PIPELEX-API EXTENSION (not part of the MTHDS Protocol) — the method packages the method calls by address
            that this runner cannot fetch, such as one an author has not published, as `{"<address>": <map of file entries>}`:
            each value is a tree of its own, read as `files` is, with a `METHODS.toml` at its root declaring the address it
            is keyed by. They are searched before the runner''s installed copies, for this request alone. Accompanies `files`.'
        method_ref:
          anyOf:
          - type: string
            maxLength: 512
            minLength: 1
          - type: 'null'
          title: Method Ref
          description: PIPELEX-API EXTENSION (not part of the MTHDS Protocol) — a published method by reference, instead of
            its tree. Address form (`github.com/<owner>/<repo>[/<selector>][@<tag>]`) is fetched and read as a `files` tree
            is, through the same path as a `method_ref` run; the registry form stays reserved (a 422 `request.unsupported`
            until a method registry exists). Exactly one of `files` / `method_ref`.
        resources:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Resources
          description: 'The files submitted with the bundle that its steps read, such as a PipeDocGen step''s `template_file`
            (an `.xlsx`, `.docx`, `.pptx` or `.html` template): a JSON object mapping each file''s bundle-relative path, exactly
            as the step names it, to the file''s bytes in standard base64. A path must be relative and written with forward
            slashes, with no `..` segment, backslash or colon. Beside inline `mthds_contents`, every bundle of the request
            is read as sitting in one directory, and every file must be named by a step, or the request is refused with a
            422 `BundleResourceNotNamedError`. Beside a method tree, `files` or `bundle_b64`, each file joins the tree at
            its path from the tree''s root, where a file the tree already holds must have the same bytes. By default at most
            32 files, 5120 KiB each and 10240 KiB in all, decoded; a deployment sets its own with `MAX_RESOURCES_PER_REQUEST`,
            `MAX_RESOURCE_FILE_KIB` and `MAX_RESOURCES_TOTAL_KIB`. The files make one method tree with the bundles, which
            the run names by its digest: no file''s bytes travel with the run, each being read where a step uses it. Being
            retired, and refused by a later release: a file the steps read travels inside the method''s tree, in `files`,
            at its path beside the bundle that names it.'
        read_scope:
          anyOf:
          - type: string
          - type: 'null'
          title: Read Scope
          description: 'PIPELEX-API EXTENSION (not part of the MTHDS Protocol) — the scope the request reads the method under,
            as a run''s `read_scope`: a multi-tenant host sends the one of the organization it serves. A hash entry of `files`
            resolves in that scope''s blob store, and the tree the request read is recorded there, so a later request can
            send it by hash. Omit it and a hash entry resolves in the caller''s own id''s store, and nothing is recorded.'
      type: object
      title: MethodTreeRequest
      description: 'The method selector of the crate routes (`/resolve`, `/codegen`, `/pipe-io`): a tree sent in `files` XOR
        a `method_ref`.


        Exactly one of the two must be provided — both or neither is a request-shape 422. The tree is the MTHDS standard''s

        map of file entries, read from the request''s raw JSON text exactly as `/validate` and the run routes read it

        (`pipelex_api.method_tree_request`), with the `dependencies` it carries and the `resources` that join it. An

        **address-form** `method_ref` (`github.com/<owner>/<repo>[/<selector>][@<tag>]`) is resolved by this server through

        the run routes'' fetch path: the package''s tree is read from its commit''s git objects, with the packages it ships

        under `.mthds/methods/`. The **registry form** (any non-address reference) stays reserved, a 422

        `request.unsupported`, until server-side method-registry resolution exists. Either way the method is held to the run
        routes'' Python policy:

        custom `.py` only on a sandbox-hosted deployment, and no Python structure class at all.'
    MigrationErrorBlock:
      properties:
        remedy:
          type: string
          title: Remedy
        would_write:
          type: boolean
          title: Would Write
        needs_attention:
          type: boolean
          title: Needs Attention
        plans:
          items:
            $ref: '#/components/schemas/MigrationPlan'
          type: array
          title: Plans
      additionalProperties: false
      type: object
      required:
      - remedy
      - would_write
      - needs_attention
      - plans
      title: MigrationErrorBlock
      description: 'A pending configuration migration, reported alongside the error it explains.


        The structured half of the answer to *why does my configuration not load*, carried by the operator''s

        ``diagnostics.migration`` and present only when a scan of this machine''s configuration directories found something

        to say. **Consumers branch on its presence**, never on the message text: an absent block means the failure is not

        staleness. It describes the host''s own configuration directories, so only an operator reads it.


        ``plans`` is the same shape ``pipelex-agent migrate --dry-run --format json`` emits under its own ``plans`` key,

        deliberately: an agent that reads one has already parsed the other.


        > **No value read from a user''s file is ever rendered** here either. The plans carry paths, operation kinds and

        > ledger-supplied values, and nothing else.'
    MigrationPlan:
      properties:
        surface_id:
          type: string
          title: Surface Id
        file_path:
          type: string
          format: path
          title: File Path
        blocked_reason:
          anyOf:
          - $ref: '#/components/schemas/FileBlockedReason'
          - type: 'null'
        blocked_detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Blocked Detail
        steps:
