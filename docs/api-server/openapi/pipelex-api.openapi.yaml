      - lock
      title: CodegenValidReport
      description: 'The 200 **valid** arm: the stamped artifact set plus its lock.


        A client that writes each artifact and the lock verbatim reproduces a local

        `pipelex codegen types` run byte-for-byte — the same stamps, the same `codegen.lock` — so the

        offline `codegen check` passes on the written tree exactly as it would locally.'
    Concept:
      properties:
        code:
          type: string
          title: Code
        domain_code:
          type: string
          title: Domain Code
        description:
          type: string
          title: Description
        structure_class_name:
          type: string
          title: Structure Class Name
        refines:
          anyOf:
          - type: string
          - type: 'null'
          title: Refines
      additionalProperties: false
      type: object
      required:
      - code
      - domain_code
      - description
      - structure_class_name
      title: Concept
      description: 'A concept as the runtime holds it in memory: its name and its definition.


        The protocol model, `ConceptAbstract`, is a name and nothing more — `code`, `domain_code`

        and the `concept_ref` they form — because the standard keeps a concept''s definition in the

        library a method loads, never beside a stuff. The runtime needs the definition in memory to

        resolve a structure class, check compatibility and render a representation, so it declares

        those fields here, on its own subclass.


        The fields declared here never travel beside a stuff: `StuffAbstract` serializes `concept`

        as the ref string, so every dump of a `Stuff`, of a `WorkingMemory` and of a `PipeOutput`

        carries `{"concept": "<domain>.<Code>", "content": …}`. A reader of such a dump resolves the

        ref through the concept library the method loads, the way the input side does.'
