          type: array
          title: Outputs
      additionalProperties: false
      type: object
      title: NodeIOSpec
      description: Input/output specification for a node.
    NodeKind:
      type: string
      enum:
      - pipe_call
      - controller
      - operator
      - input
      - output
      - artifact
      - error
      - binding
      title: NodeKind
      description: Types of nodes in the execution graph.
