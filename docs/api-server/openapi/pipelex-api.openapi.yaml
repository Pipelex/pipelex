    NodeUsageSpec:
      properties:
        inference_calls:
          type: integer
          title: Inference Calls
          default: 0
        rated_inference_calls:
          type: integer
          title: Rated Inference Calls
          default: 0
        nb_tokens_by_category:
          additionalProperties:
            type: integer
          type: object
          title: Nb Tokens By Category
