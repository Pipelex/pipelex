          type: object
          title: Tree File Readers
          description: 'The per-file view of `tree_files_read`: each tree path a step reads, in sorted order, to the namespaced
            refs of the pipes that read it. A file of the method''s tree absent here is read by no step.'
        graph_spec:
          anyOf:
          - $ref: '#/components/schemas/GraphSpec'
          - type: 'null'
        validated_pipes:
          items:
            $ref: '#/components/schemas/ValidatedPipeEntry'
          type: array
          title: Validated Pipes
        pending_signatures:
          items:
            type: string
          type: array
          title: Pending Signatures
        is_runnable:
          type: boolean
          title: Is Runnable
          default: true
        mthds_contents:
          items:
            type: string
          type: array
          title: Mthds Contents
          description: 'The MTHDS contents that were validated: the request''s `mthds_contents`, or the texts of a method
            tree''s `.mthds` bundles in tree path order.'
        message:
          type: string
          title: Message
          description: Status message
          default: MTHDS content validated successfully
        default_pipe_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Default Pipe Ref
          description: 'The qualified `domain.pipe_code` a caller gets by omitting the pipe selector — the pipe a selector-less
            run of THIS request would execute. For a method tree (`files` or a `method_ref`) it is the tree''s entry pipe
            by the MTHDS protocol''s rule: the `main_pipe` of the `METHODS.toml` at its root, else the one `main_pipe` its
            bundles declare. For inline `mthds_contents` it is the closure''s primary blueprint''s `main_pipe` qualified by
            its domain. Absent when no entry pipe is determined, in which case a selector-less run would be refused too.'
        rendered_markdown:
          anyOf:
          - type: string
          - type: 'null'
          title: Rendered Markdown
          description: 'Opt-in Pipelex-API presentation extra: a server-rendered Markdown view of the valid verdict, present
            only when the request''s `render` includes `markdown`. Absent by default — the structured fields remain the contract;
            this is the view.'
      additionalProperties: true
      type: object
      required:
      - bundle_blueprint
      - mthds_contents
      title: ValidReport
      description: 'The 200 **valid** arm: the canonical `PipelexValidationReport` plus this server''s wire-only extras.


        The report fields are inherited — typed models, identical to what the local runtime

        returns for the same bundle, with `is_valid: Literal[True]` (from the report) as the union

        discriminant. The extras exist for HTTP clients only (the webapp reads back `mthds_contents`);

        they are NOT part of the canonical report and no in-process consumer should depend on them.


        `warnings` is re-declared as problem items: the canonical report holds the advisory findings as the validation

        items the local channels render, and the wire carries each as the problem item its type''s code makes

        (`pipelex.pipeline.validation_errors.warning_problem_items`), the item shape `errors` has on the invalid arm.


        Two inherited fields are deliberately re-declared: `input_form` and `output_form`. The canonical

        report requires both (a backend that forgets to derive one must fail loudly rather than ship an

        empty view), but on the wire each is an opt-in structured view gated by the request''s `views` —

        so both are re-declared with defaults here, keeping them out of the published schema''s `required`

        set. The values still always arrive from the report; the route pops each when its token was not

        requested. They are separate tokens rather than one because they answer separate questions: a

        caller building a fill-in form wants the inputs, a caller rendering a result or registering a

        tool signature wants the output, and neither should pay for the other.'
    ValidateRequest:
      properties:
        analytics_groups:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Analytics Groups
          description: 'PIPELEX-API EXTENSION (not part of the MTHDS Protocol) — the host-supplied groups the caller of this
            request belongs to, as a mapping of group type to group key (e.g. `{"organization": "org_acme"}`), exactly as
            a run request states them. The work this request does is not a run, but it still emits telemetry — the validation
            sweep''s `pipe_dry_run` event and its dry runs — and that telemetry is attributed to the caller: the authenticated
            user and these groups. Same rules and same 422 `InvalidAnalyticsGroups` refusal as on `/execute` and `/start`.
            Omit it and the caller belongs to no group.'
        mthds_contents:
          anyOf:
          - items:
              type: string
            type: array
            maxItems: 16
            minItems: 1
          - type: 'null'
          title: Mthds Contents
          description: 'Being retired, and refused by a later release: send the method in `files`. MTHDS contents to load
            (always an array, even for a single file). Exactly one of `mthds_contents` / `files` / `method_ref`.'
        files:
          anyOf:
          - additionalProperties:
              anyOf:
              - type: string
              - $ref: '#/components/schemas/Base64FileEntry'
              - $ref: '#/components/schemas/HashFileEntry'
            type: object
          - type: 'null'
          title: Files
          description: 'The method as a map of file entries, the MTHDS standard''s form of a method tree that travels: each
            key is a tree path (relative, forward slashes, in Unicode NFC, no `.` or `..` segment, no segment starting with
            a dot), and each value is the file''s UTF-8 text, `{"base64": ...}` holding its bytes, or `{"sha256": ..., "size":
            ...}` naming bytes this runner already holds (uploaded with `POST /v1/blobs/missing` then `PUT /v1/blobs/{sha256}`).
            The map is read from the request''s JSON text: a key given twice, a key the membership rule keeps out of every
            tree (`.mthds/` included) and colliding keys are a 422 `method.package_invalid` whose `reason` is the refusal''s
            code and whose `path` names the first path, a key leaving the tree is a 422 `security.input_path_refused`, a malformed
            entry is a 422 `request.invalid`, and hash entries the runner does not hold are one 422 `request.blobs_missing`
            whose `missing_blobs` parameter lists every such hash. Its `.mthds` files are the method''s bundles and every
            other file is one a step may read, such as a `PipeDocGen` template or a `PipeFunc` module. With no `pipe_code`,
            the run starts at the `main_pipe` of the `METHODS.toml` at the tree''s root, or else at the one `main_pipe` its
            bundles declare. Custom `.py` is only honored on a sandbox-hosted deployment. The whole tree is validated, its
            Python included, by syntax. Exactly one of `mthds_contents` / `files` / `method_ref`.'
        dependencies:
          anyOf:
          - additionalProperties:
              additionalProperties:
                anyOf:
                - type: string
                - $ref: '#/components/schemas/Base64FileEntry'
                - $ref: '#/components/schemas/HashFileEntry'
              type: object
            type: object
          - type: 'null'
          title: Dependencies
          description: 'PIPELEX-API EXTENSION (not part of the MTHDS Protocol) — the method packages the method calls by address
            that this runner cannot fetch, such as one an author has not published, as `{"<address>": <map of file entries>}`:
            each value is a tree of its own, read as `files` is, with a `METHODS.toml` at its root declaring the address it
            is keyed by. They are searched before the runner''s installed copies, for this request alone. Accompanies `files`.'
        method_ref:
          anyOf:
          - type: string
            maxLength: 512
            minLength: 1
          - type: 'null'
          title: Method Ref
          description: 'PIPELEX-API EXTENSION (not part of the MTHDS Protocol) — validate a published method by reference
            instead of inline contents. Address form: `github.com/<owner>/<repo>[/<selector>][@<tag>]`, resolved by THIS runner
            through the same fetch path as a `method_ref` run; the package''s tree, read from its commit, is validated as
            a `files` tree is. Exactly one of `mthds_contents` / `files` / `method_ref`. A resolution failure (fetch, package
            location, the custom-Python policy) is a non-2xx `problem+json` — never an `is_valid: false` verdict, which is
            reserved for actual MTHDS content.'
        allow_signatures:
          type: boolean
          title: Allow Signatures
          description: When true, the validation sweep tolerates unimplemented pipe signatures instead of rejecting the bundle
            (signatures dry-run trivially by minting a mock). Defaults to false (strict).
          default: false
        mthds_sources:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Mthds Sources
          description: 'Being retired with `mthds_contents`, and refused by a later release: the bundles of a method sent
            in `files` are named by their tree paths. Optional per-file sources, parallel to `mthds_contents`. When provided,
            each entry is threaded onto the corresponding bundle''s `source` so server-side validation errors carry a `source`
            pointing at the owning file. Must match `mthds_contents` in length when present.'
        resources:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Resources
          description: 'The files submitted with the bundle that its steps read, such as a PipeDocGen step''s `template_file`
            (an `.xlsx`, `.docx`, `.pptx` or `.html` template): a JSON object mapping each file''s bundle-relative path, exactly
            as the step names it, to the file''s bytes in standard base64. A path must be relative and written with forward
            slashes, with no `..` segment, backslash or colon. Beside inline `mthds_contents`, every bundle of the request
            is read as sitting in one directory, and every file must be named by a step, or the request is refused with a
            422 `BundleResourceNotNamedError`. Beside a method tree, `files` or `bundle_b64`, each file joins the tree at
            its path from the tree''s root, where a file the tree already holds must have the same bytes. By default at most
            32 files, 5120 KiB each and 10240 KiB in all, decoded; a deployment sets its own with `MAX_RESOURCES_PER_REQUEST`,
            `MAX_RESOURCE_FILE_KIB` and `MAX_RESOURCES_TOTAL_KIB`. The files make one method tree with the bundles, which
            the run names by its digest: no file''s bytes travel with the run, each being read where a step uses it. Being
            retired with `mthds_contents`, and refused by a later release: send these files in the method''s tree, in `files`.'
        render:
          items:
            type: string
          type: array
          title: Render
          description: 'Opt-in Pipelex-API presentation extra: view formats to render server-side. A supported token (`markdown`)
            adds a `rendered_<format>` field (e.g. `rendered_markdown`) to the 200 verdict, on both the valid and invalid
            arms. Unknown/unsupported tokens are silently ignored (presentation hint, not part of the verdict contract); the
            default empty list renders nothing and the response is unchanged.'
        views:
          items:
            type: string
          type: array
          title: Views
          description: 'Opt-in Pipelex-API structured views: extra projections to attach to the 200 verdict. A supported token
            (`input_form`, `output_form`) adds a **same-named** top-level field to the valid arm only. Unknown/unsupported
            tokens are silently ignored (a view is a projection of facts the verdict already determined, not part of the verdict
            contract); the default empty list attaches nothing and the response is byte-identical to a request that omits
            the field. Independent of `render`: a request may carry both, each resolving its own tokens.'
        orchestration_mode:
          anyOf:
          - type: string
          - type: 'null'
          title: Orchestration Mode
          description: 'Optional per-request orchestration-mode (backend) override for the validation dispatch (same plumbing
            as `/start`). An OPEN string token: `direct` validates in-process; a `temporal` mode dispatches the whole job
            to a worker; any plugin-provided token is accepted and an unregistered one is refused at dispatch. Honored only
            when the deployment sets `allow_request_orchestration_mode_override = true` in its `api.toml`; otherwise a token
            that differs from the deployment default is refused with a 422 `pipelex.deployment.orchestration_override_forbidden`.
            Omitted → the default.'
        read_scope:
          anyOf:
          - type: string
          - type: 'null'
          title: Read Scope
          description: 'PIPELEX-API EXTENSION (not part of the MTHDS Protocol) — the scope the validation reads the method
            under, as a run''s `read_scope`: a multi-tenant host sends the one of the organization it serves. A hash entry
            of `files` resolves in that scope''s blob store, the tree the validation read is recorded there, and the runner
            hands the scope to its validator, so a validation dispatched to a worker hands it the method through that store.
            Omit it and a hash entry resolves in the caller''s own id''s store, but nothing is recorded and the validator
            is handed no scope, so a dry run without one leaves nothing stored.'
      type: object
      title: ValidateRequest
      description: 'The method to validate, in `files`, by `method_ref` or as `mthds_contents`, plus `allow_signatures` and
        optional per-file sources.


        `mthds_contents`, and the `mthds_sources` and `resources` that serve it, are being retired: a later release

        refuses them, and a method is sent in `files`, whose bundles are named by their tree paths.


        `mthds_sources`, when provided, pairs each `mthds_contents[i]` with a logical source (e.g. the

        file''s path relative to the submitted directory). The runner threads it onto

        `blueprint.source`, so the problem items in `errors` on a 200 `InvalidReport` carry a real

        `location.file` the client maps back to the owning file — without it the in-memory load path

        leaves the file unknown and cross-file diagnostics misfire. Omit it and behavior is unchanged.'
    ValidatedPipeEntry:
      properties:
        pipe_ref:
          type: string
          title: Pipe Ref
        status:
          $ref: '#/components/schemas/DryRunStatus'
      additionalProperties: true
      type: object
      required:
      - pipe_ref
      - status
      title: ValidatedPipeEntry
      description: 'One entry in the ``validated_pipes`` JSON envelope returned by the validate surfaces.


        The ``pipe_ref`` key carries the namespaced ``pipe_ref`` (``domain.code``) — never the bare code.

        ``status`` is a ``DryRunStatus`` (a ``StrEnum``), so it serializes to its plain string value.'
    WaterfallMatch:
      properties:
        category:
          $ref: '#/components/schemas/ModelCheckCategory'
          description: The category this entry is about.
        resolves_to:
          anyOf:
          - type: string
          - type: 'null'
          title: Resolves To
          description: The model handle a run through the reference would call now in this category, or null when it would
            find none (a target on a backend the runner has not enabled, a waterfall none of whose usable steps the runner
            serves, an alias cycle).
        fallbacks:
          items:
            type: string
          type: array
          title: Fallbacks
          description: The waterfall's steps, in order.
      additionalProperties: false
      type: object
      required:
      - category
      - resolves_to
      - fallbacks
      title: WaterfallMatch
      description: What a waterfall reference is in one category.
    WorkingMemory:
      properties:
        root:
          additionalProperties:
            $ref: '#/components/schemas/Stuff'
          type: object
          title: Root
        aliases:
          additionalProperties:
            type: string
          type: object
          title: Aliases
        absences:
          additionalProperties:
            $ref: '#/components/schemas/AbsenceRecord'
          type: object
          title: Absences
      additionalProperties: false
      type: object
      title: WorkingMemory
