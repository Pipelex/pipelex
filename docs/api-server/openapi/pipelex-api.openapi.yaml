    PresenceMarker:
      type: string
      enum:
      - plain
      - optional
      - force
      title: PresenceMarker
      description: 'The authored presence marker of a declared input slot, verbatim and three-valued.


        `plain` (no marker) and `force` (`!`) are the same requirement on the caller — the slot

        must be supplied — and differ only in what the author asserted; `optional` (`?`) means the

        caller may omit the slot and the pipe handles the absence itself. The distinction is kept on

        the wire because lint and graph surfaces read it, and a producer flattening it to a boolean

        would destroy it for every consumer at once. A consumer that only needs "may this be absent?"

        answers it as `is_optional`, in exactly one place.'
    PresetMatch:
      properties:
        category:
          $ref: '#/components/schemas/ModelCheckCategory'
          description: The category this entry is about.
        resolves_to:
          anyOf:
          - type: string
          - type: 'null'
          title: Resolves To
          description: The model handle a run through the reference would call now in this category, or null when it would
            find none (a target on a backend the runner has not enabled, a waterfall none of whose usable steps the runner
            serves, an alias cycle).
        target:
          type: string
          title: Target
          description: The model the deck binds the preset to, as the deck writes it, which may itself be a reference.
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: The preset's description, or null when the deck gives it none.
      additionalProperties: false
      type: object
      required:
      - category
      - resolves_to
      - target
      - description
      title: PresetMatch
      description: What a preset reference is in one category.
    ProblemDeleteKeyOp:
