      description: "The MTHDS problem document with Pipelex's members.\n\nAttributes:\n    request_id: The request that carried\
        \ the failure, when known.\n    run_error: On a read of a failed run's results, the run's own problem.\n    diagnostics:\
        \ What only an operator reads; present in the operator view alone."
    PipelexVersionInfo:
      properties:
