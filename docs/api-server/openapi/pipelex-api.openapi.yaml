            $ref: '#/components/schemas/MigrationStep'
          type: array
          title: Steps
        blocked:
          items:
            $ref: '#/components/schemas/BlockedEntry'
          type: array
          title: Blocked
        unexplained:
          items:
            $ref: '#/components/schemas/UnexplainedPath'
          type: array
          title: Unexplained
        backup_path:
          anyOf:
          - type: string
            format: path
          - type: 'null'
          title: Backup Path
        was_written:
          type: boolean
          title: Was Written
          default: false
      additionalProperties: false
      type: object
      required:
      - surface_id
      - file_path
      title: MigrationPlan
      description: What one file needs, and what this run did to it.
    MigrationSafety:
      type: string
      enum:
      - safe
      - unsafe
      title: MigrationSafety
      description: 'Whether the applier may act on an entry.


        Independent of `guidance`, which any entry may carry whatever its safety.'
    MigrationStep:
      properties:
        entry_id:
          type: string
          title: Entry Id
        to_schema_version:
