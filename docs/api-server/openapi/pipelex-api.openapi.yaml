          title: Files
          description: Inline MTHDS bundles forming the closure to resolve (content-passing — no server-side path reads).
        method_ref:
          anyOf:
          - type: string
            maxLength: 512
            minLength: 1
          - type: 'null'
          title: Method Ref
          description: Reference to a published method, resolving to its package's `.mthds` files. Address form (`github.com/<owner>/<repo>[/<selector>][@<tag>]`)
            is fetched and resolved server-side; the registry form stays reserved (501 until a method registry exists).
        pipe_ref:
          anyOf:
          - type: string
            maxLength: 256
            minLength: 1
          - type: 'null'
          title: Pipe Ref
          description: Qualified pipe ref (`domain.pipe_code`) to select. Optional — defaults to the fetched package manifest's
            `main_pipe` on a `method_ref` request, else to the closure's declared `main_pipe`; a closure declaring none, or
            several, with no manifest `main_pipe` to settle it, requires it unless `all_pipes` is set.
        all_pipes:
          type: boolean
          title: All Pipes
          description: 'Describe every pipe the closure loads instead of the selected one. The artifact maps are then keyed
            by every pipe, and the route never refuses for want of an entry pipe: `pipe_ref` on the valid arm is the requested
            ref, else the method''s own entry pipe, else `null`.'
          default: false
        include_files:
          type: boolean
          title: Include Files
          description: 'Echo the resolved closure''s `.mthds` files on the valid arm, in the request''s own `files[]` shape:
            the request''s files for inline `files[]`, the fetched package''s `.mthds` files under their package-relative
            paths for a `method_ref`. Absent from the response unless true.'
          default: false
      type: object
      title: PipeIORequest
      description: 'The pipe I/O request: the crate routes'' closure selector and pipe selector, plus the whole-method and
        echo opt-ins.


        The hosted catalog selector is replaced by `files` before the request reaches the runner, so this

        request has no field for it. It takes no `views` either, since the valid arm always carries all

        three artifacts.'
    PipeIOValidReport:
      properties:
        is_valid:
          type: boolean
          const: true
          title: Is Valid
          default: true
        pipe_ref:
          anyOf:
