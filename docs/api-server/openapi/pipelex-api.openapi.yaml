    ModelCategory:
      type: string
      enum:
      - llm
      - extract
      - img_gen
      - search
      - judgment
      title: ModelCategory
      description: 'The protocol''s model categories: what a deck entry''s `type` reports and the `GET /models?type=` filter
        accepts.


        A category is a settings family of the language — the inline settings a model

        serves, and so the pipes that can name it: `llm` (`LLMSetting`, named by

        `PipeLLM` and `PipeStructure`), `extract` (`ExtractSetting`, `PipeExtract`),

        `img_gen` (`ImgGenSetting`, `PipeImgGen`), `search` (`SearchSetting`,

        `PipeSearch`) and `judgment` (`JudgmentSetting`, `PipeJudge`). A settings

        family the standard adds brings a category in the next protocol minor.'
    ModelCheckCategory:
      type: string
      enum:
      - llm
      - extract
      - img_gen
      - search
      - judgment
      - doc_gen
      title: ModelCheckCategory
      description: 'The categories the model reference check covers, in the order every list it returns follows.


        These are the MTHDS Protocol''s model categories, in the protocol''s order, then `doc_gen`, the family

        of `PipeDocGen`. The protocol defines no category for `doc_gen`, so the model listing leaves it out,

        but a method names a `doc_gen` model in its `model` field like any other, so the check covers it.'
    ModelInfo:
      properties:
        name:
          type: string
          title: Name
        type:
          anyOf:
          - $ref: '#/components/schemas/ModelCategory'
          - type: string
          - type: 'null'
          title: Type
      additionalProperties: true
      type: object
      required:
      - name
      title: ModelInfo
      description: 'One entry of the model deck (`ModelDeck.models[]`) — base fields + extensions.


        `type` is an open read of the entry''s category, under the protocol''s reader

        rule: "A client reading a model list MUST NOT fail it because an entry carries

        a category it does not recognize; it keeps that entry with its raw value or

        leaves it out." This package keeps it: a category it knows reads as its

        `ModelCategory` member, and one it does not — a category a runner of a later

        protocol minor reports — keeps its raw string, so a consumer handles the

        `str` case rather than the whole deck failing. The union is validated left to

        right on purpose: pydantic''s default smart mode would keep every string,

        known or not, as a plain `str`.'
    ModelReference:
      type: string
    ModelReferenceKind:
      type: string
      enum:
      - preset
      - alias
      - waterfall
      - handle
      title: ModelReferenceKind
      description: The kind of model reference.
    ModelReferenceResolution:
      type: string
      enum:
      - resolved
      - not_found
      title: ModelReferenceResolution
      description: Whether a reference resolves in a category in scope. Both values are definitive.
    ModelReferenceVerdict:
      properties:
        reference:
          type: string
          title: Reference
          description: The caller's reference, trimmed.
        kind:
          $ref: '#/components/schemas/ModelReferenceKind'
          description: What the reference names, from its parsing.
        name:
          type: string
          title: Name
          description: The reference without its sigil or namespace.
        category:
          anyOf:
          - $ref: '#/components/schemas/ModelCheckCategory'
          - type: 'null'
          description: The `type` asked, or null when none was.
        resolution:
          $ref: '#/components/schemas/ModelReferenceResolution'
          description: Whether the reference resolves in a category in scope.
        matches:
          items:
            anyOf:
            - $ref: '#/components/schemas/PresetMatch'
            - $ref: '#/components/schemas/AliasMatch'
            - $ref: '#/components/schemas/WaterfallMatch'
            - $ref: '#/components/schemas/HandleMatch'
          type: array
          title: Matches
          description: One entry per category in scope where the reference resolves, in the order of the categories the check
            covers.
        suggestions:
          items:
            type: string
          type: array
          title: Suggestions
          description: On `not_found`, the nearest names the caller may have meant; empty when it is `resolved`.
        other_kinds:
          items:
            type: string
          type: array
          title: Other Kinds
          description: On `not_found`, the same name under another kind, in the categories in scope; empty when it is `resolved`.
        other_categories:
          items:
            $ref: '#/components/schemas/ModelCheckCategory'
          type: array
          title: Other Categories
          description: On `not_found` with a `type`, the categories outside it where the same reference resolves; empty otherwise.
      additionalProperties: false
      type: object
      required:
      - reference
      - kind
      - name
      - category
      - resolution
      - matches
      - suggestions
      - other_kinds
      - other_categories
      title: ModelReferenceVerdict
      description: The verdict of the model reference check, discriminated on `resolution`.
    ModelUsageSpec:
      properties:
        inference_model_name:
          type: string
          title: Inference Model Name
        inference_model_id:
          type: string
          title: Inference Model Id
        model_type:
          type: string
          title: Model Type
        inference_calls:
          type: integer
          title: Inference Calls
          default: 0
        rated_inference_calls:
          type: integer
          title: Rated Inference Calls
          default: 0
        cost:
          anyOf:
          - type: number
          - type: 'null'
          title: Cost
      additionalProperties: false
      type: object
      required:
      - inference_model_name
      - inference_model_id
      - model_type
      title: ModelUsageSpec
      description: 'What one inference model actually did for a node.


        This is the only place the graph records the model that **ran**. Everything else

        in a GraphSpec that names a model records what was *asked for*:

        ``execution_data.resolved_model`` holds the handle the pipe resolved to — which may

        still be an alias (``@default-premium``) — and the pipe blueprint holds the authored

        choice (``$writing-factual``). Those are three rungs of one ladder, and only this

        rung is the outcome: it survives alias resolution, deck defaults, and any fallback

        or retry that landed somewhere other than what was requested.


        A node genuinely uses more than one model in ordinary cases — a ``PipeLLM``''s text

        pass and its object-structuring pass resolve separately — so a node''s models are a

        LIST. Collapsing them to "the model" would be wrong in exactly the way a single

        ``cost`` for mixed rated/unrated calls is wrong.


        ``cost`` follows ``NodeUsageSpec`` invariant 2: ``None`` iff no call to this model

        carried a rate table.'
    MoveKeyOp:
      properties:
        table_path:
          items:
            type: string
          type: array
          title: Table Path
        kind:
          type: string
          const: move_key
          title: Kind
          default: move_key
        key:
          type: string
          title: Key
        new_table_path:
          items:
            type: string
          type: array
          title: New Table Path
        new_key:
          type: string
          title: New Key
      additionalProperties: false
      type: object
      required:
      - table_path
      - key
      - new_table_path
      - new_key
      title: MoveKeyOp
      description: 'Relocate ``key`` from the addressed table into ``new_table_path``, under ``new_key``.


        The moved key may be table-valued, in which case the whole subtree travels. Destination

        parents that do not exist are created, as block tables, as part of the operation. Position

        is preserved within a parent and never across parents — see ``docs/migration-ledger.md``

        for the placement rule and for what happens to a moved table''s introducing comment.'
    NextStep:
      properties:
        kind:
          anyOf:
          - $ref: '#/components/schemas/StepKind'
          - type: string
          title: Kind
        detail:
          type: string
          title: Detail
      additionalProperties: true
      type: object
      required:
      - kind
      - detail
      title: NextStep
      description: 'What the reader should do next: a kind from the protocol''s closed list, and the step in one sentence.'
