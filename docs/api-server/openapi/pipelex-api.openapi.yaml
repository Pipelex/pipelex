      title: ProblemDiagnostics
      description: "What only an operator reads of a problem: the operator view's ``diagnostics`` member.\n\nAttributes:\n\
        \    error_class: The class of the error the problem was built from, the identity ``error_type`` once was.\n    message:\
        \ The error's own message, capped.\n    causes: The errors below it on its cause chain, by class and code.\n    params:\
        \ The parameters the code declares operator-only.\n    model: The model a failed inference call addressed.\n    provider:\
        \ What the provider said about the call.\n    migration: A pending configuration migration that explains the failure.\n\
        \    runtime_version: The version of the Pipelex runtime that built the problem.\n    trace_id: The trace of the Pipelex\
        \ span the failure happened in.\n    span_id: That span."
    ProblemDocument:
      properties:
        type:
          type: string
          title: Type
          description: 'Stable URI of the documentation page of the error''s `code`: `https://mthds.ai/errors/<code>` for
            a core code, `https://docs.pipelex.com/errors/<code>` for a Pipelex code.'
        title:
          type: string
          title: Title
          description: 'Short, human-readable summary: the title of the error''s `code`.'
        status:
          type: integer
          title: Status
          description: 'HTTP status code, repeated in the body per RFC 9457: the status its `code` declares.'
        detail:
          type: string
          title: Detail
          description: 'Human-readable explanation of this specific failure, rendered from its code''s template and parameters.
            Never parsed: a program branches on `code`.'
        code:
          type: string
          title: Code
          description: 'Registry code of the error, what a client branches on: a core code of the MTHDS standard (e.g. `request.invalid`)
            or a Pipelex code (e.g. `pipelex.config.invalid`).'
        domain:
          type: string
          title: Domain
          description: 'Who must act, the code''s domain: `input`, `method`, `account`, `operator` or `runtime`.'
        retry:
          type: string
          title: Retry
          description: 'Whether repeating the request can succeed, the code''s verdict: `yes`, `no` or `outcome_unknown`.'
        retry_after:
          anyOf:
          - type: number
          - type: 'null'
          title: Retry After
          description: Seconds to wait before a retry, when known, on a code whose verdict is `yes`.
        next_step:
          $ref: '#/components/schemas/NextStep'
          description: 'What the reader should do next: a kind and a sentence, aimed at the caller, or at the operator in
            the operator view.'
        params:
          anyOf:
          - $ref: '#/components/schemas/ProblemParams'
          - type: 'null'
          description: The code's typed parameters, the ones its templates are rendered with.
        location:
          anyOf:
          - $ref: '#/components/schemas/ProblemLocation'
          - type: 'null'
          description: 'Where the failure happened: the failing pipe and its path from the entry pipe, an input, a field,
            a file.'
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/ProblemItem'
            type: array
          - type: 'null'
          title: Errors
          description: One item per fault, for a refusal with several, such as a request whose fields the route refuses. On
            `/validate`, `/resolve`, `/codegen` and `/pipe-io` an invalid bundle is a **200** verdict instead, whose `errors`
            are items of this same shape.
        pipeline_run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Pipeline Run Id
          description: The run the failure belongs to.
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: 'Correlation id, echoed in the `X-Request-ID` response header: the caller''s own when valid, else one
            the runner mints.'
        diagnostics:
          anyOf:
          - $ref: '#/components/schemas/ProblemDiagnostics'
          - type: 'null'
          description: 'What only the operator reads: the error''s class and message, its causes, the provider''s answer,
            the model. Present only when the request was authenticated as the operator''s (`AUTH_MODE=api_key`, or a trusted
            proxy).'
      additionalProperties: true
      type: object
      required:
      - type
      - title
      - status
      - detail
      - code
      - domain
      - retry
      - next_step
      title: ProblemDocument
      description: 'An RFC 9457 `application/problem+json` error body — the shape of every failure response.


        Every failure answers its problem document: the RFC''s members (`type`, `title`, `status`, `detail`), the MTHDS

        core''s (`code`, `domain`, `retry`, `next_step`, always present, and `retry_after`, `params`, `location`, `errors`,

        `pipeline_run_id` when they hold a value) and Pipelex''s (`request_id`, always present on a response of this server,

        and `diagnostics` in the operator view alone). No member is ever written as `null`: a member with no value is

        absent. `extra="allow"` mirrors RFC 9457''s open-ended extension-member rule.'
    ProblemDomain:
      type: string
      enum:
      - input
      - method
      - account
      - operator
      - runtime
