          - $ref: '#/components/schemas/MigrationErrorBlock'
          - type: 'null'
        runtime_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Runtime Version
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
        span_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Span Id
      additionalProperties: true
      type: object
      required:
