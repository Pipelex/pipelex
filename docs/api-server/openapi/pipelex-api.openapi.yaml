          description: 'The method as a map of file entries, the MTHDS standard''s form of a method tree that travels: each
            key is a tree path (relative, forward slashes, in Unicode NFC, no `.` or `..` segment, no segment starting with
            a dot), and each value is the file''s UTF-8 text, `{"base64": ...}` holding its bytes, or `{"sha256": ..., "size":
            ...}` naming bytes this runner already holds (uploaded with `POST /v1/blobs/missing` then `PUT /v1/blobs/{sha256}`).
            The map is read from the request''s JSON text: a key given twice, a key the membership rule keeps out of every
            tree (`.mthds/` included) and colliding keys are a 422 `method.package_invalid` whose `reason` is the refusal''s
            code and whose `path` names the first path, a key leaving the tree is a 422 `security.input_path_refused`, a malformed
            entry is a 422 `request.invalid`, and hash entries the runner does not hold are one 422 `request.blobs_missing`
            whose `missing_blobs` parameter lists every such hash. Its `.mthds` files are the method''s bundles and every
            other file is one a step may read, such as a `PipeDocGen` template or a `PipeFunc` module. With no `pipe_code`,
            the run starts at the `main_pipe` of the `METHODS.toml` at the tree''s root, or else at the one `main_pipe` its
            bundles declare. Custom `.py` is only honored on a sandbox-hosted deployment. Exactly one of `files` / `method_ref`.'
