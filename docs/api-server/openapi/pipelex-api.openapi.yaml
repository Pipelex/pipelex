          title: Input Form
          description: The standard's input-form descriptors, keyed by qualified `pipe_ref`.
        output_form:
          additionalProperties:
            $ref: '#/components/schemas/PipeOutputFormDescriptor'
          type: object
          title: Output Form
          description: The standard's output-form descriptors, keyed by qualified `pipe_ref`.
        default_pipe_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Default Pipe Ref
          description: 'The method''s own entry pipe: the selection chain without the request''s `pipe_ref` — the fetched
            package manifest''s `main_pipe`, else the closure''s single `main_pipe` declaration. A stated `null` when that
            chain finds none or several. Not `/validate`''s field of the same name, which is the run default.'
        pending_signatures:
          items:
            type: string
          type: array
          title: Pending Signatures
          description: The qualified refs of every pipe of the closure still declared as a signature, exactly as on `/validate`.
        is_runnable:
          type: boolean
          title: Is Runnable
          description: '`not pending_signatures`, exactly as on `/validate`. No dry run backs it.'
        files:
          items:
            $ref: '#/components/schemas/MthdsFileItem'
          type: array
          title: Files
          description: 'The resolved closure''s `.mthds` files, in the request''s `files[]` shape. Present only with `include_files:
            true`.'
