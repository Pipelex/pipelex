        description: 'The model reference as a method''s `model` field writes it: `$preset`, `@alias`, `~waterfall`, a bare
          model handle, or one of the namespaces `preset:`, `alias:`, `waterfall:` and `handle:`. Surrounding whitespace is
          ignored, and the trimmed reference holds at most 199 characters. Single value.'
