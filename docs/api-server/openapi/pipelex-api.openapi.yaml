      title: PipeIOArtifacts
      description: 'The validate report''s three I/O artifacts, under the report''s names and types.


        A grouping, not a new shape: each field is the standard''s artifact, keyed by `pipe_ref`.'
    PipeIOContract:
      properties:
        inputs:
          additionalProperties:
            $ref: '#/components/schemas/PipeInputContract'
          type: object
          title: Inputs
        output:
          $ref: '#/components/schemas/PipeOutputContract'
      additionalProperties: false
      type: object
      required:
      - inputs
      - output
      title: PipeIOContract
      description: 'The contract of one pipe — one `pipe_io_contracts` entry, with both members required.


        `inputs` is a map from authored input name to input contract, and it deliberately contracts no

        order: an ordered view of a pipe''s inputs is the input-form descriptor''s job, which keeps this

        artifact byte-stable whatever a renderer needs. A pipe with no declared inputs carries

        `inputs: {}` — a stated fact, never an omitted member. Closed shape (`extra="forbid"`).'
    PipeIORequest:
      properties:
        files:
          anyOf:
          - additionalProperties:
              anyOf:
              - type: string
              - $ref: '#/components/schemas/Base64FileEntry'
              - $ref: '#/components/schemas/HashFileEntry'
            type: object
          - type: 'null'
          title: Files
          description: 'The method as a map of file entries, the MTHDS standard''s form of a method tree that travels: each
            key is a tree path (relative, forward slashes, in Unicode NFC, no `.` or `..` segment, no segment starting with
            a dot), and each value is the file''s UTF-8 text, `{"base64": ...}` holding its bytes, or `{"sha256": ..., "size":
            ...}` naming bytes this runner already holds (uploaded with `POST /v1/blobs/missing` then `PUT /v1/blobs/{sha256}`).
            The map is read from the request''s JSON text: a key given twice, a key the membership rule keeps out of every
            tree (`.mthds/` included) and colliding keys are a 422 `method.package_invalid` whose `reason` is the refusal''s
            code and whose `path` names the first path, a key leaving the tree is a 422 `security.input_path_refused`, a malformed
            entry is a 422 `request.invalid`, and hash entries the runner does not hold are one 422 `request.blobs_missing`
            whose `missing_blobs` parameter lists every such hash. Its `.mthds` files are the method''s bundles and every
            other file is one a step may read, such as a `PipeDocGen` template or a `PipeFunc` module. With no `pipe_code`,
            the run starts at the `main_pipe` of the `METHODS.toml` at the tree''s root, or else at the one `main_pipe` its
            bundles declare. Custom `.py` is only honored on a sandbox-hosted deployment. Exactly one of `files` / `method_ref`.'
        dependencies:
          anyOf:
          - additionalProperties:
              additionalProperties:
                anyOf:
                - type: string
                - $ref: '#/components/schemas/Base64FileEntry'
                - $ref: '#/components/schemas/HashFileEntry'
              type: object
            type: object
          - type: 'null'
          title: Dependencies
          description: 'PIPELEX-API EXTENSION (not part of the MTHDS Protocol) — the method packages the method calls by address
            that this runner cannot fetch, such as one an author has not published, as `{"<address>": <map of file entries>}`:
            each value is a tree of its own, read as `files` is, with a `METHODS.toml` at its root declaring the address it
            is keyed by. They are searched before the runner''s installed copies, for this request alone. Accompanies `files`.'
        method_ref:
          anyOf:
          - type: string
            maxLength: 512
            minLength: 1
          - type: 'null'
          title: Method Ref
          description: PIPELEX-API EXTENSION (not part of the MTHDS Protocol) — a published method by reference, instead of
            its tree. Address form (`github.com/<owner>/<repo>[/<selector>][@<tag>]`) is fetched and read as a `files` tree
            is, through the same path as a `method_ref` run; the registry form stays reserved (a 422 `request.unsupported`
            until a method registry exists). Exactly one of `files` / `method_ref`.
        resources:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Resources
          description: 'The files submitted with the bundle that its steps read, such as a PipeDocGen step''s `template_file`
            (an `.xlsx`, `.docx`, `.pptx` or `.html` template): a JSON object mapping each file''s bundle-relative path, exactly
            as the step names it, to the file''s bytes in standard base64. A path must be relative and written with forward
            slashes, with no `..` segment, backslash or colon. Beside inline `mthds_contents`, every bundle of the request
            is read as sitting in one directory, and every file must be named by a step, or the request is refused with a
            422 `BundleResourceNotNamedError`. Beside a method tree, `files` or `bundle_b64`, each file joins the tree at
            its path from the tree''s root, where a file the tree already holds must have the same bytes. By default at most
            32 files, 5120 KiB each and 10240 KiB in all, decoded; a deployment sets its own with `MAX_RESOURCES_PER_REQUEST`,
            `MAX_RESOURCE_FILE_KIB` and `MAX_RESOURCES_TOTAL_KIB`. The files make one method tree with the bundles, which
            the run names by its digest: no file''s bytes travel with the run, each being read where a step uses it. Being
            retired, and refused by a later release: a file the steps read travels inside the method''s tree, in `files`,
            at its path beside the bundle that names it.'
        read_scope:
          anyOf:
          - type: string
          - type: 'null'
          title: Read Scope
          description: 'PIPELEX-API EXTENSION (not part of the MTHDS Protocol) — the scope the request reads the method under,
            as a run''s `read_scope`: a multi-tenant host sends the one of the organization it serves. A hash entry of `files`
            resolves in that scope''s blob store, and the tree the request read is recorded there, so a later request can
            send it by hash. Omit it and a hash entry resolves in the caller''s own id''s store, and nothing is recorded.'
        pipe_ref:
          anyOf:
          - type: string
            maxLength: 256
            minLength: 1
          - type: 'null'
          title: Pipe Ref
          description: Qualified pipe ref (`domain.pipe_code`) to select. Optional — defaults to the `main_pipe` of the `METHODS.toml`
            at the method tree's root, else to the closure's declared `main_pipe`; a closure declaring none, or several, with
            no manifest `main_pipe` to settle it, requires it unless `all_pipes` is set.
        all_pipes:
          type: boolean
          title: All Pipes
          description: 'Describe every pipe the closure loads instead of the selected one. The artifact maps are then keyed
            by every pipe, and the route never refuses for want of an entry pipe: `pipe_ref` on the valid arm is the requested
            ref, else the method''s own entry pipe, else `null`.'
          default: false
        include_files:
          type: boolean
          title: Include Files
          description: 'Echo the method''s `.mthds` bundles on the valid arm, as a map of file entries in the request''s own
            `files` shape, each bundle''s tree path to its text: the bundles of the tree sent in `files`, whatever entry carried
            them, or those of the fetched package''s tree for a `method_ref`. Its other files and its dependencies are not
            echoed. Absent from the response unless true.'
          default: false
      type: object
      title: PipeIORequest
      description: 'The pipe I/O request: the crate routes'' method selector and pipe selector, plus the whole-method and
        echo opt-ins.


        The hosted catalog selector is replaced by `files` before the request reaches the runner, so this

        request has no field for it. It takes no `views` either, since the valid arm always carries all

        three artifacts.'
    PipeIOValidReport:
      properties:
        is_valid:
          type: boolean
          const: true
          title: Is Valid
          default: true
        pipe_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Pipe Ref
          description: The qualified `domain.pipe_code` the selection resolved, read back off the resolved pipe and never
            echoed from the request. `null` only under `all_pipes` when no pipe was requested and the method declares no single
            entry pipe.
        pipe_io_contracts:
          additionalProperties:
            $ref: '#/components/schemas/PipeIOContract'
          type: object
          title: Pipe Io Contracts
          description: The standard's pipe I/O contracts, keyed by qualified `pipe_ref`.
        input_form:
          additionalProperties:
