[project]
name = "pipelex"
version = "0.15.7"
description = "The open standard for repeatable AI workflows. Write business logic, not API calls."
authors = [{ name = "Evotis S.A.S.", email = "oss@pipelex.com" }]
maintainers = [{ name = "Pipelex staff", email = "oss@pipelex.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "aiofiles>=23.2.1",
    "backports.strenum>=1.3.0 ; python_version < '3.11'",
    "filetype>=1.2.0",
    "httpx>=0.23.0,<1.0.0",
    "instructor>=1.8.3,!=1.11.*,!=1.12.*",                # 1.11.x caused typing errors with mypy
    "jinja2>=3.1.4",
    "json2html>=1.3.0",
    "kajson==0.3.1",
    "markdown>=3.6",
    "networkx>=3.4.2",
    "openai>=1.108.1",
    "pillow>=11.2.1",
    "polyfactory>=2.21.0",
    "posthog>=6.7.0",
    "pypdfium2>=4.30.0,!=4.30.1",
    "pydantic>=2.10.6,<3.0.0",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.2",
    "rich>=13.8.1",
    "shortuuid>=1.0.13",
    "tomli>=2.3.0",
    "tomlkit>=0.13.2",
    "typer>=0.16.0",
    "typing-extensions>=4.13.2",
    "yattag>=1.15.2",
]

[project.urls]
Homepage = "https://pipelex.com"
Repository = "https://github.com/Pipelex/pipelex"
Documentation = "https://docs.pipelex.com/"
Changelog = "https://docs.pipelex.com/changelog/"

[project.scripts]
pipelex = "pipelex.cli._cli:app"
pipelex-dev = "pipelex.cli.dev_cli._dev_cli:app"

[project.optional-dependencies]
anthropic = ["anthropic>=0.60.0"]
bedrock = ["boto3>=1.34.131", "aioboto3>=13.4.0"]
fal = ["fal-client>=0.4.1"]
google = ["google-auth-oauthlib>=1.2.1"]
google-genai = ["google-genai", "instructor[google-genai]"]
mistralai = ["mistralai==1.5.2"]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-glightbox==0.4.0",
    "mkdocs-material==9.6.14",
    "mkdocs-meta-manager==1.1.0",
]

dev = [
    "boto3-stubs>=1.35.24",
    "mypy>=1.11.2",
    "pyright>=1.1.405",
    "pylint>=3.3.8",
    "pytest>=9.0.1",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.0",
    "pytest-sugar>=1.0.0",
    "pytest-xdist>= 3.6.1",
    "ruff>=0.6.8",
    "types-aioboto3[bedrock,bedrock-runtime]>=13.4.0",
    "types-aiofiles>=24.1.0.20240626",
    "types-markdown>=3.6.0.20240316",
    "types-networkx>=3.3.0.20241020",
    "types-PyYAML>=6.0.12.20250326",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.7.2"
