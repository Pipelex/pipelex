################################################################################
# Profiles
################################################################################

################################################################################
# CI Profile - Minimal set for CI (no actual inference)
################################################################################
[profiles.ci]
description = "Minimal set for CI - no actual inference"
backends = ["azure_openai"]
llm_models = ["gpt-4o-mini"]
img_gen_models = []
extract_models = []
search_models = []

################################################################################
# Dev Profile
################################################################################
[profiles.dev]
description = "Quick dev testing with fast and cheap models from key providers"
backends = ["pipelex_gateway", "internal"]
llm_models = [
  "claude-4.5-haiku",
  "gpt-4o-mini",
  "linkup",
  "gemini-2.5-flash-lite",
]
img_gen_models = ["gpt-image-1-mini"]
extract_models = ["@from_pdf", "linkup-fetch"]
search_models = ["linkup-standard"]

################################################################################
# Coverage Profile
################################################################################
[profiles.coverage]
description = "One model per backend for coverage"
backends = ["anthropic", "openai", "google", "mistral", "linkup", "internal"]
llm_models = [
  "claude-4.5-haiku",
  "gpt-4o-mini",
  "gemini-2.5-flash-lite",
  "mistral-large",
]
img_gen_models = ["gpt-image-1", "nano-banana"]
extract_models = ["pypdfium2-extract-pdf"]
search_models = ["linkup-standard"]

################################################################################
# Claude Latest Profile
################################################################################
[profiles.claude_latest]
description = "All Claude 4.5 models"
backends = ["anthropic", "pipelex_gateway"]
llm_models = ["claude-4.5-*"]
img_gen_models = []
extract_models = []
search_models = []

################################################################################
# GPT No Codex Profile
################################################################################
[profiles.gpt_no_codex]
description = "All GPT models except codex variants"
backends = ["openai", "pipelex_gateway"]
llm_models = ["gpt-*", "!*-codex", "!*-codex-*"]
img_gen_models = ["gpt-image-*"]
extract_models = []
search_models = []

################################################################################
# All Backends Profile - Test across all backends with select models
################################################################################
[profiles.all_backends]
description = "Test select models across all backends"
backends = ["@all"]
llm_models = ["claude-4.5-haiku", "gpt-4o-mini", "gemini-2.5-flash-lite"]
img_gen_models = ["gpt-image-1-mini"]
extract_models = ["@from_pdf"]
search_models = ["@linkup"]

################################################################################
# Full Profile - All available models (use with caution)
################################################################################
[profiles.full]
description = "All available models"
include_all = true

