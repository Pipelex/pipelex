################################################################################
# Test Profiles Configuration
################################################################################
#
# This file defines test profiles for controlling which models are included
# in parametrized tests. Select a profile using TEST_PROFILE when running make.
#
# Usage:
#   make regenerate-test-models                    # Use dev profile (default)
#   make regenerate-test-models TEST_PROFILE=full  # Use full profile
#   make regenerate-test-models TEST_PROFILE=ci    # Use CI profile
#
# Or use the CLI directly:
#   pipelex-dev preprocess-test-models --generate-fixtures --profile <name>
#
# Model List Syntax:
#   - "model-name"      : Specific model (direct reference)
#   - "@collection_name": All models from named collection (static)
#   - "backend:*"       : All models available from that backend (dynamic)
#   - "gpt-*", "claude-*": Glob pattern matching model names (dynamic)
#   - "*"               : All available models (same as include_all=true)
#   - "!pattern"        : Exclude models matching pattern (negation)
#
################################################################################

