[package]
address = "github.com/acme/contract-analysis"
version = "1.0.0"
description = "Contract analysis and scoring methods"
authors = ["Acme Corp"]
license = "MIT"
mthds_version = ">=0.5.0"

[dependencies]
shared_scoring = { address = "github.com/acme/scoring-methods", version = "^2.0.0" }

[exports.legal.contracts]
pipes = ["extract_clause", "analyze_contract"]

[exports.scoring]
pipes = ["compute_weighted_score"]
