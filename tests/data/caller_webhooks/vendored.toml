# The known-answer vectors of the caller-webhook contract, copied verbatim from Pipelex's `conformance`
# repository, which specifies the `run.finished` event a runner sends a run's caller, and never edited here.
#
# - `signature-vectors.json` is copied from `tests/caller_webhooks/fixtures/signature-vectors.json` in that
#   repository, at the commit below. Its `signing` cases are calls as a sender signs them: the runner's test
#   (`tests/unit/pipelex/tools/network/test_standard_webhooks.py`) signs each one and compares the
#   `webhook-signature` header byte for byte, so the runner signs exactly as the contract's reference
#   library does. Its `verification` cases are calls as a receiver checks them; pipelex only sends caller
#   webhooks and verifies none, so no test here reads them, and they are copied only to keep the file whole.
#
# To refresh it, copy the file from the conformance repository at the commit that last changed it, then
# update the commit and the digest below. A test fails when the file no longer has the digest recorded here.
# The conformance repository holds the guard that tells this copy has fallen behind (L-261029-2f9dbb).

