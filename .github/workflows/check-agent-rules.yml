name: Check Agent Rules Synca

on:
  pull_request:

jobs:
  check-agent-rules:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync

      - name: Run pipelex kit rules
        run: |
          source .venv/bin/activate
          pipelex kit rules

      - name: Check for file changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ Agent rule files are out of sync!"
            echo ""
            echo "The following files have been modified:"
            git status --porcelain
            echo ""
            echo "Changed content:"
            git diff
            echo ""
            echo "Please run 'pipelex kit rules' locally and commit the changes."
            exit 1
          else
            echo "✅ Agent rule files are up-to-date!"
          fi

