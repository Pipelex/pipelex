name: Deploy docs

on:
  push:
    branches:
      - main
      - pre-release/v*

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for mike to access git history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check UV installation
        run: make check-uv

      - name: Verify UV installation
        run: uv --version

      - name: Install dependencies
        run: make install

      - name: Install docs dependencies
        run: uv pip install -e ".[docs]"

      - name: Configure git for mike
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy documentation
        run: |
          source .venv/bin/activate
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "Deploying stable docs..."
            make docs-deploy-stable
          elif [[ "${{ github.ref }}" == refs/heads/pre-release/* ]]; then
            echo "Deploying pre-release docs..."
            make docs-deploy-specific-version
          fi
