name: Lint check

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
# --------------------------------------------------------------------------
# 1.  Ruff — single job (target-version = min supported, set in pyproject.toml)
# --------------------------------------------------------------------------
  lint-ruff-plxt:
    name: Lint (ruff + plxt)
    runs-on: [aca-runner-lint]
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      - name: Run ruff format merge check
        run: make merge-check-ruff-format

      - name: Run ruff lint merge check
        run: make merge-check-ruff-lint

      - name: Run plxt format merge check
        run: make merge-check-plxt-format

      - name: Run plxt lint merge check
        run: make merge-check-plxt-lint

# --------------------------------------------------------------------------
# 2.  Type checking — matrix over supported Python versions
# --------------------------------------------------------------------------
  lint-typecheck:
    name: Typecheck (py${{ matrix.python-version }})
    runs-on: [aca-runner-lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      - name: Run pyright merge check (Python ${{ matrix.python-version }})
        run: LINT_PYTHON_VERSION=${{ matrix.python-version }} make merge-check-pyright

      - name: Run mypy merge check (Python ${{ matrix.python-version }})
        run: LINT_PYTHON_VERSION=${{ matrix.python-version }} make merge-check-mypy

# --------------------------------------------------------------------------
# 3.  Config sync — single job, version-independent
# --------------------------------------------------------------------------
  lint-config-sync:
    name: Lint (config-sync)
    runs-on: [aca-runner-lint]
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      - name: Run config sync check
        run: make check-config-sync

# --------------------------------------------------------------------------
# 4.  Keyword-only convention — single job, version-independent
# --------------------------------------------------------------------------
  lint-keyword-only:
    name: Lint (keyword-only)
    runs-on: [aca-runner-lint]
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      - name: Run keyword-only convention check
        run: make check-keyword-only

# --------------------------------------------------------------------------
# 5.  Aggregator job — the *single* required status check
# --------------------------------------------------------------------------
  lint-all:
    name: Lint (all)
    runs-on: ubuntu-latest
    needs: [lint-ruff-plxt, lint-typecheck, lint-config-sync, lint-keyword-only]
    if: always()

    steps:
      - name: Fail if any lint job failed
        run: |
          if [ "${{ needs.lint-ruff-plxt.result }}" != "success" ] || \
             [ "${{ needs.lint-typecheck.result }}" != "success" ] || \
             [ "${{ needs.lint-config-sync.result }}" != "success" ] || \
             [ "${{ needs.lint-keyword-only.result }}" != "success" ]; then
            echo "::error::At least one lint job failed."
            exit 1
          fi
          echo "All lint jobs passed."
