name: Lint check

on:
  pull_request:

jobs:
# --------------------------------------------------------------------------
# 1.  Parallel lint jobs — all on Python 3.11 (lint tools hard-target 3.11)
# --------------------------------------------------------------------------
  lint-ruff:
    name: Lint (ruff)
    runs-on: [aca-runner-lint]
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      - name: Run ruff format merge check
        run: make merge-check-ruff-format

      - name: Run ruff lint merge check
        run: make merge-check-ruff-lint

  lint-pyright:
    name: Lint (pyright)
    runs-on: [aca-runner-lint]
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      - name: Run pyright merge check
        run: make merge-check-pyright

  lint-mypy:
    name: Lint (mypy)
    runs-on: [aca-runner-lint]
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      - name: Run mypy merge check
        run: make merge-check-mypy

  lint-config-sync:
    name: Lint (config-sync)
    runs-on: [aca-runner-lint]
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      - name: Run config sync check
        run: make check-config-sync

# --------------------------------------------------------------------------
# 2.  Aggregator job — the *single* required status check
# --------------------------------------------------------------------------
  lint-all:
    name: Lint (all)
    runs-on: ubuntu-latest
    needs: [lint-ruff, lint-pyright, lint-mypy, lint-config-sync]
    if: always()

    steps:
      - name: Fail if any lint job failed
        run: |
          if [ "${{ needs.lint-ruff.result }}" != "success" ] || \
             [ "${{ needs.lint-pyright.result }}" != "success" ] || \
             [ "${{ needs.lint-mypy.result }}" != "success" ] || \
             [ "${{ needs.lint-config-sync.result }}" != "success" ]; then
            echo "::error::At least one lint job failed."
            exit 1
          fi
          echo "All lint jobs passed."
