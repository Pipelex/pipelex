name: Lint check

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
# --------------------------------------------------------------------------
# 1.  Ruff + plxt — single job (target-version = min supported, in pyproject.toml)
# --------------------------------------------------------------------------
  lint-ruff-plxt:
    name: Lint (ruff + plxt)
    runs-on: ubuntu-latest
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      PYTHON_VERSION: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      - name: Run ruff format merge check
        run: make merge-check-ruff-format

      - name: Run ruff lint merge check
        run: make merge-check-ruff-lint

      - name: Run plxt format merge check
        run: make merge-check-plxt-format

      - name: Run plxt lint merge check
        run: make merge-check-plxt-lint

# --------------------------------------------------------------------------
# 2.  Type checking — matrix over supported Python versions
#     Incremental mypy cache restored from prior runs; fresh runs happen
#     post-merge in `lint-fresh-check.yml` to catch any incremental drift.
# --------------------------------------------------------------------------
  lint-typecheck:
    name: Typecheck (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      PYTHON_VERSION: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      - name: Restore mypy cache
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-py${{ matrix.python-version }}-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mypy-py${{ matrix.python-version }}-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-
            mypy-py${{ matrix.python-version }}-${{ runner.os }}-

      - name: Run pyright merge check (Python ${{ matrix.python-version }})
        run: LINT_PYTHON_VERSION=${{ matrix.python-version }} make merge-check-pyright

      - name: Run mypy merge check (Python ${{ matrix.python-version }})
        run: LINT_PYTHON_VERSION=${{ matrix.python-version }} make merge-check-mypy

# --------------------------------------------------------------------------
# 3.  Config sync — single job, version-independent
# --------------------------------------------------------------------------
  lint-config-sync:
    name: Lint (config-sync)
    runs-on: ubuntu-latest
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      PYTHON_VERSION: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      - name: Run config sync check
        run: make check-config-sync

# --------------------------------------------------------------------------
# 4.  Keyword-only convention — single job, version-independent
# --------------------------------------------------------------------------
  lint-keyword-only:
    name: Lint (keyword-only)
    runs-on: [aca-runner-lint]
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      - name: Run keyword-only convention check
        run: make check-keyword-only

# --------------------------------------------------------------------------
# 5.  Drift contracts — single job, version-independent
#     ADVISORY: deliberately NOT in lint-all's `needs`, so an open contract is
#     visible on the PR but does not block merges. Promote it into lint-all's
#     `needs` once the current open-PR backlog has landed.
# --------------------------------------------------------------------------
  lint-drift:
    name: Lint (drift-contracts)
    runs-on: [aca-runner-lint]
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      - name: Run drift contracts check
        run: make drift-check

# --------------------------------------------------------------------------
# 6.  Aggregator job — the *single* required status check
# --------------------------------------------------------------------------
  lint-all:
    name: Lint (all)
    runs-on: ubuntu-latest
    needs: [lint-ruff-plxt, lint-typecheck, lint-config-sync, lint-keyword-only]
    if: always()

    steps:
      - name: Fail if any lint job failed
        run: |
          if [ "${{ needs.lint-ruff-plxt.result }}" != "success" ] || \
             [ "${{ needs.lint-typecheck.result }}" != "success" ] || \
             [ "${{ needs.lint-config-sync.result }}" != "success" ] || \
             [ "${{ needs.lint-keyword-only.result }}" != "success" ]; then
            echo "::error::At least one lint job failed."
            exit 1
          fi
          echo "All lint jobs passed."
