name: Lint check

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
# --------------------------------------------------------------------------
# 1.  Ruff + plxt — single job (target-version = min supported, in pyproject.toml)
# --------------------------------------------------------------------------
  lint-ruff-plxt:
    name: Lint (ruff + plxt)
    runs-on: ubuntu-latest
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      - name: Run ruff format merge check
        run: make merge-check-ruff-format

      - name: Run ruff lint merge check
        run: make merge-check-ruff-lint

      - name: Run plxt format merge check
        run: make merge-check-plxt-format

      - name: Run plxt lint merge check
        run: make merge-check-plxt-lint

# --------------------------------------------------------------------------
# 2.  Type checking — floor Python version only, incremental mypy cache.
#     All 4 supported versions run cache-free on PRs to main in
#     `lint-fresh-check.yml`; here we keep feature PRs fast on py3.11.
# --------------------------------------------------------------------------
  lint-typecheck:
    name: Typecheck (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      - name: Restore mypy cache
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-py${{ matrix.python-version }}-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mypy-py${{ matrix.python-version }}-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-
            mypy-py${{ matrix.python-version }}-${{ runner.os }}-

      - name: Run pyright merge check (Python ${{ matrix.python-version }})
        run: LINT_PYTHON_VERSION=${{ matrix.python-version }} make merge-check-pyright

      - name: Run mypy merge check (Python ${{ matrix.python-version }})
        run: LINT_PYTHON_VERSION=${{ matrix.python-version }} make merge-check-mypy

# --------------------------------------------------------------------------
# 3.  Config sync — single job, version-independent
# --------------------------------------------------------------------------
  lint-config-sync:
    name: Lint (config-sync)
    runs-on: ubuntu-latest
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      - name: Run config sync check
        run: make check-config-sync

# --------------------------------------------------------------------------
# 4.  Keyword-only convention — single job, version-independent
# --------------------------------------------------------------------------
  lint-keyword-only:
    name: Lint (keyword-only)
    runs-on: ubuntu-latest
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      - name: Run keyword-only convention check
        run: make check-keyword-only

# --------------------------------------------------------------------------
# 5.  Hub layering boundary — single job, version-independent
# --------------------------------------------------------------------------
  lint-hub-layering:
    name: Lint (hub layering)
    runs-on: ubuntu-latest
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      - name: Run hub layering check
        run: make check-hub-layering

# --------------------------------------------------------------------------
# 6.  Rich imports — single job, version-independent. Rich is the `cli` extra,
#     so no module outside pipelex/cli/ may import it at module level.
# --------------------------------------------------------------------------
  lint-rich-imports:
    name: Lint (rich imports)
    runs-on: ubuntu-latest
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      - name: Run Rich import check
        run: make check-rich-imports

# --------------------------------------------------------------------------
# 6b. Actions allowlist — single job, version-independent. GitHub rejects a
#     whole workflow at startup when one of its actions is outside the
#     organization's Actions policy, and the release workflows never run on a
#     pull request, so this job reads every workflow against the policy's
#     mirror in .github/actions-allowlist.toml.
# --------------------------------------------------------------------------
  lint-actions-allowlist:
    name: Lint (actions allowlist)
    runs-on: ubuntu-latest
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      - name: Run Actions allowlist check
        run: make check-actions-allowlist

# --------------------------------------------------------------------------
# 6c. Log calls — single job, version-independent (the guard renders each
#     call's signature the same on every supported Python). A message at INFO
#     and above is a literal with its values in fields, and no message holds
#     Rich markup, against the committed log_call_baseline.toml, which only
#     shrinks: the check compares it with the baseline at the pull request's
#     base, fetched here since the checkout holds only the merge commit, and
#     refuses an entry the base does not list.
# --------------------------------------------------------------------------
  lint-log-calls:
    name: Lint (log calls)
    runs-on: ubuntu-latest
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      - name: Fetch the pull request's base
        run: git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"

      - name: Run log-call check
        run: make check-log-calls LOG_CALL_BASELINE_REF="${{ github.event.pull_request.base.sha }}"

# --------------------------------------------------------------------------
# 7.  Drift contracts — single job, version-independent
#     BLOCKING, but through the ruleset rather than through lint-all: `Lint
#     (drift-contracts)` is named as a required status check on both `dev` and
#     `main`, so an open contract already stops the merge. It stays out of
#     lint-all's `needs` so that it reports under its own name — do not "promote"
#     it there expecting that to change what blocks.
# --------------------------------------------------------------------------
  lint-drift:
    name: Lint (drift-contracts)
    runs-on: ubuntu-latest
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      - name: Run drift contracts check
        run: make drift-check

# --------------------------------------------------------------------------
# 8.  Agent rules sync — single job, version-independent
# --------------------------------------------------------------------------
  lint-agent-rules:
    name: Lint (agent-rules)
    runs-on: ubuntu-latest
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      - name: Run agent rules sync check
        run: make check-rules

# --------------------------------------------------------------------------
# 9.  The API server (`api/`, the `pipelex-api` workspace member) — its own
#     ruff, pyright and mypy, and the drift checks of its committed OpenAPI
#     artifact and of its vendored inference tree, in its own environment
#     (`api/.venv`) against the pipelex of this commit. No path filter: the
#     server runs the library of the same commit, so a library change can break
#     it, move its wire or leave its inference tree behind, and this pull
#     request is where that is found. Floor Python only, as for the library; the
#     pre-main gate (`lint-fresh-check.yml`) checks every supported version.
# --------------------------------------------------------------------------
  lint-api:
    name: Lint (api)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the server's environment
        run: PYTHON_VERSION=3.11 make -C api install

      - name: Run ruff format merge check
        run: make -C api merge-check-ruff-format

      - name: Run ruff lint merge check
        run: make -C api merge-check-ruff-lint

      - name: Run pyright merge check
        run: make -C api merge-check-pyright

      - name: Run mypy merge check
        run: make -C api merge-check-mypy

      - name: Check the committed OpenAPI artifact for drift
        run: make -C api openapi-check

      - name: Check the vendored inference tree for drift
        run: make -C api kit-check

# --------------------------------------------------------------------------
# 10. Aggregator job — the required status check that covers every lint job,
#     including the ones the rulesets do not name individually
#     (`Lint (hub layering)`, `Lint (rich imports)`, `Lint (actions allowlist)`,
#     `Lint (log calls)`, `Lint (agent-rules)`, `Lint (api)`). It is not the only required lint check: the rulesets name
#     several of the jobs above by name as well. Anything added to `needs`
#     becomes blocking through here.
# --------------------------------------------------------------------------
  lint-all:
    name: Lint (all)
    runs-on: ubuntu-latest
    needs: [lint-ruff-plxt, lint-typecheck, lint-config-sync, lint-keyword-only, lint-hub-layering, lint-rich-imports, lint-actions-allowlist, lint-log-calls, lint-agent-rules, lint-api]
    if: always()

    steps:
      - name: Fail if any lint job failed
        run: |
          if [ "${{ needs.lint-ruff-plxt.result }}" != "success" ] || \
             [ "${{ needs.lint-typecheck.result }}" != "success" ] || \
             [ "${{ needs.lint-config-sync.result }}" != "success" ] || \
             [ "${{ needs.lint-keyword-only.result }}" != "success" ] || \
             [ "${{ needs.lint-hub-layering.result }}" != "success" ] || \
             [ "${{ needs.lint-rich-imports.result }}" != "success" ] || \
             [ "${{ needs.lint-actions-allowlist.result }}" != "success" ] || \
             [ "${{ needs.lint-log-calls.result }}" != "success" ] || \
             [ "${{ needs.lint-agent-rules.result }}" != "success" ] || \
             [ "${{ needs.lint-api.result }}" != "success" ]; then
            echo "::error::At least one lint job failed."
            exit 1
          fi
          echo "All lint jobs passed."
