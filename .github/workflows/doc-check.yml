name: Documentation Check

on:
  pull_request:

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ github.base_ref == 'main' || steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.base_ref != 'main'
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/doc-check.yml'

  doc-check:
    needs: check-changes
    if: needs.check-changes.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # The docs toolchain comes from uv.lock, the same resolution the deploy builds with.
      - name: Install docs dependencies
        run: uv sync --frozen --no-install-project --extra docs

      - name: Check documentation build
        run: uv run --no-sync mkdocs build --strict
