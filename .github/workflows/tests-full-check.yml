name: Tests full (post-merge guarantee)

# The full Python matrix. PRs run the floor version only (`tests-check.yml`);
# this is where every supported version gets exercised.
#
# Why it is not on PRs: the suite is ~8 min of CPU-bound pytest per version, so
# a 4-version matrix on every push of every PR was the bulk of the CI bill —
# for a signal that almost never differs between versions. Here it runs once
# per merge to main, plus nightly on dev so a version-specific break surfaces
# within a day rather than at release.
#
# Same shape as `lint-fresh-check.yml`: fast on PRs, definitive post-merge.

on:
  push:
    branches:
      - main
  schedule:
    # 03:00 UTC daily — runs against dev (see the checkout ref below).
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to test"
        required: false
        default: "dev"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix-test-full:
    name: Tests full (py${{ matrix.python-version }})
    runs-on: [aca-runner-test]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    permissions:
      contents: read
      id-token: write
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      ENV: dev
      PIPELEX_HANG_DUMP_DIR: /tmp/pipelex-hang-dumps-${{ github.run_id }}-py${{ matrix.python-version }}
    steps:
      # Scheduled runs always fire on the default branch (main), but the branch
      # we actually want nightly coverage on is dev — that is where PRs land.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || inputs.ref || github.sha }}

      - name: Install dependencies
        run: PYTHON_VERSION=${{ matrix.python-version }} make install

      - name: Boot test
        run: make tp TEST=TestFundamentals

      - name: Run tests
        run: make gha-tests

      - name: Show hang dumps
        if: failure()
        run: |
          if ls "$PIPELEX_HANG_DUMP_DIR"/* >/dev/null 2>&1; then
            for dump_file in "$PIPELEX_HANG_DUMP_DIR"/*; do
              echo "::group::$dump_file"
              cat "$dump_file"
              echo "::endgroup::"
            done
          else
            echo "No hang dumps were produced."
          fi
