name: Manual trigger tests check

on:
  pull_request:
    branches:
      - main
      - dev
      - "release/v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  manual-trigger-tests:
    if: |
      github.event_name == 'workflow_dispatch' || !(github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    environment:
      name: manual-trigger-tests-check
      url: ${{ github.server_url }}/${{ github.repository }}/deployments/activity_log?environment=manual-trigger-tests-check
    steps:
      - name: Initialize check
        run: |
          echo "Initializing manual trigger tests check..."
          echo "PR Base: ${{ github.event.pull_request.base.ref }}"
          echo "PR Head: ${{ github.event.pull_request.head.ref }}"

  # This job runs automatically for release PRs to main, otherwise waits for manual approval
  matrix-test:
    name: Manual trigger tests check
    # Conditional dependency: only depend on manual-trigger-tests if it's needed
    needs: [manual-trigger-tests]
    if: |
      always() && 
      (needs.manual-trigger-tests.result == 'success' || 
       needs.manual-trigger-tests.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    permissions:
      contents: read
      id-token: write
      packages: read
      actions: read
      repository-projects: read
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      ENV: dev

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::975050286103:role/GitHubActionsRole
          aws-region: eu-west-3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check UV installation
        run: make check-uv

      - name: Verify UV installation
        run: uv --version

      - name: Install dependencies
        run: PYTHON_VERSION=${{ matrix.python-version }} make install

      - name: Boot test
        run: make tp TEST=TestFundamentals

      - name: Run tests
        run: make run-manual-trigger-gha-tests
