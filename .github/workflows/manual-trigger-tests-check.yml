name: Manual trigger tests check

on:
  pull_request:
    branches:
      - manual-trigger-tests-check
      # - main
      # - dev
      # - "release/v[0-9]+.[0-9]+.[0-9]+"
  # workflow_dispatch:

# No pipelex process a job starts reports anonymous usage statistics (docs/setup/usage-statistics.md).
env:
  DO_NOT_TRACK: "1"

jobs:
  manual-trigger-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize check
        run: |
          echo "Initializing manual trigger tests check..."

  matrix-test:
    name: Manual trigger tests check
    needs: [manual-trigger-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    permissions:
      contents: read
      id-token: write
      packages: read
      actions: read
      repository-projects: read
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      ENV: dev

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::975050286103:role/GitHubActionsRole
          aws-region: eu-west-3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check UV installation
        run: make check-uv

      - name: Verify UV installation
        run: uv --version

      - name: Install dependencies
        run: make install

      - name: Boot test
        run: make tp TEST=TestFundamentals

      - name: Run tests
        run: make run-manual-trigger-gha-tests

      - name: The interpreter is the one this job names
        run: .venv/bin/python -c 'import sys; want = "${{ matrix.python-version }}"; got = "%d.%d" % sys.version_info[:2]; assert got == want, f"ran {got}, expected {want}"'
