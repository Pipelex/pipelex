name: package-check

on:
  pull_request:

jobs:
  uv-lock-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Check requires-python floor stays at >=3.10
        run: |
          if ! grep -qE "^[[:space:]]*requires-python[[:space:]]*=[[:space:]]*['\"][^'\"]*>=3\.10([^0-9A-Za-z][^'\"]*)?['\"]" pyproject.toml; then
            echo "❌ requires-python must start at >=3.10 — pipelex core supports Python 3.10+."
            echo "The Mistral Workflows orchestration integration that needs Python 3.12 ships as the"
            echo "separate pipelex-mistralai-workflows package; do not raise pipelex's own floor for it."
            exit 1
          fi
          echo "✅ requires-python floor is >=3.10"

      - name: Check if uv.lock is up to date
        run: |
          uv lock --locked
          if ! git diff --exit-code uv.lock; then
            echo "❌ uv.lock is out of date!"
            echo "Please run 'uv lock' to update the lock file."
            exit 1
          else
            echo "✅ uv.lock is up to date!"
          fi
