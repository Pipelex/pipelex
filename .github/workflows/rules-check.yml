name: Rules check

on:
  pull_request:

jobs:
  rules:
    name: Check agent rules are up to date
    runs-on: ubuntu-latest
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install
        run: make install

      - name: Run pipelex kit rules command
        run: |
          source .venv/bin/activate
          pipelex kit rules
          # Check if any files were modified
          if ! git diff --exit-code > /dev/null 2>&1; then
            echo "::error::The 'pipelex kit rules' command modified files. Please run 'pipelex kit rules' and commit the changes."
            echo ""
            echo "Modified files:"
            git diff --name-only
            echo ""
            echo "Diff summary:"
            git diff --stat
            exit 1
          fi
          
          # Also check for untracked files
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::The 'pipelex kit rules' command created new files. Please commit them."
            echo ""
            echo "New files:"
            git ls-files --others --exclude-standard
            exit 1
          fi
          
          echo "✅ Agent rules are up to date."

