# The CLA Assistant. Its steps are shared by every Pipelex repository, from
# https://github.com/Pipelex/.github/tree/main/actions/cla; this file is identical in each of them.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - uses: Pipelex/.github/actions/cla@main
        with:
          app-id: ${{ secrets.CLA_GH_APP_ID }}
          private-key: ${{ secrets.CLA_GH_APP_PRIVATE_KEY }}
          allowlist: ${{ vars.CLA_ALLOWLIST }}
