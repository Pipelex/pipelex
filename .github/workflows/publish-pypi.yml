name: Publish Python 🐍 distribution 📦 to PyPI

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - "pre-release/v*"
  # Manual retry. A publish that fails after the merge (a rejected upload, an
  # expired token) is otherwise unrecoverable: re-running a run replays the
  # workflow file it started with, and the only other trigger is merging a PR
  # into main — which the branch guard restricts to release/vX.Y.Z branches.
  workflow_dispatch:

jobs:
  build:
    name: Build distribution 📦
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read # reading this run's own artifact list, below

    steps:
      # A manual run can target any ref that contains this workflow, and every
      # job below builds and publishes whatever it checks out — so an unguarded
      # dispatch could push a feature branch to production PyPI and tag it.
      # guard-branches.yml cannot help: it only runs on pull_request_target.
      # Restrict manual runs to the refs a publish can legitimately come from;
      # pull_request runs are already constrained by their base branch.
      - name: Verify the dispatched ref may publish
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "Dispatched from $REF"
          if [[ "$REF" != "refs/heads/main" ]] \
            && [[ ! "$REF" =~ ^refs/heads/release/v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            && [[ ! "$REF" =~ ^refs/heads/pre-release/v ]]; then
            echo "::error::Manual publish is allowed only from main, release/vX.Y.Z or pre-release/v*. Got: $REF"
            exit 1
          fi
      # A recovery re-run — the one the signing fallback in `github-release`
      # prescribes — must attach and sign the exact bytes the first attempt
      # published, because PyPI's copies of them are immutable. Rebuilding cannot
      # promise that: `[build-system] requires = ["hatchling"]` names no version,
      # so a hatchling release landing between two attempts changes the output of
      # the same commit, and GitHub would then serve — and Sigstore would attest —
      # dists that differ from the ones on PyPI. Artifacts are scoped to the run
      # rather than to the attempt, so the build the first attempt stored is still
      # here; reuse it and skip the rest of this job.
      #
      # This covers "Re-run all jobs". It cannot cover the `workflow_dispatch`
      # retry, which is a NEW run and so holds no earlier artifact and rebuilds.
      # The tag guard in `github-release` does not close that gap either — it
      # compares commits, and this is the same commit built twice. Open as
      # L-260920-487091; prefer re-running this run over dispatching a new one.
      - name: Look for a build stored by an earlier attempt
        id: earlier_build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "python-package-distributions")]
                  | if length == 0 then "absent"
                    elif any(.expired) then "expired"
                    else "present" end')
          case "$STATE" in
            present)
              echo "An earlier attempt stored a build — reusing it."
              echo "reuse=true" >> "$GITHUB_OUTPUT"
              ;;
            expired)
              echo "::error::The build stored by an earlier attempt has expired, so this run can no longer reproduce the dists it published. Publish a new version instead of re-running this one."
              exit 1
              ;;
            *)
              echo "reuse=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - uses: actions/checkout@v4
        if: steps.earlier_build.outputs.reuse != 'true'
        with:
          persist-credentials: false
      - name: Set up Python
        if: steps.earlier_build.outputs.reuse != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pypa/build
        if: steps.earlier_build.outputs.reuse != 'true'
        run: >-
          python3 -m
          pip install
          build
          --user
      - name: Build a binary wheel and a source tarball
        if: steps.earlier_build.outputs.reuse != 'true'
        run: python3 -m build
      # Deliberately no `overwrite`: artifacts are immutable in v4, and the guard
      # above means this step is reached only when the run holds no build yet. A
      # second attempt reuses the first one's bytes rather than replacing them.
      - name: Store the distribution packages
        if: steps.earlier_build.outputs.reuse != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pipelex
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution 📦 to PyPI
        # v1.13.0+ bundles Twine 7, which accepts core metadata 2.5. The
        # previous pin did not, so the first v0.43.0 upload was rejected on a
        # wheel hatchling had built correctly.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Only a retry may skip an already-published version, which is what the
          # signing fallback below tells the operator to do: PyPI files are
          # immutable, so on a second pass this step would otherwise die on the
          # already-published version and `github-release` — which needs this job —
          # would never get to attach the missing signatures.
          #
          # Both of this repo's retry paths are named, and neither implies the
          # other. "Re-run all jobs" reuses the run, so it raises `run_attempt`.
          # The `workflow_dispatch` above is the retry this workflow documents for
          # itself, and it is a NEW run whose `run_attempt` is 1.
          #
          # It stays off for an ordinary merge deliberately. Letting a merge that
          # kept the current version publish "successfully" would carry it into
          # `github-release`, where `--clobber` would replace the tagged release's
          # dists with a build of the newer commit while PyPI kept serving the
          # originals. Failing here is what keeps that release intact — and the tag
          # guard there is what keeps it intact on the two paths this flag opens.
          skip-existing: ${{ github.run_attempt > 1 || github.event_name == 'workflow_dispatch' }}

  github-release:
    name: >-
      Create GitHub Release with Changelog
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    needs:
      - build
      - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write # IMPORTANT: mandatory for making GitHub Releases
      id-token: write # IMPORTANT: mandatory for sigstore

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Extract version and detect pre-release
        id: get_version
        run: |
          VERSION=$(grep -m 1 'version = ' pyproject.toml | cut -d '"' -f 2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          # Detect if version is a pre-release (PEP 440: contains a, b, or rc)
          if [[ "$VERSION" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            echo "Detected pre-release version: $VERSION"
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
            echo "Detected stable version: $VERSION"
          fi
      # `skip-existing` above opens on a re-run and on a manual dispatch, which
      # separates a retry from a first pass but not a legitimate recovery (this
      # commit published, Sigstore then failed) from a retry of a pass that failed
      # *because* an earlier commit had already published this version. In that
      # second case skipping turns PyPI's duplicate rejection into success and
      # carries the run down here, where `--clobber` would replace the tagged
      # release's dists with this commit's build while PyPI kept serving the
      # originals. The tag settles which case this is: it exists only once a
      # release has shipped this version, and it names the commit that shipped it.
      # Absent — the first pass died between the PyPI upload and `gh release
      # create` — is allowed through, because blocking it would break the very
      # recovery the fallback exists to enable. Pointing elsewhere is not.
      #
      # Uses the commits endpoint so an annotated tag resolves to its commit
      # rather than to the tag object, and distinguishes "no such tag" from "the
      # API could not answer": a guard that reads an outage, a rate limit or a bad
      # token as "untagged" disarms itself exactly when it is least able to tell
      # what it is letting through.
      - name: Refuse to touch a release that shipped a different commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # `gh` writes its error body to stdout rather than stderr, so a failed
          # call still fills $BODY — with the failure, not with a commit.
          if BODY=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$VERSION" 2>/dev/null); then
            TAGGED_SHA=$(jq -r '.sha' <<<"$BODY")
          else
            case "$(jq -r '.status // empty' <<<"$BODY" 2>/dev/null || true)" in
              404|422)
                # No such tag: the first pass died between the PyPI upload and
                # `gh release create`. This is the recovery path, and it proceeds.
                TAGGED_SHA=""
                ;;
              *)
                # Anything else — 5xx, a rate limit, a bad token, or a transport
                # failure that left no body at all — leaves the question open.
                # `//` cannot supply the fallback here: on an empty body `jq`
                # emits nothing rather than null, so the shell applies it instead.
                REASON=$(jq -r '.message // empty' <<<"$BODY" 2>/dev/null || true)
                echo "::error::Could not determine whether v$VERSION is already tagged: ${REASON:-the GitHub API call returned no response body}. Refusing to touch the release without knowing which commit it shipped."
                exit 1
                ;;
            esac
          fi
          if [ -n "$TAGGED_SHA" ] && [ "$TAGGED_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::v$VERSION is already tagged at $TAGGED_SHA, but this run is building $GITHUB_SHA. Refusing to replace that release's artifacts with a different commit's build. Bump the version instead of re-running this workflow."
            exit 1
          fi
      - name: Extract changelog notes for current version
        id: get_changelog
        run: |
          VERSION="${{ env.VERSION }}"
          echo "Extracting changelog for version v$VERSION"

          # Find the start of the current version section
          START_LINE=$(grep -n "## \[v$VERSION\] - " CHANGELOG.md | cut -d: -f1)

          if [ -z "$START_LINE" ]; then
            echo "Warning: No changelog entry found for version v$VERSION"
            echo "CHANGELOG_NOTES=" >> $GITHUB_ENV
            exit 0
          fi

          # Find the start of the next version section (previous version)
          NEXT_VERSION_LINE=$(tail -n +$((START_LINE + 1)) CHANGELOG.md | grep -n "^## \[v.*\] - " | head -1 | cut -d: -f1)

          if [ -z "$NEXT_VERSION_LINE" ]; then
            # No next version found, extract from current version till end of file
            CHANGELOG_CONTENT=$(tail -n +$START_LINE CHANGELOG.md)
          else
            # Extract content from current version header to before next version
            END_LINE=$((START_LINE + NEXT_VERSION_LINE - 1))
            CHANGELOG_CONTENT=$(sed -n "$START_LINE,$((END_LINE - 1))p" CHANGELOG.md)
          fi

          # Clean up the content but preserve the blank line after the header
          # First, get the header line and add a blank line after it
          HEADER_LINE=$(echo "$CHANGELOG_CONTENT" | head -1)
          CONTENT_LINES=$(echo "$CHANGELOG_CONTENT" | tail -n +2 | sed '/^$/d' | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')

          # Combine header + blank line + content
          CHANGELOG_CONTENT=$(printf "%s\n\n%s" "$HEADER_LINE" "$CONTENT_LINES")

          # Escape for GitHub Actions
          echo "CHANGELOG_NOTES<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG_CONTENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      # Ordering is deliberate: the release is created BEFORE the dists are signed,
      # and signing is allowed to fail. The tag exists only as a side effect of
      # `gh release create`, so while signing sat ahead of this step a Sigstore
      # outage cost us the GitHub Release *and* the tag — v0.52.0 published to PyPI
      # and then vanished from this repo when the pinned action died on a refreshed
      # trust root ("root was signed by 0/3 keys"). Attestation is a nice-to-have;
      # the tag is the record of what shipped.
      - name: Create or update the GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Set pre-release flag if version is a pre-release
          PRERELEASE_FLAG=""
          TITLE_SUFFIX=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
            TITLE_SUFFIX=" (Pre-release)"
          fi

          if [ -n "$CHANGELOG_NOTES" ]; then
            NOTES="$CHANGELOG_NOTES"
          else
            NOTES="Release v$VERSION"
          fi

          # `create` fails outright when the release already exists, which made the
          # workflow_dispatch retry path above unusable precisely when it was needed.
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — updating it."
            gh release edit "v$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "v$VERSION$TITLE_SUFFIX" \
              --notes "$NOTES" \
              $PRERELEASE_FLAG
          else
            gh release create "v$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "v$VERSION$TITLE_SUFFIX" \
              --generate-notes \
              --notes "$NOTES" \
              $PRERELEASE_FLAG
          fi
      # Attach the artifacts straight away, so a signing failure cannot leave the
      # release standing empty next to a populated PyPI page.
      - name: Upload the dists to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release upload
          "v$VERSION" dist/*.whl dist/*.tar.gz
          --repo "$GITHUB_REPOSITORY"
          --clobber
      - name: Sign the dists with Sigstore
        id: sign
        # A Sigstore trust-root refresh is outside our control and must not fail a
        # release that has already published. The signatures are uploaded below only
        # when this succeeds, and a skipped signing is reported as a warning.
        continue-on-error: true
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
      - name: Upload artifact signatures to GitHub Release
        if: steps.sign.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Only the bundles signing just produced (`{input}.sigstore.json`). The
        # `dist/**` glob this used to carry expands as `dist/*` in the runner's
        # bash, which has no `globstar` — so it also matched the wheel and sdist
        # attached above, and `--clobber` deletes an asset before uploading its
        # replacement. A transient failure here therefore stripped the release of
        # the very dists the previous step exists to secure, undoing that step's
        # own guarantee.
        run: >-
          gh release upload
          "v$VERSION" dist/*.sigstore.json
          --repo "$GITHUB_REPOSITORY"
          --clobber
      - name: Report an unsigned release
        if: steps.sign.outcome != 'success'
        run: >-
          echo "::warning::Sigstore signing failed. v$VERSION is released and its
          dists are attached, but it carries no signature bundles. Once Sigstore is
          healthy, use 'Re-run all jobs' on this run to attach them — signing is
          non-fatal, so this job succeeded and 'Re-run failed jobs' is not offered.
          Re-running this run reuses the build it already published rather than
          making a new one, so prefer it over a fresh manual dispatch."
