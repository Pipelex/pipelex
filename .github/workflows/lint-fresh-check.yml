name: Lint fresh (pre-main gate)

# Gate on PRs targeting main (the release PRs, dev -> main). Re-runs the
# read-only lint suite across every supported Python version with NO mypy cache
# — the step list below is the authority on which checks that is; do not restate
# it here, an enumeration in a comment goes stale the next time a check is added.
# Feature PRs to dev run it fast on py3.11 with a warm cache (lint-check.yml);
# before anything reaches main it must also pass this clean, all-versions,
# cache-free run, so incremental-mypy drift or a version-specific break can never
# land on main. A version-independent check needs no place here to be enforced on
# main: lint-check.yml runs on every pull request and its `Lint (all)` aggregate
# is a required status check on `main` as well as on `dev`.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-fresh:
    name: Lint fresh (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      # No mypy cache restore anywhere in this workflow — the clean run is the point.

      - name: Run ruff format merge check
        run: make merge-check-ruff-format

      - name: Run ruff lint merge check
        run: make merge-check-ruff-lint

      - name: Run plxt format merge check
        run: make merge-check-plxt-format

      - name: Run plxt lint merge check
        run: make merge-check-plxt-lint

      - name: Run config sync check
        run: make check-config-sync

      - name: Run keyword-only convention check
        run: make check-keyword-only

      - name: Run hub layering check
        run: make check-hub-layering

      - name: Run Rich import check
        run: make check-rich-imports

      # The baseline only shrinks: a pull request is compared with the baseline at
      # its base, fetched since the checkout holds only the merge commit. A manual
      # run has no base to compare with, and says so.
      - name: Run log-call check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            make check-log-calls LOG_CALL_BASELINE_REF="$BASE_SHA"
          else
            echo "A ${{ github.event_name }} run has no pull request base: the log-call baseline is checked against the tree, without the comparison that refuses an added entry."
            make check-log-calls
          fi

      - name: Run drift contracts check
        run: make drift-check

      - name: Run pyright merge check (Python ${{ matrix.python-version }})
        run: LINT_PYTHON_VERSION=${{ matrix.python-version }} make merge-check-pyright

      - name: Run mypy merge check (Python ${{ matrix.python-version }}, fresh)
        run: LINT_PYTHON_VERSION=${{ matrix.python-version }} make merge-check-mypy

      # The API server (`api/`), checked the same way in its own environment: `Lint (api)` in
      # lint-check.yml checks it on the floor version on every pull request, and this leg adds the
      # version this matrix row names, so the versions its classifiers claim are the ones checked.
      - name: Install the API server's environment
        run: PYTHON_VERSION=3.11 make -C api install

      - name: Run the API server's ruff merge checks
        run: make -C api merge-check-ruff-format merge-check-ruff-lint

      - name: Run the API server's pyright merge check (Python ${{ matrix.python-version }})
        run: LINT_PYTHON_VERSION=${{ matrix.python-version }} make -C api merge-check-pyright

      - name: Run the API server's mypy merge check (Python ${{ matrix.python-version }}, fresh)
        run: LINT_PYTHON_VERSION=${{ matrix.python-version }} make -C api merge-check-mypy

      - name: Run the API server's drift checks
        run: make -C api openapi-check kit-check

# --------------------------------------------------------------------------
#  Aggregator — single required status check for the gate.
# --------------------------------------------------------------------------
  lint-fresh-all:
    name: Lint fresh (all)
    runs-on: ubuntu-latest
    needs: [lint-fresh]
    if: always()

    steps:
      - name: Fail unless every version passed
        run: |
          if [ "${{ needs.lint-fresh.result }}" != "success" ]; then
            echo "::error::At least one fresh lint version failed."
            exit 1
          fi
          echo "All fresh lint versions passed."
