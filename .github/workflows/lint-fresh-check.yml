name: Lint fresh (post-merge guarantee)

# Runs on push to dev/main and weekly on a cron. No mypy cache restore — a
# from-scratch type-check that acts as the safety net behind the cached PR
# checks in lint-check.yml. If incremental mypy ever quietly drifts from what
# a fresh run would say, this catches it within minutes of merge (or once a
# week on the cron) instead of letting bad state accumulate.

on:
  # ⛔ TEMPORARY — REMOVE BEFORE MERGING #924 ⛔
  # Present only so this workflow can be proven on PR #924. It is push/cron-only
  # by design; leaving this in makes the fresh 4-version typecheck run on every
  # PR, which is exactly the cost we are cutting.
  pull_request:
  push:
    branches:
      - dev
      - main
  schedule:
    # Mondays at 04:00 UTC — catches drift even on quiet weeks.
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-fresh:
    name: Typecheck fresh (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      PYTHON_VERSION: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      # No mypy cache restore here — that is the whole point of this workflow.

      - name: Run pyright merge check (Python ${{ matrix.python-version }})
        run: LINT_PYTHON_VERSION=${{ matrix.python-version }} make merge-check-pyright

      - name: Run mypy merge check (Python ${{ matrix.python-version }}, fresh)
        run: LINT_PYTHON_VERSION=${{ matrix.python-version }} make merge-check-mypy

      # Seed the base-branch cache for PRs. Actions caches are scoped by ref: a
      # PR can restore from its own ref or from the base/default branch, and
      # `lint-check.yml` is pull_request-only — so nothing ever wrote an entry
      # PRs could read, and every PR's first run type-checked from cold. This
      # workflow runs on dev/main and produces a *fresh* cache, which is the
      # ideal seed. Save only (no restore) keeps this run honest.
      # ⛔ `|| github.event_name == 'pull_request'` is TEMPORARY — REMOVE BEFORE
      # MERGING #924. It exists so this step is observed executing on the PR.
      # Caveat: on a PR the cache saves to the PR's own ref scope, so this
      # proves the step runs and writes — it CANNOT prove that a PR restores
      # from a dev-scoped entry. That only happens on a real push to dev.
      - name: Seed mypy cache for PR runs
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .mypy_cache
          key: mypy-py${{ matrix.python-version }}-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.sha }}
