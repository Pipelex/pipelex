name: Lint fresh (pre-main gate)

# Gate on PRs targeting main (the release PRs, dev -> main). Full Python matrix,
# NO mypy cache restore — a from-scratch type-check. Feature PRs to dev run the
# fast cached typecheck in lint-check.yml; before anything reaches main it must
# also pass a clean, all-versions, cache-free run, so incremental-mypy drift or
# a version-specific type break can never land on main.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-fresh:
    name: Typecheck fresh (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      # No mypy cache restore here — that is the whole point of this workflow.

      - name: Run pyright merge check (Python ${{ matrix.python-version }})
        run: LINT_PYTHON_VERSION=${{ matrix.python-version }} make merge-check-pyright

      - name: Run mypy merge check (Python ${{ matrix.python-version }}, fresh)
        run: LINT_PYTHON_VERSION=${{ matrix.python-version }} make merge-check-mypy
