name: Lint fresh (pre-main gate)

# Gate on PRs targeting main (the release PRs, dev -> main). The FULL lint suite
# (the read-only equivalent of `make c`: ruff, plxt, config-sync, keyword-only,
# drift, pyright, mypy) across every supported Python version, with NO mypy
# cache. Feature PRs to dev run the same suite fast on py3.11 with a warm cache
# (lint-check.yml); before anything reaches main it must also pass this clean,
# all-versions, cache-free run — so incremental-mypy drift or a version-specific
# break can never land on main.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-fresh:
    name: Lint fresh (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      # No mypy cache restore anywhere in this workflow — the clean run is the point.

      - name: Run ruff format merge check
        run: make merge-check-ruff-format

      - name: Run ruff lint merge check
        run: make merge-check-ruff-lint

      - name: Run plxt format merge check
        run: make merge-check-plxt-format

      - name: Run plxt lint merge check
        run: make merge-check-plxt-lint

      - name: Run config sync check
        run: make check-config-sync

      - name: Run keyword-only convention check
        run: make check-keyword-only

      - name: Run hub layering check
        run: make check-hub-layering

      - name: Run drift contracts check
        run: make drift-check

      - name: Run pyright merge check (Python ${{ matrix.python-version }})
        run: LINT_PYTHON_VERSION=${{ matrix.python-version }} make merge-check-pyright

      - name: Run mypy merge check (Python ${{ matrix.python-version }}, fresh)
        run: LINT_PYTHON_VERSION=${{ matrix.python-version }} make merge-check-mypy

# --------------------------------------------------------------------------
#  Aggregator — single required status check for the gate.
# --------------------------------------------------------------------------
  lint-fresh-all:
    name: Lint fresh (all)
    runs-on: ubuntu-latest
    needs: [lint-fresh]
    if: always()

    steps:
      - name: Fail unless every version passed
        run: |
          if [ "${{ needs.lint-fresh.result }}" != "success" ]; then
            echo "::error::At least one fresh lint version failed."
            exit 1
          fi
          echo "All fresh lint versions passed."
