name: Tests check

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
# --------------------------------------------------------------------------
# 1.  Tests — floor Python version only.
#     The full 3.11-3.14 matrix runs post-merge in `tests-full-check.yml`.
#     Same trade as the mypy cache: fast on PRs, definitive on main. A
#     version-specific break is caught by the nightly rather than by every
#     push of every PR, which is what the 4x matrix was actually costing.
# --------------------------------------------------------------------------
  matrix-test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: [aca-runner-test]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    permissions:
      contents: read
      id-token: write
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      ENV: dev
      PIPELEX_HANG_DUMP_DIR: /tmp/pipelex-hang-dumps-${{ github.run_id }}-py${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: PYTHON_VERSION=${{ matrix.python-version }} make install

      - name: Boot test
        run: make tp TEST=TestFundamentals

      - name: Run tests
        run: make gha-tests

      - name: Show hang dumps
        if: failure()
        run: |
          if ls "$PIPELEX_HANG_DUMP_DIR"/* >/dev/null 2>&1; then
            for dump_file in "$PIPELEX_HANG_DUMP_DIR"/*; do
              echo "::group::$dump_file"
              cat "$dump_file"
              echo "::endgroup::"
            done
          else
            echo "No hang dumps were produced."
          fi

# --------------------------------------------------------------------------
# 2.  TEMPORARY — head-to-head timing against a free GitHub-hosted runner.
#     Azure gives 8 vCPU per replica, ubuntu-latest gives 4, and ~87% of this
#     job is CPU-bound `pytest -n auto`. This measures what that core count is
#     actually worth so the self-hosting decision rests on a number.
#     Advisory only (continue-on-error, not in `tests-all`). DELETE once the
#     runner decision is made — see docs/contribute/ci-runners.md.
# --------------------------------------------------------------------------
  bench-github-hosted:
    name: Bench (py3.11 on ubuntu-latest)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      ENV: dev
      PIPELEX_HANG_DUMP_DIR: /tmp/pipelex-hang-dumps-${{ github.run_id }}-bench
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 make install

      - name: Run tests
        run: make gha-tests

# --------------------------------------------------------------------------
# 3.  Aggregator job — the *single* required status check
# --------------------------------------------------------------------------
  tests-all:
    name: Tests (all)
    runs-on: ubuntu-latest
    needs: [matrix-test]
    if: always()

    steps:
      - name: Fail if any test job failed
        run: |
          if [ "${{ needs.matrix-test.result }}" != "success" ]; then
            echo "::error::At least one test job failed."
            exit 1
          fi
          echo "All test jobs passed."
