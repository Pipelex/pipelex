name: Tests check

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
# --------------------------------------------------------------------------
# 1.  Tests — floor Python version, sharded across free GitHub-hosted runners.
#     The full 3.11-3.14 matrix runs post-merge in `tests-full-check.yml`.
#     Same trade as the mypy cache: fast on PRs, definitive on main.
#
#     Sharding: the CPU-bound suite (~2400s of test-time) is split into 8
#     groups balanced by the committed .test_durations file, each running on a
#     free ubuntu-latest runner. 8 free 4-vCPU runners beat one paid 8-vCPU
#     Azure box on wall clock (~2m vs 6m20s) at zero cost — vertical scale is
#     what Azure sells; horizontal scale is free and unlimited on this plan.
#     Refresh .test_durations with `make store-test-durations` (incremental —
#     it measures only tests missing from the map). What unbalances the groups
#     is missing coverage, not stale values: see docs/contribute/test-duration-map.md.
# --------------------------------------------------------------------------
  matrix-test:
    name: Tests (py3.11, shard ${{ matrix.group }}/8)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      ENV: dev
      PIPELEX_HANG_DUMP_DIR: /tmp/pipelex-hang-dumps-${{ github.run_id }}-shard${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 make install

      # Fast install-health canary on one shard only: a broken install fails
      # every shard identically, so paying the boot smoke test 8x is waste.
      - name: Boot test
        if: matrix.group == 1
        run: make tp TEST=TestFundamentals

      - name: Run tests (shard ${{ matrix.group }}/8)
        run: SPLITS=8 GROUP=${{ matrix.group }} make gha-tests

      - name: Show hang dumps
        if: failure()
        run: |
          if ls "$PIPELEX_HANG_DUMP_DIR"/* >/dev/null 2>&1; then
            for dump_file in "$PIPELEX_HANG_DUMP_DIR"/*; do
              echo "::group::$dump_file"
              cat "$dump_file"
              echo "::endgroup::"
            done
          else
            echo "No hang dumps were produced."
          fi

# --------------------------------------------------------------------------
# 2.  TypeScript emission gates — the two codegen tests that need node.
#     The shards above run them too, and there they skip: `prettier --check`
#     is the only test that PARSES the emitted TypeScript, and the zod round
#     trip is the only one that EXECUTES it, so with no node toolchain the
#     emitter's whole content contract was unguarded — three defects reached
#     review that way, each caught afterwards by a hand-written assertion.
#     This job provisions a pinned toolchain and sets PIPELEX_REQUIRE_TS_GATES,
#     under which those tests fail instead of skipping. One job, not a node
#     step on all 8 shards: the codegen suite is seconds and lands in one shard.
# --------------------------------------------------------------------------
  ts-emission-gates:
    name: Tests (ts emission gates)
    runs-on: ubuntu-latest
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      ENV: dev
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # >= 22.6 for `--experimental-strip-types`, which is what lets node run the emitted `.ts`.
      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: PYTHON_VERSION=3.11 TEST_PROFILE=ci make install

      - name: Run the TypeScript emission gates
        run: make test-ts-gates

# --------------------------------------------------------------------------
# 3.  The API server (`api/`, the `pipelex-api` workspace member) — its unit
#     tests, in its own environment (`api/.venv`) against the pipelex of this
#     commit. No path filter, for the reason `Lint (api)` gives: a library change
#     can break the server. Floor Python only; the pre-main gate
#     (`tests-full-check.yml`) runs every supported version.
# --------------------------------------------------------------------------
  api-tests:
    name: Tests (api)
    runs-on: ubuntu-latest
    env:
      ENV: dev
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the server's environment
        run: PYTHON_VERSION=3.11 make -C api install

      - name: Run the server's tests
        run: make -C api gha-tests

# --------------------------------------------------------------------------
# 4.  The release's packages, built as the release builds them but published
#     nowhere: the `pipelex` and `pipelex-api` wheels and sdists, the exact pin
#     the `pipelex-api` metadata must carry on the `pipelex` of the same version
#     (`api/scripts/check_lockstep_pin.py`, which `publish-pypi.yml` runs before
#     it uploads), and the two wheels installed together into a bare environment
#     with the server imported from it, as `pip install pipelex-api` does once
#     both are on PyPI. The third-party versions are the lock's, so an upstream
#     release cannot fail this gate; catching that is `dependency-canary.yml`'s job.
# --------------------------------------------------------------------------
  packages:
    name: Tests (packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build the pipelex and pipelex-api distributions
        run: |
          uv build --package pipelex --out-dir dist
          uv build --package pipelex-api --out-dir dist

      - name: Check that the pipelex-api distributions pin pipelex exactly
        run: python3 api/scripts/check_lockstep_pin.py dist

      - name: Install the two wheels together and import the server
        run: |
          uv export --frozen --no-hashes --no-dev --no-emit-workspace --package pipelex-api -o "$RUNNER_TEMP/locked-versions.txt"
          uv venv "$RUNNER_TEMP/packages-venv" --python 3.11
          uv pip install --python "$RUNNER_TEMP/packages-venv/bin/python" --constraint "$RUNNER_TEMP/locked-versions.txt" \
            dist/pipelex-*.whl dist/pipelex_api-*.whl
          "$RUNNER_TEMP/packages-venv/bin/python" -c "import pipelex_api.main"

# --------------------------------------------------------------------------
# 5.  The server's image, built from the repository root as the release builds
#     it (`make -C api docker-build`) and smoke-tested (`make -C api
#     docker-smoke`): it boots, answers /health, and reports this version for
#     both the server and the pipelex it runs. Nothing is pushed; the push is
#     `publish-docker-hub.yml`, from the release commit.
# --------------------------------------------------------------------------
  api-image:
    name: Tests (api image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: make -C api docker-build

      - name: Boot the image and check the versions it reports
        run: make -C api docker-smoke

# --------------------------------------------------------------------------
# 6.  Aggregator job — the *single* required status check
#     Guards against a silently-dropped shard: fails unless ALL 8 succeed, and
#     carries every other test job above into the required check with them.
# --------------------------------------------------------------------------
  tests-all:
    name: Tests (all)
    runs-on: ubuntu-latest
    needs: [matrix-test, ts-emission-gates, api-tests, packages, api-image]
    if: always()

    steps:
      - name: Fail if any test job failed
        run: |
          if [ "${{ needs.matrix-test.result }}" != "success" ] || \
             [ "${{ needs.ts-emission-gates.result }}" != "success" ] || \
             [ "${{ needs.api-tests.result }}" != "success" ] || \
             [ "${{ needs.packages.result }}" != "success" ] || \
             [ "${{ needs.api-image.result }}" != "success" ]; then
            echo "::error::At least one test job failed."
            exit 1
          fi
          echo "All test jobs passed."
