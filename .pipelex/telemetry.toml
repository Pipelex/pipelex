####################################################################################################
# Custom Telemetry Configuration
####################################################################################################
#
# This file controls YOUR custom telemetry settings for observability and analytics.
# Configure your own PostHog, Langfuse, or OTLP-compatible backends here.
#
# NOTE: When using Pipelex Gateway, identified telemetry is automatically enabled
# (tied to your Gateway API key, hashed for security). This allows us to monitor
# service quality, enforce fair usage, and provide you with better support.
# Gateway telemetry operates independently from your settings below - you can have both!
#
# Documentation: https://docs.pipelex.com
# Support: https://go.pipelex.com/discord
#
####################################################################################################

telemetry_mode = "off"                                               # Values: "off" | "anonymous" | "identified"
host = "https://us.i.posthog.com"                                    # US region (or "https://eu.i.posthog.com" for EU)
project_api_key = "phc_YOUR_POSTHOG_PROJECT_API_KEY"                 # Get from PostHog Project Settings
respect_dnt = true
redact = ["prompt", "system_prompt", "response", "file_path", "url"]
geoip_enabled = true
dry_mode_enabled = false
verbose_enabled = false
# user_id = "set_if_mode_is_identified"
ai_tracing_enabled = false      # Enable OpenTelemetry tracing for AI operations
capture_content_enabled = false # Controls gen_ai.prompt/completion content capture for OTel
# capture_content_max_length = 1000                                  # Max length for captured content (omit for unlimited)
capture_pipe_codes_enabled = false        # Controls whether pipe codes appear in span names/attributes
capture_output_class_name_enabled = false # Controls whether output class names appear in span names/attributes
langfuse_enabled = false                  # Langfuse Integration (requires LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY env vars)
# langfuse_base_url = "https://cloud.langfuse.com"  # Override for self-hosted Langfuse
# otlp_endpoint = "https://..."
# otlp_headers = { "Authorization" = "Bearer ..." }
