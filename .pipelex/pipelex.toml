####################################################################################################
# Pipelex Configuration File
####################################################################################################
#
# This configuration file is copied to client projects' .pipelex/ directory when running:
#   `pipelex init config`
#
# Purpose:
# - This file allows you to override Pipelex's default settings for specific projects
# - All values below are set to their defaults - modify them as needed
# - The values here will override the defaults from the Pipelex package
#
# Finding Available Settings:
# - See the full default configuration in: pipelex/pipelex.toml (in the Pipelex package)
# - See the configuration structure classes in: pipelex/config.py and pipelex/cogt/config_cogt.py
#
# Common customizations include:
# - Logging levels and behavior
# - Excluded directories for scanning
# - LLM prompt dumping for debugging
# - Feature flags
# - Observer and reporting output directories
#
# Documentation: https://docs.pipelex.com
# Support: https://go.pipelex.com/discord
#
####################################################################################################

####################################################################################################
# Pipeline Execution Config
####################################################################################################

[pipelex.pipeline_execution_config]
# Set to false to disable conversion of incoming data URLs to pipelex-storage:// URIs
is_normalize_data_urls_to_storage = true
# Set to false to disable generation of execution graphs
is_generate_graph = true

# Bounded fan-out concurrency for PipeBatch: at most this many branches run at once.
# Set max_concurrency = "unbounded" to disable the bound.
max_concurrency = 8

[pipelex.pipeline_execution_config.graph_config.data_inclusion]
# Control what data is included in graph outputs
stuff_json_content = true
stuff_text_content = true
stuff_html_content = true
error_stack_traces = true
pipe_and_concept_registry = true

[pipelex.pipeline_execution_config.graph_config.graphs_inclusion]
# Control which graph outputs are generated
graphspec_json = true
mermaidflow_mmd = true
mermaidflow_html = true
reactflow_html = true

[pipelex.pipeline_execution_config.graph_config.reactflow_config]
# Customize ReactFlow graph rendering
edge_type = "bezier" # Options: "bezier", "smoothstep", "step", "straight"
nodesep = 50         # Horizontal spacing between nodes
ranksep = 30         # Vertical spacing between ranks/levels
initial_zoom = 1.0   # Initial zoom level (1.0 = 100%)
pan_to_top = true    # Pan to show top of graph on load

[pipelex.pipeline_execution_config.graph_config.reactflow_config.style]
theme = "dark"
palette = "dracula"

####################################################################################################
# Tracing Config (event log for distributed tracing across Temporal workers)
####################################################################################################

[pipelex.tracing_config]
is_enabled = true
backend = "ndjson"

[pipelex.tracing_config.ndjson]
traces_dir = ".pipelex/traces"

[pipelex.tracing_config.dynamodb]
table_name = ""
region = ""

[pipelex.tracing_config.temporal_dynamodb]
table_name = ""
region = ""

####################################################################################################
# Storage Config
####################################################################################################

[pipelex.storage_config]
# Whether to fetch remote HTTP URLs and store them locally
is_fetch_remote_content_enabled = true
# Whether to upload local file paths to storage and replace with pipelex-storage:// URIs
is_upload_local_content_enabled = true
# Storage method: "local", "in_memory", "s3", or "gcp"
method = "local"

[pipelex.storage_config.local]
# Local storage settings
uri_format = "{primary_id}/{secondary_id}/{hash}.{extension}"
local_storage_path = ".pipelex/storage"

[pipelex.storage_config.in_memory]
# In-memory storage settings
uri_format = "{primary_id}/{secondary_id}/{hash}.{extension}"

[pipelex.storage_config.s3]
# AWS S3 storage settings (requires boto3: `uv pip install "pipelex[s3]"`)
uri_format = "{primary_id}/{secondary_id}/{hash}.{extension}"
bucket_name = ""
region = ""
signed_urls_lifespan_seconds = 3600                           # Set to "disabled" for public URLs

[pipelex.storage_config.gcp]
# Google Cloud Storage settings (requires google-cloud-storage: `uv pip install "pipelex[gcp-storage]"`)
uri_format = "{primary_id}/{secondary_id}/{hash}.{extension}"
bucket_name = ""
project_id = ""
signed_urls_lifespan_seconds = 3600                           # Set to "disabled" for public URLs

####################################################################################################
# Scan Config
####################################################################################################

[pipelex.scan_config]
# Directories to exclude when scanning for pipeline files
excluded_dirs = [
  ".venv",
  "venv",
  "env",
  ".env",
  "virtualenv",
  ".virtualenv",
  ".git",
  "__pycache__",
  ".pytest_cache",
  ".mypy_cache",
  ".ruff_cache",
  "node_modules",
  "results",
]

####################################################################################################
# Builder Config
####################################################################################################

[pipelex.builder_config]
# Settings for generated pipelines
default_output_dir = "."
default_bundle_file_name = "bundle"
default_directory_base_name = "pipeline"

####################################################################################################
# Log Config
####################################################################################################

[pipelex.log_config]
# Default logging level: "DEBUG", "INFO", "WARNING", "ERROR"
default_log_level = "INFO"
# Log output target: "stdout" or "stderr"
console_log_target = "stderr"
console_print_target = "stderr"

[pipelex.log_config.package_log_levels]
# Log levels for specific packages (use "-" instead of "." in package names)
pipelex = "INFO"

####################################################################################################
# Feature Config
####################################################################################################

[pipelex.feature_config]
# WIP/Experimental feature flags
is_reporting_enabled = true

####################################################################################################
# Reporting Config
####################################################################################################

[pipelex.reporting_config]
# Cost reporting settings
is_log_costs_to_console = false
is_generate_cost_report_file_enabled = false
cost_report_dir_path = "reports"
cost_report_base_name = "cost_report"
cost_report_extension = "csv"
cost_report_unit_scale = 1.0

####################################################################################################
# Cogt (Cognitive Tools) Config
####################################################################################################

[cogt.model_deck_config]
# Model fallback behavior: if true, uses secondary model options when primary fails
is_model_fallback_enabled = true
# Reaction to missing presets: "raise", "log", or "none"
missing_presets_reaction = "log"

[cogt.llm_config]
# Enable dumping of LLM inputs/outputs for debugging
is_dump_text_prompts_enabled = false
is_dump_response_text_enabled = false

[cogt.llm_config.instructor_config]
# Enable dumping of structured content generation details for debugging
is_dump_kwargs_enabled = false
is_dump_response_enabled = false
is_dump_error_enabled = false

####################################################################################################
# Temporal Config
####################################################################################################

[temporal]
is_enabled = false

# Custom Temporal search attributes Pipelex populates on every workflow start
# so the dashboard can group/filter by PipeCode, PipelineRunId, SessionId,
# UserId, and DomainCode. Set `enabled = false` to skip both the worker-boot
# registration check and the per-workflow attribute attachment — useful when
# the operator owns the namespace policy and can't grant search-attribute
# admin to the worker.
[temporal.search_attributes]
enabled = true
attributes = ["PipeCode", "PipelineRunId", "SessionId", "UserId", "DomainCode"]

[temporal.payload_codec_config]
is_enabled = false
size_threshold = 1_048_576            # in bytes (~1 MB, well under Temporal's 2 MB hard limit)
storage_prefix = "temporal-payloads/"

[temporal.payload_codec_config.storage_provider_config]
method = "local"

[temporal.payload_codec_config.storage_provider_config.local]
uri_format = "{hash}"
local_storage_path = ".pipelex/temporal-payload-store"

[temporal.worker_config]
default_task_queue = "temporal_task_queue"
workflow_execution_timeout = "1:00:00"     # workflow-level budget (not the activity timeout)
run_timeout = "1:00:00"
task_timeout = "0:00:10"
start_delay = "0:00:00"
rpc_timeout = "1:00:00"
# Baseline activity timeout. Per-queue and per-handle overlays in
# [temporal.queue_options] / activity_queues.*.handle_options can override.
default_activity_start_to_close_timeout = "0:10:00"
# Per-activity, per-handle routing. Empty by default — every activity lands on
# `default_task_queue` above (same as legacy behavior). Populate this to route
# activities to dedicated worker pools (e.g. OpenAI vs Anthropic, a heavy-payload
# image pool, isolated Mistral OCR), with optional per-handle queue overrides and
# rare per-handle option overrides. See pipelex/kit/configs/pipelex.toml for the
# full schema and examples.
[temporal.worker_config.activity_queues]

[temporal.worker_config.retry_policy_config]
initial_interval = "0:00:03"
backoff_coefficient = 2.0
maximum_interval = "unlimited"
maximum_attempts = 3
non_retryable_error_types = [
  "ExtractHandleNotFoundError",
  "FileNotFoundError",
  "ImgGenHandleNotFoundError",
  "LLMHandleNotFoundError",
  "ModelNotFoundError",
  "ValidationError",
]
# Per-queue / per-handle overlays add to the list above via the layer-specific
# `non_retryable_error_types_extra` field (see the commented example below).
# That field belongs only on overlays — the baseline schema deliberately does
# not accept it.

# Per-queue submitter options. Layer on top of worker_config defaults at
# dispatch time. Add `[temporal.queue_options.<queue>]` entries to match each
# backend pool's latency/retry profile (timeouts, retry policy, cluster-wide
# rate caps). See pipelex/kit/configs/pipelex.toml for examples.
[temporal.queue_options]

# Default cluster-wide rate cap on the worker's home queue. Mirrors the pre-v2
# hardcoded `max_task_queue_activities_per_second=1000` so existing deployments
# on `temporal_task_queue` keep the same server-enforced cap.
[temporal.queue_options.temporal_task_queue]
max_task_queue_activities_per_second = 1000

# Named worker-runtime profiles. A worker process selects one via `--profile`.
# The `default` profile below mirrors the pre-v2 hardcoded knobs, so default
# behavior is unchanged. Add more profiles to shape pools differently — e.g.
# small concurrency on a GPU pool sitting next to a high-throughput LLM pool.
# See pipelex/kit/configs/pipelex.toml for examples.
[temporal.worker_runtime_profiles]
default_profile = "default"

[temporal.worker_runtime_profiles.profiles.default]
tuning_mode = "explicit"
max_cached_workflows = 10000
max_concurrent_workflow_tasks = 1000
max_concurrent_activities = 1000
max_concurrent_local_activities = 1000
max_concurrent_workflow_task_polls = 100
max_concurrent_activity_task_polls = 100
max_activities_per_second = 1000
sticky_queue_schedule_to_start_timeout = "0:30:00"
max_heartbeat_throttle_interval = "1:00:00"
default_heartbeat_throttle_interval = "1:00:00"
graceful_shutdown_timeout = "0:30:00"

[temporal.temporal_config]
selected_server = "local"

[temporal.temporal_config.temporal_server_configs.local]
description = "default localhost"
target_host = "localhost:7233"
namespace = "default"
api_key_method = "none"
api_key_id = ""

[temporal.temporal_config.temporal_server_configs.testing]
description = "Temporal server for testing"
target_host = "${TESTING_TEMPORAL_TARGET_HOST}"
namespace = "${TESTING_TEMPORAL_NAMESPACE}"
api_key_method = "secret_provider"
api_key_id = "${TESTING_TEMPORAL_MAIN_API_KEY}"

[temporal.temporal_config.temporal_log_config]
is_workflow_info_on_message = false
is_workflow_info_on_extra = true
is_full_workflow_info_on_extra = false
is_activity_info_on_message = false
is_activity_info_on_extra = true
is_full_activity_info_on_extra = false
is_formatter_enabled = true
is_prefix_enabled = true
managed_loggers = [
  "temporalio.activity",
  "temporalio.workflow",
  "temporalio.worker._activity",
]
