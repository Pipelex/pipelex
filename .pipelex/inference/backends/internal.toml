################################################################################
# Internal Backend Configuration
################################################################################
#
# This file defines the model specifications for internal software-only models.
# These models run internally without external APIs or AI services.
#
# Configuration structure:
# - Each model is defined in its own section with the model name as the header
# - Model costs are in USD per million tokens (input/output)
#
# Documentation: https://docs.pipelex.com
# Support: https://go.pipelex.com/discord
#
################################################################################

################################################################################
# MODEL DEFAULTS
################################################################################

[defaults]
thinking_mode = "none"

################################################################################
# TEXT EXTRACTION MODELS
################################################################################

# --- PyPDFium2 Text Extractor -------------------------------------------------
[pypdfium2-extract-pdf]
model_type = "text_extractor"
sdk = "pypdfium2"
model_id = "extract-text"
inputs = ["pdf"]
outputs = ["pages"]
costs = {}

# --- Docling Text Extractor ---------------------------------------------------
[docling-extract-text]
model_type = "text_extractor"
sdk = "docling_sdk"
model_id = "extract-text"
inputs = ["pdf", "image"]
outputs = ["pages"]
costs = {}

################################################################################
# DOCUMENT GENERATION ENGINES
################################################################################
#
# The engines a PipeDocGen step prints with. Their inputs are the sources they
# print from: "layout" is the auto-layout of the step's inputs, "html" an HTML
# template, "template_file" an office template file. Their outputs are the
# formats they print. reportlab-pdf is built into Pipelex; the others come with
# the Pipelex document generation plugin, pipelex-doc-gen.

# --- ReportLab PDF ------------------------------------------------------------
[reportlab-pdf]
model_type = "doc_gen"
sdk = "reportlab"
model_id = "print-pdf"
inputs = ["layout"]
outputs = ["pdf"]
costs = {}

# --- WeasyPrint PDF -----------------------------------------------------------
[weasyprint-pdf]
model_type = "doc_gen"
sdk = "weasyprint"
model_id = "print-pdf"
inputs = ["html", "layout"]
outputs = ["pdf"]
costs = {}

# --- openpyxl Excel -----------------------------------------------------------
[openpyxl-xlsx]
model_type = "doc_gen"
sdk = "openpyxl"
model_id = "write-xlsx"
inputs = ["layout", "template_file"]
outputs = ["xlsx"]
costs = {}

# --- docxtpl Word -------------------------------------------------------------
[docxtpl-docx]
model_type = "doc_gen"
sdk = "docxtpl"
model_id = "write-docx"
inputs = ["layout", "template_file"]
outputs = ["docx"]
costs = {}

# --- python-pptx PowerPoint ---------------------------------------------------
[python-pptx]
model_type = "doc_gen"
sdk = "python_pptx"
model_id = "write-pptx"
inputs = ["template_file"]
outputs = ["pptx"]
costs = {}
