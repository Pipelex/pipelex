# Routing profile library - Routes models to their backends
# ================================================
# This file controls which backend serves which model.
# Simply change the 'active' field to switch configurations.

# Which configuration to use (change this to switch routing)
active = "all_azure_openai"

# ============================================
# Configuration Profiles
# ============================================

[configs.all_pipelex]
description = "Use Pipelex Inference backend for all models"
default = "pipelex-inference"

[configs.all_anthropic]
description = "Use Anthropic backend for all supported models"
default = "anthropic"

[configs.all_azure_openai]
description = "Use Azure OpenAI backend for all supported models"
default = "azure_openai"

[configs.custom_routing]
description = "Custom routing"
default = "pipelex-inference"  # Fallback for unmatched models

[configs.custom_routing.routes]
# Pattern matching: "model-pattern" = "backend-name"
"gpt-*" = "pipelex-inference"
"claude-*" = "pipelex-inference"
"gemini-*" = "pipelex-inference"
"grok-*" = "pipelex-inference"
"*-sdxl" = "pipelex-inference"


# ============================================
# Custom Configurations
# ============================================
# Add your own configurations below following the same pattern:
#
# [configs.your_config_name]
# description = "What this configuration does"
# default = "backend-name"  # Where to route models by default
# [configs.your_config_name.routes]
# "model-pattern" = "backend-name"  # Specific routing rules
#
# Pattern matching supports:
# - Exact names: "gpt-4o-mini"
# - Wildcards: "claude-*" (matches all models starting with claude-)
# - Partial wildcards: "*-sonnet" (matches all sonnet variants)

