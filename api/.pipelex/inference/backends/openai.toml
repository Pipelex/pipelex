################################################################################
# OpenAI Backend Configuration
################################################################################
#
# This file defines the model specifications for OpenAI models.
# It contains model definitions for various LLM and image generation models
# accessible through the OpenAI API.
#
# Configuration structure:
# - Each model is defined in its own section with the model name as the header
# - Headers with dots must be quoted (e.g., ["gpt-5.4"])
# - Model costs are in USD per million tokens (input/output)
#
# Documentation: https://docs.pipelex.com
# Support: https://go.pipelex.com/discord
#
################################################################################

################################################################################
# MODEL DEFAULTS
################################################################################

[defaults]
model_type = "llm"
sdk = "openai_responses"
structure_method = "instructor/openai_responses_tools"
thinking_mode = "none"

################################################################################
# LANGUAGE MODELS
################################################################################

# --- GPT-4o Series ------------------------------------------------------------
[gpt-4o]
inputs = ["text", "images", "pdf"]
outputs = ["text", "structured"]
costs = { input = 2.5, output = 10.0 }

[gpt-4o-mini]
inputs = ["text", "images", "pdf"]
outputs = ["text", "structured"]
costs = { input = 0.15, output = 0.6 }

# --- GPT-5.3 Series -------------------------------------------------------------
["gpt-5.3-codex"]
inputs = ["text", "images", "pdf"]
outputs = ["text", "structured"]
costs = { input = 1.75, output = 14.0 }
valued_constraints = { fixed_temperature = 1 }
thinking_mode = "manual"

# --- GPT-5.4 Series -----------------------------------------------------------
["gpt-5.4"]
inputs = ["text", "images", "pdf"]
outputs = ["text", "structured"]
costs = { input = 2.5, output = 15.0 }
thinking_mode = "manual"

["gpt-5.4-pro"]
inputs = ["text", "images", "pdf"]
outputs = ["text", "structured"]
costs = { input = 30.0, output = 180.0 }
valued_constraints = { fixed_temperature = 1 }
thinking_mode = "manual"

["gpt-5.4-mini"]
inputs = ["text", "images", "pdf"]
outputs = ["text", "structured"]
costs = { input = 0.75, output = 4.5 }
thinking_mode = "manual"

["gpt-5.4-nano"]
inputs = ["text", "images", "pdf"]
outputs = ["text", "structured"]
costs = { input = 0.2, output = 1.25 }
thinking_mode = "manual"

# --- GPT-5.5 Series -----------------------------------------------------------
["gpt-5.5"]
inputs = ["text", "images", "pdf"]
outputs = ["text", "structured"]
costs = { input = 5.0, output = 30.0 }
valued_constraints = { fixed_temperature = 1 }
thinking_mode = "manual"

# --- GPT-5.6 Series -----------------------------------------------------------
["gpt-5.6-sol"]
inputs = ["text", "images", "pdf"]
outputs = ["text", "structured"]
costs = { input = 4.0, output = 20.0 }
valued_constraints = { fixed_temperature = 1 }
thinking_mode = "manual"

["gpt-5.6-terra"]
inputs = ["text", "images", "pdf"]
outputs = ["text", "structured"]
costs = { input = 2.0, output = 12.0 }
valued_constraints = { fixed_temperature = 1 }
thinking_mode = "manual"

["gpt-5.6-luna"]
inputs = ["text", "images", "pdf"]
outputs = ["text", "structured"]
costs = { input = 0.2, output = 1.2 }
valued_constraints = { fixed_temperature = 1 }
thinking_mode = "manual"

# --- GPT-6 Series -------------------------------------------------------------
["gpt-6-astra"]
inputs = ["text", "images", "pdf"]
outputs = ["text", "structured"]
costs = { input = 10.0, output = 50.0 }
valued_constraints = { fixed_temperature = 1 }
thinking_mode = "manual"

################################################################################
# IMAGE GENERATION MODELS
################################################################################

# --- OpenAI Image Generation --------------------------------------------------
[gpt-image-1]
sdk = "openai_img_gen"
model_type = "img_gen"
inputs = ["text", "images"]
outputs = ["image"]
costs = { input = 10, output = 40 }

[gpt-image-1.rules]
model_choice = "model_id"
prompt = "positive_only"
num_images = "gpt_image"
aspect_ratio = "gpt_image_legacy"
background = "available"
inference = "gpt_image"
safety_checker = "openai_moderation"
output_format = "gpt_image_legacy"
output_compression = "gpt_image_legacy"
input_images = "gpt_image"
input_fidelity = "gpt_image_legacy"

