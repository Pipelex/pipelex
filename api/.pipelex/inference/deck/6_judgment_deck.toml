####################################################################################################
# Pipelex Model Deck - Judgment Configuration
####################################################################################################
#
# This file defines model aliases and presets for Judgment models — models that answer
# closed-form questions (yes/no, choice, rating) over some material, with a measure of
# how sure they are.
#
# Managed by `pipelex update`. To customize without conflict, create an
# x_custom_*.toml file in this directory — pipelex never tracks or
# overwrites x_custom_* files. Local edits to this file are backed up
# to <file>.bak.<timestamp> on update but will not survive future runs.
#
# Model Reference Syntax:
# - Preset:    $preset_name or preset:preset_name
# - Alias:     @alias_name or alias:alias_name
#
# Documentation: https://docs.pipelex.com
# Support: https://go.pipelex.com/discord
#
####################################################################################################

####################################################################################################
# Judgment Default Choice
####################################################################################################
#
# There is deliberately no `choice_default` here, and that is what tells you no judgment model is
# served out of the box: a judgment backend is one you bring, so a pipe names the model it judges
# with until the Pipelex Gateway serves the family. Set one here once you have a backend configured.

[judgment]

####################################################################################################
# Aliases
####################################################################################################
#
# A judgment alias points at a VERSIONED model id, never at a provider's `latest` alias: a verdict
# model that changes under a method silently changes what every threshold in that method means.
#
# `jev-1.13.0` is TypeSafe's. Its next version is found on the provider's models page and not through
# its API, whose model listing names only the moving aliases — moving this pin is a documentation read.

[judgment.aliases]
default-judgment = "jev-1.13.0"

####################################################################################################
# Judgment Presets
####################################################################################################

[judgment.presets]
